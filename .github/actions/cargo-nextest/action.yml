name: cargo-nextest
description: >-
  Puts the pinned cargo-nextest release on this job's PATH after checking the download against
  its SHA-256. DST Nightly runs each simulation test in its own process with it.
runs:
  using: composite
  steps:
    - name: Install cargo-nextest 0.9.148
      shell: bash
      env:
        URL: https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.148/cargo-nextest-0.9.148-x86_64-unknown-linux-gnu.tar.gz
        SHA256: 223ba936714cc861a9cdedad5a8eb664dfdd69d6fbdf6cea6aa8184f523290dc
      run: |
        dir="$RUNNER_TEMP/cargo-nextest"
        mkdir -p "$dir"
        curl --proto '=https' --tlsv1.2 --retry 5 -fsSL "$URL" -o "$dir.tar.gz"
        echo "$SHA256  $dir.tar.gz" | sha256sum --check --strict
        tar -xzf "$dir.tar.gz" -C "$dir"
        echo "$dir" >> "$GITHUB_PATH"
        "$dir/cargo-nextest" nextest --version

name: PyPI Publish

# Publishes clients/sqlite-ursula-python to PyPI as `sqlite-ursula`: one py3-none wheel per platform
# with the SQLite extension (clients/sqlite-vfs) prebuilt under sqlite_ursula/_lib/, and the
# py3-none-any wheel without one, so the package installs anywhere. No sdist.
#
# source -> wheels (sqlite-ursula-python-wheels.yml: build, pack and check, smoke on each platform)
# -> publish. With dry_run, the default, the run stops before publish, and the wheels are the run's
# `python-wheels` artifact. The version is the package's own, which scripts/check-release-versions.sh
# keeps equal to the release's in its PEP 440 form (scripts/python-version.sh), or with `dev` the
# pre-release `.devN` of the next patch.
#
# A release publishes only from its tag: without `dev`, the run must be dispatched on the tag
# v<release> that names the commit it builds (gh workflow run pypi-publish.yml --ref v<release>
# -f ref=v<release> -f dry_run=false). A `.devN` pre-release publishes from any ref, `main` for
# dogfooding. A version already on PyPI fails the run before anything is built, since PyPI never
# takes a version twice. Running a failed run's failed jobs again skips the wheels already uploaded.
#
# publish uses trusted publishing: PyPI's publisher for `sqlite-ursula` trusts this workflow
# (pypi-publish.yml) in the `pypi` environment, and pypa/gh-action-pypi-publish trades the job's
# GitHub OIDC token (id-token: write) for a short-lived upload token, and attaches PEP 740
# attestations. No secret is involved. The `pypi` environment's deployment policy allows the tags
# `v*`, for releases, and the branch `main`, for `.devN` pre-releases, with a required reviewer.
# PyPI accepts no reusable workflow as a trusted publisher, so only the build is shared with
# npm-publish.yml.

run-name: pypi ${{ inputs.dry_run == false && 'publish' || 'dry run' }} of ${{ inputs.ref }}${{ inputs.dev != '' && format(' (dev{0})', inputs.dev) || '' }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build
        required: true
        default: main
        type: string
      dev:
        description: "N for the pre-release <next patch>.devN (0.11.2.dev0 from 0.11.1). Empty for the package's own version"
        required: false
        default: ""
        type: string
      dry_run:
        description: Build, check and smoke-test the wheels, but do not publish them
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  source:
    name: Resolve ${{ inputs.ref }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      version: ${{ steps.resolve.outputs.version }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: The package's version is the release's
        run: ./scripts/check-release-versions.sh

      # Every later job builds this commit, even if the ref moves meanwhile. Only an explicit
      # dry_run=false publishes.
      - name: Resolve the commit and the version
        id: resolve
        env:
          DEV: ${{ inputs.dev }}
          DRY_RUN: ${{ inputs.dry_run }}
          RUN_REF: ${{ github.ref }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          version=$(sed -n 's/^__version__ = "\([^"]*\)"$/\1/p' clients/sqlite-ursula-python/src/sqlite_ursula/__init__.py)
          if [ -n "$DEV" ]; then
            if ! [[ "$DEV" =~ ^(0|[1-9][0-9]*)$ ]]; then
              echo "::error::dev is a number, not $DEV"
              exit 1
            fi
            if ! [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(\.post[1-9][0-9]*)?$ ]]; then
              echo "::error::the package's version $version is not a release's"
              exit 1
            fi
            version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((10#${BASH_REMATCH[3]} + 1)).dev$DEV"
          fi
          if [ "$DRY_RUN" = false ]; then dry_run=false; else dry_run=true; fi
          # The attestations name the commit the run was dispatched on as the wheels' source.
          if [ "$dry_run" = false ] && [ "$sha" != "$RUN_SHA" ]; then
            echo "::error::ref is $sha, but the run is on $RUN_SHA. Dispatch the workflow on the ref you publish (gh workflow run pypi-publish.yml --ref <ref> -f ref=<ref>), so the attestations name the commit the wheels are built from."
            exit 1
          fi
          # A release's version publishes only from its tag, which names this commit: PyPI never
          # takes the version again, so it must be the released code. Tags are annotated, so the
          # tag's commit is its peeled (^{}) entry.
          if [ "$dry_run" = false ] && [ -z "$DEV" ]; then
            tag=${RUN_REF#refs/tags/}
            if [[ "$RUN_REF" != refs/tags/v* ]] || [ "$(./scripts/python-version.sh "${tag#v}" 2>/dev/null)" != "$version" ]; then
              echo "::error::sqlite-ursula $version publishes only from its release tag, and the run is on $RUN_REF. Dispatch it on the tag (--ref v<release> -f ref=v<release>), or set dev for a pre-release."
              exit 1
            fi
            tagged=$(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}" |
              awk '$2 ~ /\^\{\}$/ { peeled = $1 } { plain = $1 } END { print (peeled != "" ? peeled : plain) }')
            if [ "$tagged" != "$sha" ]; then
              echo "::error::the tag $tag on origin names ${tagged:-nothing}, not $sha"
              exit 1
            fi
          fi
          # PyPI takes a version once, so publishing one it has would upload nothing. A dry run
          # only notes it.
          status=$(curl -sS -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/sqlite-ursula/$version/json" || true)
          if [ "$status" = 200 ]; then
            if [ "$dry_run" = false ]; then
              echo "::error::sqlite-ursula $version is already on PyPI. Pick another dev number, or rerun the failed jobs of the run that published it."
              exit 1
            fi
            echo "::notice::sqlite-ursula $version is already on PyPI"
          elif [ "$status" != 404 ] && [ "$dry_run" = false ]; then
            echo "::error::PyPI answered $status for sqlite-ursula $version, so whether it has it is unknown"
            exit 1
          fi
          printf 'sha=%s\nversion=%s\ndry_run=%s\n' "$sha" "$version" "$dry_run" >>"$GITHUB_OUTPUT"
          echo "sqlite-ursula $version from $sha (dry run: $dry_run)" >>"$GITHUB_STEP_SUMMARY"

  wheels:
    name: Wheels
    needs: source
    uses: ./.github/workflows/sqlite-ursula-python-wheels.yml
    with:
      ref: ${{ needs.source.outputs.sha }}
      version: ${{ needs.source.outputs.version }}

  publish:
    name: Publish
    needs: [source, wheels]
    if: needs.source.outputs.dry_run == 'false'
    # GitHub-hosted, as PyPI's trusted publishing and attestations expect.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/sqlite-ursula/${{ needs.source.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - name: Download the wheels
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: python-wheels
          path: dist

      # Before publishing, so a failed publish still leaves the exact wheels to retry with.
      - name: Upload the wheels
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: python-packages
          path: dist
          if-no-files-found: error
          retention-days: 30

      # A wheel already on PyPI is skipped, so the failed jobs of a run can be run again.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          skip-existing: true

name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - release/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.workflow_sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  infrastructure:
    name: Helm
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Before anything slow. The stable release workflow publishes every
      # artifact at this version before creating the immutable tag, so this is
      # the last place a forgotten bump costs a commit instead of a release.
      - name: Release versions agree
        run: |
          ./scripts/test_validate_release_version.sh
          ./scripts/check-release-versions.sh

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Create disposable Kubernetes cluster
        uses: helm/kind-action@v1.14.0

      - name: Validate Helm chart
        run: |
          helm lint charts/ursula
          helm template ursula charts/ursula --namespace ursula -f charts/ursula/examples/production-eks.yaml >/dev/null
          python3 scripts/helm_template_test.py
          bash charts/ursula/files/graceful-rollout_test.sh
          sh scripts/helm_ondelete_upgrade_test.sh
          helm lint charts/ursula-chaos
          helm template ursula-chaos charts/ursula-chaos --namespace ursula >/dev/null
          python3 scripts/chaos_helm_template_test.py
          (cd scripts && python3 -m unittest ursula_chaos_agent_test)

  rust-lint:
    name: Rust lint
    # Fork PRs run on GitHub-hosted runners: RunsOn runners run inside our AWS account.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || format('runs-on={0}/cpu=8/ram=32/family=m7a+m8a/image=ubuntu24-full-x64/extras=s3-cache', github.run_id) }}
    steps:
      # Sends actions/cache to the RunsOn S3 cache. A no-op on GitHub-hosted runners.
      - name: Use the RunsOn cache
        uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      # Pure Python and fast. The simulation itself runs in dst-nightly.yml.
      - name: Audit DST guards
        run: python3 -m scripts.dst all

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # `cargo publish` builds each crate alone, without the features that
      # other crates' dev-dependencies turn on in a workspace build.
      - name: Build each published crate alone
        run: |
          for crate in $(python3 -c 'import json, subprocess; m = json.loads(subprocess.check_output(["cargo", "metadata", "--locked", "--no-deps", "--format-version", "1"])); print(" ".join(p["name"] for p in m["packages"] if p.get("publish") is None or "crates-io" in p["publish"]))'); do
            echo "::group::$crate"
            RUSTFLAGS="-D warnings" cargo check --locked -p "$crate"
            echo "::endgroup::"
          done

  rust-test:
    name: Rust tests (${{ matrix.arch }})
    runs-on: ${{ github.event.pull_request.head.repo.fork && matrix.hosted || format(matrix.runs-on, github.run_id) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            hosted: ubuntu-24.04
            runs-on: runs-on={0}/cpu=8/ram=32/family=m7a+m8a/image=ubuntu24-full-x64/extras=s3-cache
          - arch: arm64
            hosted: ubuntu-24.04-arm
            runs-on: runs-on={0}/cpu=8/ram=32/family=m8g+m7g/image=ubuntu24-full-arm64/extras=s3-cache
    steps:
      # Sends actions/cache to the RunsOn S3 cache. A no-op on GitHub-hosted runners.
      - name: Use the RunsOn cache
        uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Test workspace units and binaries
        run: cargo test --workspace --lib --bins

      - name: Test runtime integration
        run: cargo test -p ursula-runtime --test s3_cold_path

      - name: Test static cluster integration
        run: cargo test -p ursula --test static_cluster_cli

      - name: Test workspace docs
        run: cargo test --workspace --doc

  docs:
    name: Docs build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: docs/web
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build docs (latest and archived versions)
        run: npm run build:all

      - name: Verify versioned output
        run: node scripts/docs-versions.mjs verify

name: Memory soak

# Write-overload memory soak: 3 nodes + gateway + S3 (AWS S3 in CI, MinIO for fork PRs), many
# SQLite-VFS-shaped owners appending flat out (clients/sqlite-ursula/test/soak.e2e.ts). Node RSS
# must stay bounded — overload has to reach clients as 503/429 pushback, not as server memory
# growth (the EKS OOM of 2026-10: ~0.7 GB/min per node at 128 owners; here, before the fix,
# ~4 GB/min to 6 GB in 80 s).
#
# The vfs-outage job holds the SQLite VFS's M1 exit criterion: a ten-minute outage in front of the
# model server, as a blackhole and as refused connections, ends with no reset and a full catch-up
# (clients/sqlite-ursula/test/outage.e2e.ts, 60 s on every PR in integration.yml). It also runs
# weekly and on pushes to main that change the extension. The S3 soak runs on PRs and by hand only.

on:
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.lock"
      - "clients/sqlite-ursula/**"
      - "clients/sqlite-vfs/**"
      - ".github/workflows/memory-soak.yml"
      - ".github/actions/ci-s3/**"
      - "scripts/minio_ci.sh"
  push:
    branches:
      - main
    paths:
      - "clients/sqlite-vfs/**"
  schedule:
    # Mondays, 04:17 UTC: the outage job only.
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      seconds:
        description: Load duration in seconds
        default: "300"
      owners:
        description: Concurrent owners
        default: "128"
      outage_seconds:
        description: SQLite VFS outage duration in seconds, per mode
        default: "600"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build-ursula:
    name: Build release ursula
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    # Fork PRs run on GitHub-hosted runners: RunsOn runners run inside our AWS account.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || format('runs-on={0}/cpu=8/ram=32/family=m7a+m8a/image=ubuntu24-full-x64/extras=s3-cache', github.run_id) }}
    steps:
      # Sends actions/cache to the RunsOn S3 cache. A no-op on GitHub-hosted runners.
      - name: Use the RunsOn cache
        uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          rustflags: ""

      - name: Build ursula
        run: cargo build --release -p ursula --bin ursula

      - name: Upload ursula
        uses: actions/upload-artifact@v6
        with:
          name: ursula-soak-release
          path: target/release/ursula
          if-no-files-found: error
          retention-days: 3

  soak:
    name: Soak (${{ github.event.inputs.owners || '128' }} owners)
    needs: build-ursula
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || format('runs-on={0}/cpu=8/ram=32/family=m7a+m8a/image=ubuntu24-full-x64/extras=s3-cache', github.run_id) }}
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    env:
      # Keeps the job's OIDC request variables out of npm and test processes: a speed bump against
      # env-scraping code, not a boundary.
      NO_OIDC: env -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_ID_TOKEN_REQUEST_TOKEN
    steps:
      # Sends actions/cache to the RunsOn S3 cache. A no-op on GitHub-hosted runners.
      - name: Use the RunsOn cache
        uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Download ursula
        uses: actions/download-artifact@v7
        with:
          name: ursula-soak-release
          path: ${{ runner.temp }}/ursula-bin

      # Before any AWS credential exists. The tree's install scripts are not needed.
      - name: Install dependencies
        run: |
          chmod +x "$RUNNER_TEMP/ursula-bin/ursula"
          free -m
          nproc
          cd clients/sqlite-ursula
          $NO_OIDC npm ci --ignore-scripts

      # AWS S3 through the CI role (one prefix per job) on same-repo PRs and main, MinIO otherwise.
      - name: S3 backend
        id: s3
        uses: ./.github/actions/ci-s3
        with:
          role-arn: ${{ secrets.URSULA_CI_AWS_ROLE_ARN }}
          bucket: ${{ secrets.URSULA_CI_S3_BUCKET }}
          region: ${{ vars.URSULA_CI_S3_REGION || 'us-east-1' }}
          job-key: soak

      - name: Soak
        timeout-minutes: 30
        env:
          SOAK_SECONDS: ${{ github.event.inputs.seconds || '300' }}
          SOAK_OWNERS: ${{ github.event.inputs.owners || '128' }}
        run: |
          cd clients/sqlite-ursula
          E2E_NODES=3 E2E_GROUPS=32 E2E_CORES=2 E2E_LOG_DIR="$RUNNER_TEMP/soak-logs" \
            SOAK_OUT="$RUNNER_TEMP/soak-logs/samples.jsonl" SOAK_MAX_RSS_MB=3072 SOAK_ABORT_RSS_MB=6144 \
            URSULA_BIN="$RUNNER_TEMP/ursula-bin/ursula" $NO_OIDC npx vitest --run test/soak.e2e.ts

      - name: Summary
        if: always()
        run: |
          logs="$RUNNER_TEMP/soak-logs"
          for f in "$logs"/node*.log; do
            [ -f "$f" ] || continue
            echo "$(basename "$f"): $(grep -c 'rebuilding channel' "$f" || true) channel-rebuild warnings, $(grep -c WARN "$f" || true) WARN, $(grep -c ERROR "$f" || true) ERROR"
            grep -E 'WARN|ERROR' "$f" | sed -E 's/[0-9]+/N/g' | sort | uniq -c | sort -rn | head -8 || true
          done
          [ -f "$logs/samples.jsonl" ] && python3 - "$logs/samples.jsonl" <<'EOF'
          import json, sys
          rows = [json.loads(l) for l in open(sys.argv[1])]
          for r in rows:
              g = r["gauges"]
              keys = ["raft_log_bytes_since_snapshot", "raft_snapshot_builds", "raft_grpc_append_stream_queued_bytes"]
              extra = " ".join(f"{k}={[n.get(k) for n in g]}" for k in keys)
              print(f"t={r['t']:>4}s rss_mb={r['rss_mb']} appends/s={r['appends_per_s']} {extra}")
          last = rows[-1]
          print("final counts:", last["counts"])
          print("final gauges:")
          for i, n in enumerate(last["gauges"]):
              print(f"  node{i+1}:", json.dumps(n, sort_keys=True))
          EOF

      # Secret masking covers logs, not artifacts: the node logs can name the bucket, so replace
      # the bucket, the role ARN and the account id in them before the upload.
      - name: Redact AWS identifiers in the artifact
        if: always() && env.URSULA_S3_PREFIX != ''
        env:
          DIR: ${{ runner.temp }}/soak-logs
          ROLE_ARN: ${{ secrets.URSULA_CI_AWS_ROLE_ARN }}
        run: |
          [ -d "$DIR" ] || exit 0
          python3 - "$DIR" <<'EOF'
          import os, pathlib, sys
          arn = os.environ.get("ROLE_ARN", "")
          account = arn.split(":")[4] if arn.count(":") >= 5 else ""
          values = sorted({v for v in (arn, os.environ.get("URSULA_S3_BUCKET", ""), account) if v}, key=len, reverse=True)
          for path in pathlib.Path(sys.argv[1]).rglob("*"):
              if path.is_file():
                  data = path.read_bytes()
                  redacted = data
                  for value in values:
                      redacted = redacted.replace(value.encode(), b"<redacted>")
                  if redacted != data:
                      path.write_bytes(redacted)
          EOF

      - name: Check the artifact for AWS credentials and identifiers
        id: leak
        if: always() && env.URSULA_S3_PREFIX != ''
        env:
          DIR: ${{ runner.temp }}/soak-logs
          ROLE_ARN: ${{ secrets.URSULA_CI_AWS_ROLE_ARN }}
        run: |
          [ -d "$DIR" ] || exit 0
          account="$(printf '%s' "$ROLE_ARN" | cut -d: -f5)"
          patterns="$(for v in "${AWS_SECRET_ACCESS_KEY:-}" "${AWS_SESSION_TOKEN:-}" "$ROLE_ARN" "$account" "$URSULA_S3_BUCKET"; do [ -z "$v" ] || printf '%s\n' "$v"; done)"
          [ -n "$patterns" ] || exit 0
          set +e   # patterns come from a pipe, never argv; any grep error fails closed
          grep -rlF -f <(printf '%s\n' "$patterns") -- "$DIR"; rc=$?
          set -e
          case $rc in
            1) exit 0 ;;
            0) echo "::error title=Credential leak guard::AWS credentials or identifiers appear in the files listed above; not uploading"; exit 1 ;;
            *) echo "::error title=Credential leak guard::grep failed ($rc); not uploading"; exit 1 ;;
          esac

      - name: Upload soak logs
        if: always() && steps.leak.outcome != 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: soak-logs
          path: ${{ runner.temp }}/soak-logs
          retention-days: 7

      - name: Delete this job's S3 prefix
        if: always() && env.URSULA_S3_PREFIX != ''
        continue-on-error: true
        timeout-minutes: 10
        env: { AWS_EC2_METADATA_DISABLED: "true" }
        run: |
          case "$URSULA_S3_PREFIX" in ci/*/*) ;; *) echo "::error::refusing to delete '$URSULA_S3_PREFIX'"; exit 1 ;; esac
          aws s3 rm "s3://$URSULA_S3_BUCKET/$URSULA_S3_PREFIX/" --recursive --only-show-errors

  vfs-outage:
    name: sqlite-vfs outage (${{ github.event.inputs.outage_seconds || '600' }} s per mode, model server)
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || format('runs-on={0}/cpu=8/ram=32/family=m7a+m8a/image=ubuntu24-full-x64/extras=s3-cache', github.run_id) }}
    timeout-minutes: 60
    env:
      # Keeps libsqlite3-sys from probing (and linking) a system libsqlite3.
      SQLITE3_LIB_DIR: /nonexistent
    steps:
      # Sends actions/cache to the RunsOn S3 cache. A no-op on GitHub-hosted runners.
      - name: Use the RunsOn cache
        uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          rustflags: ""
          cache-workspaces: clients/sqlite-vfs

      - name: Build the extension and the model server
        run: |
          cd clients/sqlite-vfs
          cargo build --locked --release
          cargo build --locked --release --features model --bin ursula-vfs-model

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Outage
        timeout-minutes: 45
        env:
          OUTAGE_SECONDS: ${{ github.event.inputs.outage_seconds || '600' }}
        run: |
          cd clients/sqlite-ursula
          npm ci --ignore-scripts
          OUTAGE_MS=$((OUTAGE_SECONDS * 1000)) E2E_SERVER=model \
            URSULA_VFS_MODEL="$GITHUB_WORKSPACE/clients/sqlite-vfs/target/release/ursula-vfs-model" \
            SQLITE_URSULA_VFS="$GITHUB_WORKSPACE/clients/sqlite-vfs/target/release/libsqlite_ursula_vfs.so" \
            npx vitest --run test/outage.e2e.ts

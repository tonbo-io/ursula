name: Docker Publish

on:
  pull_request:
    paths:
      - .dockerignore
      - .github/workflows/docker-publish.yml
      - Dockerfile
  workflow_call:
    inputs:
      publish:
        required: true
        type: boolean
      version:
        required: true
        type: string
      source_revision:
        required: true
        type: string
    outputs:
      digest:
        description: Published multi-platform image digest
        value: ${{ jobs.docker.outputs.digest }}

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: docker-${{ inputs.source_revision || github.sha }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKER_PLATFORMS: linux/amd64,linux/arm64
  DOCKER_METADATA_ANNOTATIONS_LEVELS: index

jobs:
  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_revision || github.sha }}

      - name: Validate release inputs
        if: inputs.publish
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          test "$(awk '
            /^\[workspace\.package\]/ { in_section = 1; next }
            /^\[/ { in_section = 0 }
            in_section && $1 == "version" { gsub(/"/, "", $3); print $3; exit }
          ' Cargo.toml)" = "$RELEASE_VERSION"

      - name: Set up Depot
        uses: depot/setup-action@v1

      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=pr
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.publish }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ inputs.publish }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.source_revision || github.sha }}
            org.opencontainers.image.version=${{ inputs.version || format('pr-{0}', github.event.number) }}

      - name: Build and publish Docker image
        id: build
        uses: depot/build-push-action@v1
        with:
          project: ls2d88cjpz
          context: .
          file: ./Dockerfile
          platforms: ${{ env.DOCKER_PLATFORMS }}
          push: ${{ inputs.publish }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: true
          sbom: true

            --artifact target/ursula-sim-runtime-raft-cold-live-write-failures/seed-312-minimized.json \
            --shape seed_312_runtime_raft_network_cold_live_write_failure_minimized
          assert_minimized_failure_trace target/ursula-sim-runtime-raft-cold-live-write-failures/seed-312-minimized.json runtime_raft_network_cold_live_write_integrity
          jq '.minimized.failure' target/ursula-sim-runtime-raft-cold-live-write-failures/seed-312-minimized.json \
            > target/ursula-sim-runtime-raft-cold-live-write-failures/seed-312-minimized-failure.json
          RUSTFLAGS="--cfg madsim" cargo run -p ursula-sim --bin ursula-sim -- replay \
            --artifact target/ursula-sim-runtime-raft-cold-live-write-failures/seed-312-minimized-failure.json \
            --expect-invariant runtime_raft_network_cold_live_write_integrity

      - name: Write simulation result summary
        if: always()
        run: python3 -m scripts.dst result-summary

      - name: Write DST coverage report
        if: always()
        run: python3 -m scripts.dst coverage-report

      - name: Upload DST coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dst-coverage-report
          path: |
            target/dst-coverage-report.json
            target/dst-coverage-report.md
          if-no-files-found: warn

      - name: Upload simulation failure artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ursula-sim-nightly-failures
          path: |
            target/ursula-sim-failures
            target/ursula-sim-seed-146-cold-write-delay-minimize
            target/ursula-sim-seed-147-cold-read-delay-minimize
            target/ursula-sim-seed-155-leader-cold-live-replay
            target/ursula-sim-seed-155-leader-cold-live-minimize
            target/ursula-sim-expected-failures
            target/ursula-sim-partial-read-expected-failures
            target/ursula-sim-tail-read-expected-failures
            target/ursula-sim-close-expected-failures
            target/ursula-sim-snapshot-expected-failures
            target/ursula-sim-leader-failover-read-expected-failures
            target/ursula-sim-leader-failover-cold-live-read-expected-failures
            target/ursula-sim-cold-live-truncate-expected-failures
            target/ursula-sim-randomized-cold-read-expected-failures
            target/ursula-sim-snapshot-install-expected-failures
            target/ursula-sim-runtime-interleaving-write-expected-failures
            target/ursula-sim-http-producer-expected-failures
            target/ursula-sim-http-live-expected-failures
            target/ursula-sim-http-live-limit-expected-failures
            target/ursula-sim-http-snapshot-expected-failures
            target/ursula-sim-http-protocol-randomized-expected-failures
            target/ursula-sim-http-protocol-randomized-sse-expected-failures
            target/ursula-sim-http-protocol-randomized-backpressure-expected-failures
            target/ursula-sim-runtime-raft-cold-live-write-failures
            target/ursula-sim-runtime-raft-cold-live-write-recovery
            target/ursula-sim-result-summary
          if-no-files-found: ignore

      # One issue with a stable title collects every scheduled failure. The
      # repository is public, so the comment carries only the run link and
      # the names of the failing steps.
      - name: Report a scheduled failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: DST Nightly failing on main
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          failed="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
            --jq '[.jobs[].steps[] | select(.conclusion == "failure") | .name] | join(", ")')"
          body="$(printf 'Run %s failed.\n\nFailing steps: %s' "$RUN_URL" "${failed:-unknown}")"
          issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$TITLE\" in:title" --limit 20 --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")"
          if test -n "$issue"; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$body"
          fi

      - name: Upload simulation result summary
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ursula-sim-result-summary
          path: target/ursula-sim-result-summary
          if-no-files-found: error

      - name: Upload simulation seed inventory
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ursula-sim-seed-inventory
          path: target/ursula-sim-seed-inventory
          if-no-files-found: error

      - name: Upload DST nondeterminism report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dst-nondeterminism-report
          path: target/dst-nondeterminism-report.md
          if-no-files-found: warn

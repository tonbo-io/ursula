name: Bounded state

# Bounded per-stream state measurement (docs/architecture/bounded-stream-state.md §7.2, §7.3).
# - state-growth: per-push ratchet gate over reduced-scale workloads; deterministic
#   counters, snapshot sizes and heap figures compared with
#   crates/ursula-state-probe/ratchet.json, plus the §7.2 formula checks.
# - nightly: full-scale W1 to W6 and L2 runs, JSONL published as artifacts.
# - write_ratchet (workflow_dispatch): runs the reduced-scale suite, rewrites ratchet.json from it
#   instead of comparing, and uploads the new file as an artifact.

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: "pr (ratchet gate) or nightly (full scale)"
        required: false
        default: nightly
        type: choice
        options:
          - pr
          - nightly
      write_ratchet:
        description: "Rewrite ratchet.json from a reduced-scale run and upload it (ignores suite)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  state-growth:
    name: State growth ratchet
    if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'pr' || inputs.write_ratchet))
    # Fork PRs stay on Depot: RunsOn runners run inside our AWS account.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'depot-ubuntu-24.04-8' || format('runs-on={0}/cpu=8/ram=32/family=m7a+m8a+m7i+m8i/image=ubuntu24-full-x64/extras=s3-cache', github.run_id) }}
    timeout-minutes: 45
    steps:
      # Sends actions/cache to the RunsOn S3 cache. A no-op on Depot and GitHub-hosted runners.
      - name: Use the RunsOn cache
        uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Build state probe
        run: cargo build -p ursula-state-probe --profile state-probe

      - name: Run reduced-scale suite against the ratchet
        if: ${{ !inputs.write_ratchet }}
        run: |
          ./target/state-probe/ursula-state-probe --quiet --out-dir target/state-probe-results \
            gate --suite pr --ratchet crates/ursula-state-probe/ratchet.json

      - name: Rewrite the ratchet from the reduced-scale suite
        if: ${{ inputs.write_ratchet }}
        run: |
          ./target/state-probe/ursula-state-probe --quiet --out-dir target/state-probe-results \
            gate --suite pr --ratchet crates/ursula-state-probe/ratchet.json --write-ratchet
          git diff -- crates/ursula-state-probe/ratchet.json

      - name: Upload the rewritten ratchet
        if: ${{ inputs.write_ratchet }}
        uses: actions/upload-artifact@v6
        with:
          name: ratchet-${{ github.sha }}
          path: crates/ursula-state-probe/ratchet.json
          if-no-files-found: error
          retention-days: 30

      - name: Summarize
        if: always()
        run: python3 crates/ursula-state-probe/summarize.py target/state-probe-results || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: state-growth-${{ github.sha }}
          path: target/state-probe-results
          if-no-files-found: warn
          retention-days: 14

  nightly:
    name: Bounded state nightly
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'nightly' && !inputs.write_ratchet)
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'depot-ubuntu-24.04-8' || format('runs-on={0}/cpu=8/ram=32/family=m7a+m8a+m7i+m8i/image=ubuntu24-full-x64/extras=s3-cache', github.run_id) }}
    timeout-minutes: 240
    steps:
      # Sends actions/cache to the RunsOn S3 cache. A no-op on Depot and GitHub-hosted runners.
      - name: Use the RunsOn cache
        uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Build state probe
        run: cargo build -p ursula-state-probe --profile state-probe

      - name: Run full-scale suite
        run: |
          ./target/state-probe/ursula-state-probe --quiet --out-dir target/state-probe-nightly \
            suite --suite nightly

      - name: Summarize
        if: always()
        run: python3 crates/ursula-state-probe/summarize.py target/state-probe-nightly || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bounded-state-nightly-${{ github.run_id }}
          path: target/state-probe-nightly
          if-no-files-found: warn
          retention-days: 90

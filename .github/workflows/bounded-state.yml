name: Bounded state

# Bounded per-stream state measurement (docs/architecture/bounded-stream-state.md §7.2, §7.3).
# - state-growth: per-push ratchet gate over reduced-scale workloads; deterministic
#   counters, snapshot sizes and heap figures compared with
#   crates/ursula-state-probe/ratchet.json, plus the §7.2 formula checks.
# - nightly: full-scale W1 to W6 and L2 runs, JSONL published as artifacts.
#   (Scheduled workflows run from the default branch once this file lands there;
#   until then trigger it with workflow_dispatch.)

on:
  push:
    branches:
      - agent/keyed-streams
      - "agent/ks-**"
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: "pr (ratchet gate) or nightly (full scale)"
        required: false
        default: nightly
        type: choice
        options:
          - pr
          - nightly

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  state-growth:
    name: State growth ratchet
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'pr')
    runs-on: ${{ vars.KS_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Build state probe
        run: cargo build -p ursula-state-probe --profile state-probe

      - name: Run reduced-scale suite against the ratchet
        run: |
          ./target/state-probe/ursula-state-probe --quiet --out-dir target/state-probe \
            gate --suite pr --ratchet crates/ursula-state-probe/ratchet.json

      - name: Summarize
        if: always()
        run: python3 crates/ursula-state-probe/summarize.py target/state-probe || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: state-growth-${{ github.sha }}
          path: target/state-probe
          if-no-files-found: warn
          retention-days: 14

  nightly:
    name: Bounded state nightly
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'nightly')
    runs-on: ${{ vars.KS_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Build state probe
        run: cargo build -p ursula-state-probe --profile state-probe

      - name: Run full-scale suite
        run: |
          ./target/state-probe/ursula-state-probe --quiet --out-dir target/state-probe-nightly \
            suite --suite nightly

      - name: Summarize
        if: always()
        run: python3 crates/ursula-state-probe/summarize.py target/state-probe-nightly || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bounded-state-nightly-${{ github.run_id }}
          path: target/state-probe-nightly
          if-no-files-found: warn
          retention-days: 90

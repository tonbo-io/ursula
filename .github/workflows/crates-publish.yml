name: Crates.io Publish

on:
  pull_request:
    paths:
      - .github/workflows/crates-publish.yml
      - Cargo.lock
      - Cargo.toml
      - scripts/crates_release.py
      - scripts/test_crates_release.py
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      source_revision:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: crates-io-${{ inputs.source_revision || github.sha }}
  cancel-in-progress: false

jobs:
  check:
    name: Crates.io package contract
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_revision || github.sha }}

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Validate release plan
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          if test -z "$version"; then
            version="$(awk '
              /^\[workspace\.package\]/ { in_section = 1; next }
              /^\[/ { in_section = 0 }
              in_section && $1 == "version" { gsub(/"/, "", $3); print $3; exit }
            ' Cargo.toml)"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          ./scripts/check-release-versions.sh
          python3 scripts/test_crates_release.py
          python3 scripts/crates_release.py check --version "$version"

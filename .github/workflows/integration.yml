name: Integration

# Verification that the main CI workflow (ci.yml) does not already run: every Rust integration test
# target, and the sqlite-vfs extension (lint, units, build) with its TypeScript e2e suite against a
# release `ursula` built once per run, on a single node and on 3 nodes + gateway + S3. S3 is real
# AWS S3 through OIDC (.github/actions/ci-s3) on same-repo PRs and main, MinIO for fork PRs. Lint,
# unit tests and the DST seeds run in ci.yml.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  integration:
    name: Rust integration tests
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    env:
      # Keeps the job's OIDC request variables out of cargo, build scripts and tests: a speed bump
      # against env-scraping code, not a boundary.
      NO_OIDC: env -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_ID_TOKEN_REQUEST_TOKEN
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          rustflags: ""

      # Integration test targets only (`tests/*.rs` of every crate, including ursula-index's,
      # which the main CI does not run); lib and bin unit tests run in ci.yml. ursula-sim runs
      # under madsim in ci.yml's DST job. Built before any AWS credential exists.
      - name: Build all integration targets
        run: $NO_OIDC cargo test --workspace --exclude ursula-sim --test '*' --no-run

      # AWS S3 through the CI role (one prefix per job) on same-repo PRs and main, MinIO otherwise.
      - name: S3 backend
        id: s3
        uses: ./.github/actions/ci-s3
        with:
          role-arn: ${{ vars.URSULA_CI_AWS_ROLE_ARN }}
          bucket: ${{ vars.URSULA_CI_S3_BUCKET }}
          region: ${{ vars.URSULA_CI_S3_REGION || 'us-east-1' }}
          job-key: ${{ github.job }}

      - name: Create the MinIO test bucket
        if: steps.s3.outputs.mode == 'minio'
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_DEFAULT_REGION: us-east-1
        run: aws --endpoint-url http://127.0.0.1:9000 s3 mb s3://ursula-ci

      # The S3 tests (the runtime's cold path, the CLI cold-manifest restart, which exercises the
      # format-epoch marker against real S3 listing, and ursula-index's conditional publish) each
      # use their own root under URSULA_S3_PREFIX. On AWS the TOML names no endpoint and no keys:
      # the AWS_* session credentials and SSE-S3 apply, as in production. Inside the 3600 s session.
      - name: Test all integration targets
        timeout-minutes: 55
        env:
          MODE: ${{ steps.s3.outputs.mode }}
        run: |
          export URSULA_COLD_S3_INTEGRATION=1 URSULA_EVENT_INDEX_S3_INTEGRATION=1
          if [ "$MODE" = aws ]; then
            export URSULA_COLD_S3_BUCKET="$URSULA_S3_BUCKET" URSULA_COLD_S3_REGION="$URSULA_S3_REGION"
            export URSULA_EVENT_INDEX_S3_BUCKET="$URSULA_S3_BUCKET" URSULA_EVENT_INDEX_S3_REGION="$URSULA_S3_REGION"
          else
            export URSULA_COLD_S3_BUCKET=ursula-ci URSULA_COLD_S3_REGION=us-east-1
            export URSULA_COLD_S3_ENDPOINT=http://127.0.0.1:9000 URSULA_COLD_S3_SSE=none
            export URSULA_COLD_S3_ACCESS_KEY_ID=minioadmin URSULA_COLD_S3_SECRET_ACCESS_KEY=minioadmin
            export URSULA_EVENT_INDEX_S3_BUCKET=ursula-ci URSULA_EVENT_INDEX_S3_REGION=us-east-1
            export URSULA_EVENT_INDEX_S3_ENDPOINT=http://127.0.0.1:9000
            export AWS_ACCESS_KEY_ID=minioadmin AWS_SECRET_ACCESS_KEY=minioadmin AWS_REGION=us-east-1
          fi
          $NO_OIDC cargo test --workspace --exclude ursula-sim --test '*'

      - name: Delete this job's S3 prefix
        if: always() && env.URSULA_S3_PREFIX != ''
        continue-on-error: true
        timeout-minutes: 10
        env: { AWS_EC2_METADATA_DISABLED: "true" }
        run: |
          case "$URSULA_S3_PREFIX" in ci/*/*) ;; *) echo "::error::refusing to delete '$URSULA_S3_PREFIX'"; exit 1 ;; esac
          aws s3 rm "s3://$URSULA_S3_BUCKET/$URSULA_S3_PREFIX/" --recursive --only-show-errors

  build-ursula:
    name: Build release ursula
    runs-on: depot-ubuntu-24.04-8
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          rustflags: ""

      - name: Build ursula
        run: cargo build --release -p ursula --bin ursula

      - name: Upload ursula
        uses: actions/upload-artifact@v6
        with:
          name: ursula-release
          path: target/release/ursula
          if-no-files-found: error
          retention-days: 1

  sqlite-vfs:
    name: sqlite-vfs (extension lint + units + build)
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 20
    env:
      # Keeps libsqlite3-sys from probing (and linking) a system libsqlite3: the extension only calls
      # the host's SQLite through sqlite3_api_routines.
      SQLITE3_LIB_DIR: /nonexistent
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          rustflags: ""
          cache-workspaces: clients/sqlite-vfs

      # The extension is its own workspace, so it carries a copy of the workspace's lint tables.
      - name: The extension's lint tables match the workspace's
        run: |
          python3 - <<'EOF'
          import sys
          def lints(path):
              s = open(path).read()
              return s[s.index("[workspace.lints.rust]"):s.index("[profile.release]")].strip()
          if lints("Cargo.toml") != lints("clients/sqlite-vfs/Cargo.toml"):
              sys.exit("clients/sqlite-vfs/Cargo.toml: the lint tables differ from the root manifest's")
          EOF

      - name: Lint, unit-test and build the extension
        run: |
          cd clients/sqlite-vfs
          cargo fmt --check
          cargo clippy --locked --release --all-targets -- -D warnings
          cargo test --locked --release
          cargo build --locked --release
          ldd target/release/libsqlite_ursula_vfs.so

      - name: Upload the extension
        uses: actions/upload-artifact@v6
        with:
          name: sqlite-ursula-vfs
          path: clients/sqlite-vfs/target/release/libsqlite_ursula_vfs.so
          if-no-files-found: error
          retention-days: 1

  # The extension's macOS-only code (the kernel boot id from `kern.bootsessionuuid`) compiles and its
  # unit test runs only here.
  sqlite-vfs-macos:
    name: sqlite-vfs on macOS (extension lint + units)
    runs-on: macos-15
    timeout-minutes: 20
    env:
      SQLITE3_LIB_DIR: /nonexistent
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          rustflags: ""
          cache-workspaces: clients/sqlite-vfs

      - name: Lint and unit-test the extension
        run: |
          cd clients/sqlite-vfs
          cargo clippy --locked --release --all-targets -- -D warnings
          cargo test --locked --release

  sqlite-vfs-e2e:
    name: sqlite-vfs e2e (single-node ursula)
    needs: [build-ursula, sqlite-vfs]
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Download ursula
        uses: actions/download-artifact@v7
        with:
          name: ursula-release
          path: ${{ runner.temp }}/ursula-bin

      - name: Download the extension
        uses: actions/download-artifact@v7
        with:
          name: sqlite-ursula-vfs
          path: ${{ runner.temp }}/vfs

      # Same-minor compatibility (docs/architecture/sqlite-vfs.md §7): the latest published patch of
      # this minor up to package.json's version (the same version included: between releases main
      # carries the released one) and this build must take over each other's streams
      # (test/compat.e2e.ts). Only when the minor has no published patch yet does the test run this
      # build against itself. A registry failure fails the step.
      - name: Previous patch of this minor
        shell: bash
        run: |
          # npm's answer, retried: stdout of the last attempt only.
          npm_retry() {
            local out
            for attempt in 1 2 3; do
              if out=$("$@"); then
                printf '%s' "$out"
                return 0
              fi
              echo "::warning::$* failed (attempt $attempt of 3)" >&2
              if [ "$attempt" -lt 3 ]; then sleep $((attempt * 10)); fi
            done
            return 1
          }
          current=$(node -p "require('./clients/sqlite-ursula/package.json').version")
          series=$(node -p "process.argv[1].split('.').slice(0, 2).join('.')" "$current")
          versions=$(npm_retry npm view @tonbo/sqlite-ursula versions --json)
          previous=$(printf '%s' "$versions" | node -e '
            const version = /^(\d+)\.(\d+)\.(\d+)/.exec(process.argv[1]);
            if (version === null) throw new Error(`package.json version ${process.argv[1]} is not major.minor.patch`);
            const [major, minor, patch] = version.slice(1).map(Number);
            const listed = [JSON.parse(require("fs").readFileSync(0, "utf8"))].flat();
            if (listed.length === 0 || !listed.every((v) => typeof v === "string")) {
              throw new Error(`npm view did not answer a version list: ${JSON.stringify(listed)}`);
            }
            const candidates = listed
              .filter((v) => /^\d+\.\d+\.\d+$/.test(v))
              .map((v) => v.split(".").map(Number))
              .filter(([a, b, c]) => a === major && b === minor && c <= patch)
              .sort((x, y) => x[2] - y[2]);
            console.log(candidates.length === 0 ? "" : candidates.at(-1).join("."));
          ' "$current")
          if [ -z "$previous" ]; then
            echo "::notice::No $series.x patch up to $current of @tonbo/sqlite-ursula is published: the compatibility e2e runs this build against itself."
            echo "SQLITE_URSULA_VFS_PREVIOUS=$RUNNER_TEMP/vfs/libsqlite_ursula_vfs.so" >> "$GITHUB_ENV"
          else
            mkdir -p "$RUNNER_TEMP/previous"
            cd "$RUNNER_TEMP/previous"
            packed=$(npm_retry npm pack "@tonbo/sqlite-ursula-linux-x64-gnu@$previous" --json)
            file=$(printf '%s' "$packed" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8"))[0].filename')
            tar xzf "$file"
            echo "Compatibility e2e: $previous against this build ($current)"
            echo "SQLITE_URSULA_VFS_PREVIOUS=$RUNNER_TEMP/previous/package/libsqlite_ursula_vfs.so" >> "$GITHUB_ENV"
          fi

      - name: e2e (transparency, crash matrix, fencing, recovery, local cache, snapshots, Pi conformance, benchmark, same-minor compatibility)
        timeout-minutes: 30
        run: |
          chmod +x "$RUNNER_TEMP/ursula-bin/ursula"
          cd clients/sqlite-ursula
          npm ci
          npm run typecheck
          npm run build
          URSULA_BIN="$RUNNER_TEMP/ursula-bin/ursula" SQLITE_URSULA_VFS="$RUNNER_TEMP/vfs/libsqlite_ursula_vfs.so" npm run test:e2e

      # Without a cold tier the default per-group hot limit trips after ~68 MB of frames: the
      # snapshot run writes ~160 MB, so only snapshots + retention keep it admitted.
      - name: snapshots + retention without a cold tier (default hot limit)
        timeout-minutes: 10
        run: |
          cd clients/sqlite-ursula
          URSULA_COLD=none URSULA_BIN="$RUNNER_TEMP/ursula-bin/ursula" SQLITE_URSULA_VFS="$RUNNER_TEMP/vfs/libsqlite_ursula_vfs.so" npx vitest --run test/snapshot.e2e.ts

  sqlite-vfs-e2e-cluster:
    name: sqlite-vfs e2e (3 nodes + gateway + S3)
    needs: [build-ursula, sqlite-vfs]
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    env:
      # Keeps the job's OIDC request variables out of npm and test processes: a speed bump against
      # env-scraping code, not a boundary.
      NO_OIDC: env -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_ID_TOKEN_REQUEST_TOKEN
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Download ursula
        uses: actions/download-artifact@v7
        with:
          name: ursula-release
          path: ${{ runner.temp }}/ursula-bin

      - name: Download the extension
        uses: actions/download-artifact@v7
        with:
          name: sqlite-ursula-vfs
          path: ${{ runner.temp }}/vfs

      # Before any AWS credential exists. The tree's install scripts are not needed.
      - name: Install dependencies
        run: |
          chmod +x "$RUNNER_TEMP/ursula-bin/ursula"
          cd clients/sqlite-ursula
          $NO_OIDC npm ci --ignore-scripts

      # AWS S3 through the CI role (one prefix per job) on same-repo PRs and main, MinIO otherwise.
      - name: S3 backend
        id: s3
        uses: ./.github/actions/ci-s3
        with:
          role-arn: ${{ vars.URSULA_CI_AWS_ROLE_ARN }}
          bucket: ${{ vars.URSULA_CI_S3_BUCKET }}
          region: ${{ vars.URSULA_CI_S3_REGION || 'us-east-1' }}
          job-key: ${{ github.job }}

      # Snapshot bodies above 1 MiB go to the cold tier (S3); cold-snapshot.e2e.ts publishes one above
      # the 8 MiB part size (a multipart upload). The benchmark's Pi turns snapshot and trim as they go
      # (a 64 KiB minimum, so the threshold is the database size).
      - name: Pi conformance (3 modes), snapshots + retention, multipart snapshot, benchmark through the gateway
        timeout-minutes: 30
        run: |
          cd clients/sqlite-ursula
          E2E_NODES=3 URSULA_VFS_SNAPSHOT_MIN_BYTES=65536 URSULA_BIN="$RUNNER_TEMP/ursula-bin/ursula" SQLITE_URSULA_VFS="$RUNNER_TEMP/vfs/libsqlite_ursula_vfs.so" $NO_OIDC npx vitest --run test/conformance.e2e.ts test/snapshot.e2e.ts test/cold-snapshot.e2e.ts test/bench.e2e.ts

      - name: Delete this job's S3 prefix
        if: always() && env.URSULA_S3_PREFIX != ''
        continue-on-error: true
        timeout-minutes: 10
        env: { AWS_EC2_METADATA_DISABLED: "true" }
        run: |
          case "$URSULA_S3_PREFIX" in ci/*/*) ;; *) echo "::error::refusing to delete '$URSULA_S3_PREFIX'"; exit 1 ;; esac
          aws s3 rm "s3://$URSULA_S3_BUCKET/$URSULA_S3_PREFIX/" --recursive --only-show-errors

name: Integration

# Verification that the main CI workflow (ci.yml) does not already run: every Rust integration test
# target, and the sqlite-vfs extension (lint, units, build) with its TypeScript e2e suite against the
# model of the 0.8 server (`ursula-vfs-model`) and against a release `ursula`, one node and three.
# S3 is real AWS S3 through OIDC (.github/actions/ci-s3) on same-repo PRs and main, MinIO for fork
# PRs and release/** pushes. Lint, unit tests and the DST seeds run in ci.yml.

on:
  pull_request:
  push:
    branches:
      - main
      - release/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  integration:
    name: Rust integration tests
    # Fork PRs run on GitHub-hosted runners: RunsOn runners run inside our AWS account.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || format('runs-on={0}/cpu=8/ram=32/family=m7a+m8a/image=ubuntu24-full-x64/extras=s3-cache', github.run_id) }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    env:
      # Keeps the job's OIDC request variables out of cargo, build scripts and tests: a speed bump
      # against env-scraping code, not a boundary.
      NO_OIDC: env -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_ID_TOKEN_REQUEST_TOKEN
    steps:
      # Sends actions/cache to the RunsOn S3 cache. A no-op on GitHub-hosted runners.
      - name: Use the RunsOn cache
        uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          rustflags: ""

      # Integration test targets only (`tests/*.rs` of every crate); lib and bin unit tests run
      # in ci.yml. ursula-sim runs under madsim in dst-nightly.yml. Built before any AWS
      # credential exists.
      - name: Build all integration targets
        run: $NO_OIDC cargo test --workspace --exclude ursula-sim --test '*' --no-run

      # AWS S3 through the CI role (one prefix per job) on same-repo PRs and main, MinIO otherwise.
      - name: S3 backend
        id: s3
        uses: ./.github/actions/ci-s3
        with:
          role-arn: ${{ secrets.URSULA_CI_AWS_ROLE_ARN }}
          bucket: ${{ secrets.URSULA_CI_S3_BUCKET }}
          region: ${{ vars.URSULA_CI_S3_REGION || 'us-east-1' }}
          job-key: ${{ github.job }}

      - name: Create the MinIO test bucket
        if: steps.s3.outputs.mode == 'minio'
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_DEFAULT_REGION: us-east-1
        run: aws --endpoint-url http://127.0.0.1:9000 s3 mb s3://ursula-ci

      # The S3 tests (the runtime's cold path and the CLI cold-manifest restart, which exercises
      # the format-epoch marker against real S3 listing) each use their own root under
      # URSULA_S3_PREFIX. On AWS the TOML names no endpoint and no keys:
      # the AWS_* session credentials and SSE-S3 apply, as in production. Inside the 3600 s session.
      - name: Test all integration targets
        timeout-minutes: 55
        env:
          MODE: ${{ steps.s3.outputs.mode }}
        run: |
          export URSULA_COLD_S3_INTEGRATION=1
          if [ "$MODE" = aws ]; then
            export URSULA_COLD_S3_BUCKET="$URSULA_S3_BUCKET" URSULA_COLD_S3_REGION="$URSULA_S3_REGION"
          else
            export URSULA_COLD_S3_BUCKET=ursula-ci URSULA_COLD_S3_REGION=us-east-1
            export URSULA_COLD_S3_ENDPOINT=http://127.0.0.1:9000 URSULA_COLD_S3_SSE=none
            export URSULA_COLD_S3_ACCESS_KEY_ID=minioadmin URSULA_COLD_S3_SECRET_ACCESS_KEY=minioadmin
            export AWS_ACCESS_KEY_ID=minioadmin AWS_SECRET_ACCESS_KEY=minioadmin AWS_REGION=us-east-1
          fi
          $NO_OIDC cargo test --workspace --exclude ursula-sim --test '*'

      - name: Delete this job's S3 prefix
        if: always() && env.URSULA_S3_PREFIX != ''
        continue-on-error: true
        timeout-minutes: 10
        env: { AWS_EC2_METADATA_DISABLED: "true" }
        run: |
          case "$URSULA_S3_PREFIX" in ci/*/*) ;; *) echo "::error::refusing to delete '$URSULA_S3_PREFIX'"; exit 1 ;; esac
          aws s3 rm "s3://$URSULA_S3_BUCKET/$URSULA_S3_PREFIX/" --recursive --only-show-errors

  sqlite-vfs:
    name: sqlite-vfs (extension lint + units + build)
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || format('runs-on={0}/cpu=8/ram=32/family=m7a+m8a/image=ubuntu24-full-x64/extras=s3-cache', github.run_id) }}
    timeout-minutes: 20
    env:
      # Keeps libsqlite3-sys from probing (and linking) a system libsqlite3: the extension only calls
      # the host's SQLite through sqlite3_api_routines.
      SQLITE3_LIB_DIR: /nonexistent
    steps:
      # Sends actions/cache to the RunsOn S3 cache. A no-op on GitHub-hosted runners.
      - name: Use the RunsOn cache
        uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          rustflags: ""
          cache-workspaces: clients/sqlite-vfs

      # The extension is its own workspace, so it carries a copy of the workspace's lint tables.
      - name: The extension's lint tables match the workspace's
        run: |
          python3 - <<'EOF'
          import sys
          def lints(path):
              s = open(path).read()
              return s[s.index("[workspace.lints.rust]"):s.index("[profile.release]")].strip()
          if lints("Cargo.toml") != lints("clients/sqlite-vfs/Cargo.toml"):
              sys.exit("clients/sqlite-vfs/Cargo.toml: the lint tables differ from the root manifest's")
          EOF

      - name: Lint, unit-test and build the extension
        run: |
          cd clients/sqlite-vfs
          cargo fmt --check
          cargo clippy --locked --release --all-targets -- -D warnings
          cargo clippy --locked --release --features model --all-targets -- -D warnings
          cargo test --locked --release
          cargo build --locked --release
          cargo build --locked --release --features model --bin ursula-vfs-model
          ldd target/release/libsqlite_ursula_vfs.so

      - name: Upload the extension and the model server
        uses: actions/upload-artifact@v6
        with:
          name: sqlite-ursula-vfs
          path: |
            clients/sqlite-vfs/target/release/libsqlite_ursula_vfs.so
            clients/sqlite-vfs/target/release/ursula-vfs-model
          if-no-files-found: error
          retention-days: 1

  # The extension's macOS side (`F_GETPATH`, the descriptor scan, `/dev/fd`) compiles and its unit
  # tests run only here.
  sqlite-vfs-macos:
    name: sqlite-vfs on macOS (extension lint + units)
    runs-on: macos-15
    timeout-minutes: 20
    env:
      SQLITE3_LIB_DIR: /nonexistent
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          rustflags: ""
          cache-workspaces: clients/sqlite-vfs

      - name: Lint and unit-test the extension
        run: |
          cd clients/sqlite-vfs
          cargo clippy --locked --release --all-targets -- -D warnings
          cargo test --locked --release

  sqlite-vfs-e2e:
    name: sqlite-vfs e2e (model server, Node ${{ matrix.node }})
    needs: [sqlite-vfs]
    strategy:
      fail-fast: false
      matrix:
        # 22.19.0 is the oldest Node the package supports, whose SQLite (3.50.4) is the extension's
        # floor: the PHASETWO scenarios run there and on the latest 22.
        node: ["22.19.0", "22"]
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || format('runs-on={0}/cpu=8/ram=32/family=m7a+m8a/image=ubuntu24-full-x64/extras=s3-cache', github.run_id) }}
    timeout-minutes: 30
    steps:
      # Sends actions/cache to the RunsOn S3 cache. A no-op on GitHub-hosted runners.
      - name: Use the RunsOn cache
        uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Download the extension and the model server
        uses: actions/download-artifact@v7
        with:
          name: sqlite-ursula-vfs
          path: ${{ runner.temp }}/vfs

      # Includes the M1 exit criteria: the crash matrix, a 60 s outage in two modes (600 s runs in
      # memory-soak.yml) and Pi's conformance on synced() in three modes.
      - name: e2e (the core through its SQL functions, open, synced, resets, worker threads, Pi, crashes, outages)
        timeout-minutes: 20
        run: |
          chmod +x "$RUNNER_TEMP/vfs/ursula-vfs-model"
          cd clients/sqlite-ursula
          npm ci
          npm run typecheck
          npm run build
          E2E_SERVER=model URSULA_VFS_MODEL="$RUNNER_TEMP/vfs/ursula-vfs-model" SQLITE_URSULA_VFS="$RUNNER_TEMP/vfs/libsqlite_ursula_vfs.so" npm run test:e2e

      # package.json declares the @earendil-works/pi-durable versions the `/pi` entry supports as an
      # optional peer dependency, ">=oldest <first-unsupported", and the step above tests the version
      # in the lockfile (a devDependency). This one installs the oldest without saving it, then runs
      # the typecheck and the Pi suites: Pi's storage conformance in three modes, and the adapter's
      # mapping of backlog_full and resets, which conformance never triggers.
      - name: Pi suite on the oldest supported pi-durable
        timeout-minutes: 10
        run: |
          cd clients/sqlite-ursula
          range=$(node -p 'require("./package.json").peerDependencies["@earendil-works/pi-durable"]')
          oldest=$(node -e '
            const bounds = /^>=(\d+\.\d+\.\d+) <\d+\.\d+\.\d+$/.exec(process.argv[1]);
            if (bounds === null) throw new Error("pi-durable range is not >=oldest <first-unsupported: " + process.argv[1]);
            console.log(bounds[1]);
          ' "$range")
          # pi-durable, pi-ai and chord are released together: test the oldest version of all three,
          # the set an application on that release has, not the oldest pi-durable with newer siblings.
          pkgs=(@earendil-works/pi-durable @earendil-works/pi-ai @earendil-works/chord)
          npm install --no-save "${pkgs[@]/%/@$oldest}"
          for pkg in "${pkgs[@]}"; do
            # By path: pi-ai's exports map does not expose its package.json.
            installed=$(node -p "require(\"./node_modules/$pkg/package.json\").version")
            echo "Pi suite on $pkg $installed, the oldest of $range"
            [ "$installed" = "$oldest" ]
          done
          npm run typecheck
          E2E_SERVER=model URSULA_VFS_MODEL="$RUNNER_TEMP/vfs/ursula-vfs-model" SQLITE_URSULA_VFS="$RUNNER_TEMP/vfs/libsqlite_ursula_vfs.so" npx vitest --run test/pi.e2e.ts test/conformance.e2e.ts

  # The release `ursula` for the e2e against the real server, cached by the inputs that build it so
  # a PR that touches only the extension or the package does not rebuild it. Bump the key's version
  # (v1) when the build command below changes.
  build-ursula:
    name: Build release ursula
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || format('runs-on={0}/cpu=8/ram=32/family=m7a+m8a/image=ubuntu24-full-x64/extras=s3-cache', github.run_id) }}
    timeout-minutes: 40
    steps:
      # Sends actions/cache to the RunsOn S3 cache. A no-op on GitHub-hosted runners.
      - name: Use the RunsOn cache
        uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0

      - name: Checkout
        uses: actions/checkout@v6

      - name: Cached ursula
        id: cache
        uses: actions/cache@v5
        with:
          path: ursula-bin/ursula
          key: ursula-release-v1-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'crates/**', 'third_party/**') }}

      - name: Install Rust toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          rustflags: ""

      - name: Build ursula
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cargo build --locked --release -p ursula --bin ursula
          mkdir -p ursula-bin
          cp target/release/ursula ursula-bin/ursula

      - name: Upload ursula
        uses: actions/upload-artifact@v6
        with:
          name: ursula-release
          path: ursula-bin/ursula
          if-no-files-found: error
          retention-days: 1

  # The same suites against the real server (E2E_SERVER=ursula): one node with an in-memory cold
  # store, and three nodes behind the gateway with no cold tier, where test/failover.e2e.ts kills
  # the leader of a stream's group during commits. A suite or case the real server cannot serve
  # says so in its name and why. No S3 here.
  sqlite-vfs-e2e-ursula:
    name: sqlite-vfs e2e (ursula, ${{ matrix.nodes }} node${{ matrix.nodes == '3' && 's + gateway' || '' }})
    needs: [build-ursula, sqlite-vfs]
    strategy:
      fail-fast: false
      matrix:
        nodes: ["1", "3"]
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || format('runs-on={0}/cpu=8/ram=32/family=m7a+m8a/image=ubuntu24-full-x64/extras=s3-cache', github.run_id) }}
    timeout-minutes: 45
    steps:
      # Sends actions/cache to the RunsOn S3 cache. A no-op on GitHub-hosted runners.
      - name: Use the RunsOn cache
        uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Download ursula
        uses: actions/download-artifact@v7
        with:
          name: ursula-release
          path: ${{ runner.temp }}/ursula-bin

      - name: Download the extension
        uses: actions/download-artifact@v7
        with:
          name: sqlite-ursula-vfs
          path: ${{ runner.temp }}/vfs

      - name: e2e (every suite, crashes, outages and Pi conformance included)
        timeout-minutes: 35
        env:
          E2E_NODES: ${{ matrix.nodes }}
          # No S3 here: one node keeps an in-memory cold store, three run with no cold tier.
          URSULA_COLD: ${{ matrix.nodes == '3' && 'none' || 'memory' }}
        run: |
          chmod +x "$RUNNER_TEMP/ursula-bin/ursula"
          cd clients/sqlite-ursula
          npm ci
          npm run build
          E2E_SERVER=ursula E2E_LOG_DIR="$RUNNER_TEMP/e2e-logs" URSULA_BIN="$RUNNER_TEMP/ursula-bin/ursula" SQLITE_URSULA_VFS="$RUNNER_TEMP/vfs/libsqlite_ursula_vfs.so" npm run test:e2e

      - name: Upload the server logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: sqlite-vfs-e2e-ursula-${{ matrix.nodes }}-logs
          path: ${{ runner.temp }}/e2e-logs
          if-no-files-found: ignore
          retention-days: 7

  # M1 exit criterion: a commit's p50 on the VFS within 0.5 ms of B1, plain node:sqlite with WAL and
  # synchronous=NORMAL, on the same workload (clients/sqlite-ursula/bench/commit.ts). Latency on a
  # shared runner is noisy, so this job is not a required check: it reports both values in the job
  # summary and fails when the criterion is not met.
  sqlite-vfs-perf:
    name: sqlite-vfs perf (commit p50 against B1)
    needs: [sqlite-vfs]
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || format('runs-on={0}/cpu=8/ram=32/family=m7a+m8a/image=ubuntu24-full-x64/extras=s3-cache', github.run_id) }}
    timeout-minutes: 15
    steps:
      # Sends actions/cache to the RunsOn S3 cache. A no-op on GitHub-hosted runners.
      - name: Use the RunsOn cache
        uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Download the extension and the model server
        uses: actions/download-artifact@v7
        with:
          name: sqlite-ursula-vfs
          path: ${{ runner.temp }}/vfs

      - name: Commit p50, VFS against B1
        timeout-minutes: 10
        run: |
          chmod +x "$RUNNER_TEMP/vfs/ursula-vfs-model"
          cd clients/sqlite-ursula
          npm ci
          URSULA_VFS_MODEL="$RUNNER_TEMP/vfs/ursula-vfs-model" SQLITE_URSULA_VFS="$RUNNER_TEMP/vfs/libsqlite_ursula_vfs.so" node bench/commit.ts

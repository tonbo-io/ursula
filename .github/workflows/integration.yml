name: Integration

# Verification that the main CI workflow (ci.yml) does not already run: every Rust integration test
# target, and the sqlite-vfs extension (lint, units, build) with its TypeScript e2e suite against the
# model of the 0.8 server (`ursula-vfs-model`) and against a release `ursula`, one node and three,
# its parts suites through three nodes behind the gateway with an S3 cold store, and the Python
# package's suites against the model on uv-managed CPython and Alpine and against one `ursula` node,
# with its host check on Windows.
# S3 is real AWS S3 through OIDC (.github/actions/ci-s3) on same-repo PRs and main, MinIO for fork
# PRs and release/** pushes. Lint, unit tests and the DST seeds run in ci.yml.

on:
  pull_request:
  push:
    branches:
      - main
      - release/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  integration:
    name: Rust integration tests
    # Fork PRs run on GitHub-hosted runners: RunsOn runners run inside our AWS account.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || format('runs-on={0}/cpu=8/ram=32/family=m7a+m8a/image=ubuntu24-full-x64/extras=s3-cache', github.run_id) }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    env:
      # Keeps the job's OIDC request variables out of cargo, build scripts and tests: a speed bump
      # against env-scraping code, not a boundary.
      NO_OIDC: env -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_ID_TOKEN_REQUEST_TOKEN
    steps:
      # Sends actions/cache to the RunsOn S3 cache. A no-op on GitHub-hosted runners.
      - name: Use the RunsOn cache
        uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          rustflags: ""

      # Integration test targets only (`tests/*.rs` of every crate); lib and bin unit tests run
      # in ci.yml. ursula-sim runs under madsim in dst-nightly.yml. Built before any AWS
      # credential exists.
      - name: Build all integration targets
        run: $NO_OIDC cargo test --workspace --exclude ursula-sim --test '*' --no-run

      # AWS S3 through the CI role (one prefix per job) on same-repo PRs and main, MinIO otherwise.
      - name: S3 backend
        id: s3
        uses: ./.github/actions/ci-s3
        with:
          role-arn: ${{ secrets.URSULA_CI_AWS_ROLE_ARN }}
          bucket: ${{ secrets.URSULA_CI_S3_BUCKET }}
          region: ${{ vars.URSULA_CI_S3_REGION || 'us-east-1' }}
          job-key: ${{ github.job }}

      - name: Create the MinIO test bucket
        if: steps.s3.outputs.mode == 'minio'
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_DEFAULT_REGION: us-east-1
        run: aws --endpoint-url http://127.0.0.1:9000 s3 mb s3://ursula-ci

      # The S3 tests (the runtime's cold path and the CLI cold-manifest restart, which exercises
      # the format-epoch marker against real S3 listing) each use their own root under
      # URSULA_S3_PREFIX. On AWS the TOML names no endpoint and no keys:
      # the AWS_* session credentials and SSE-S3 apply, as in production. Inside the 3600 s session.
      - name: Test all integration targets
        timeout-minutes: 55
        env:
          MODE: ${{ steps.s3.outputs.mode }}
        run: |
          export URSULA_COLD_S3_INTEGRATION=1
          if [ "$MODE" = aws ]; then
            export URSULA_COLD_S3_BUCKET="$URSULA_S3_BUCKET" URSULA_COLD_S3_REGION="$URSULA_S3_REGION"
          else
            export URSULA_COLD_S3_BUCKET=ursula-ci URSULA_COLD_S3_REGION=us-east-1
            export URSULA_COLD_S3_ENDPOINT=http://127.0.0.1:9000 URSULA_COLD_S3_SSE=none
            export URSULA_COLD_S3_ACCESS_KEY_ID=minioadmin URSULA_COLD_S3_SECRET_ACCESS_KEY=minioadmin
            export AWS_ACCESS_KEY_ID=minioadmin AWS_SECRET_ACCESS_KEY=minioadmin AWS_REGION=us-east-1
          fi
          $NO_OIDC cargo test --workspace --exclude ursula-sim --test '*'

      - name: Delete this job's S3 prefix
        if: always() && env.URSULA_S3_PREFIX != ''
        continue-on-error: true
        timeout-minutes: 10
        env: { AWS_EC2_METADATA_DISABLED: "true" }
        run: |
          case "$URSULA_S3_PREFIX" in ci/*/*) ;; *) echo "::error::refusing to delete '$URSULA_S3_PREFIX'"; exit 1 ;; esac
          aws s3 rm "s3://$URSULA_S3_BUCKET/$URSULA_S3_PREFIX/" --recursive --only-show-errors

  sqlite-vfs:
    name: sqlite-vfs (extension lint + units + build)
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || format('runs-on={0}/cpu=8/ram=32/family=m7a+m8a/image=ubuntu24-full-x64/extras=s3-cache', github.run_id) }}
    timeout-minutes: 20
    env:
      # Keeps libsqlite3-sys from probing (and linking) a system libsqlite3: the extension only calls
      # the host's SQLite through sqlite3_api_routines.
      SQLITE3_LIB_DIR: /nonexistent
    steps:
      # Sends actions/cache to the RunsOn S3 cache. A no-op on GitHub-hosted runners.
      - name: Use the RunsOn cache
        uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          rustflags: ""
          cache-workspaces: clients/sqlite-vfs

      # The extension is its own workspace, so it carries a copy of the workspace's lint tables.
      - name: The extension's lint tables match the workspace's
        run: |
          python3 - <<'EOF'
          import sys
          def lints(path):
              s = open(path).read()
              return s[s.index("[workspace.lints.rust]"):s.index("[profile.release]")].strip()
          if lints("Cargo.toml") != lints("clients/sqlite-vfs/Cargo.toml"):
              sys.exit("clients/sqlite-vfs/Cargo.toml: the lint tables differ from the root manifest's")
          EOF

      - name: Lint, unit-test and build the extension
        run: |
          cd clients/sqlite-vfs
          cargo fmt --check
          cargo clippy --locked --release --all-targets -- -D warnings
          cargo clippy --locked --release --features model --all-targets -- -D warnings
          cargo test --locked --release
          cargo build --locked --release
          cargo build --locked --release --features model --bin ursula-vfs-model
          ldd target/release/libsqlite_ursula_vfs.so

      - name: Upload the extension, the model server and the host tool
        uses: actions/upload-artifact@v6
        with:
          name: sqlite-ursula-vfs
          path: |
            clients/sqlite-vfs/target/release/libsqlite_ursula_vfs.so
            clients/sqlite-vfs/target/release/ursula-vfs-model
            clients/sqlite-vfs/target/release/ursula-vfs-host
          if-no-files-found: error
          retention-days: 1

  # The extension's macOS side (`F_GETPATH`, the descriptor scan, `/dev/fd`) compiles and its unit
  # tests run only here.
  sqlite-vfs-macos:
    name: sqlite-vfs on macOS (extension lint + units)
    runs-on: macos-15
    timeout-minutes: 20
    env:
      SQLITE3_LIB_DIR: /nonexistent
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          rustflags: ""
          cache-workspaces: clients/sqlite-vfs

      - name: Lint and unit-test the extension
        run: |
          cd clients/sqlite-vfs
          cargo clippy --locked --release --all-targets -- -D warnings
          cargo test --locked --release

  # ursula-vfs-host as a host ships it (design: Hosts): Linux with musl on x64 and arm64, linked
  # statically, so it runs on any Linux of that architecture whatever its C library. Built natively
  # in Alpine with the repository's toolchain, then run once outside it.
  sqlite-vfs-host-musl:
    name: sqlite-vfs host tool (${{ matrix.arch }} musl, static)
    runs-on: ${{ github.event.pull_request.head.repo.fork && matrix.hosted || format(matrix.runs-on, github.run_id) }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            hosted: ubuntu-24.04
            runs-on: runs-on={0}/cpu=8/ram=32/family=m7a+m8a/image=ubuntu24-full-x64/extras=s3-cache
          - arch: arm64
            hosted: ubuntu-24.04-arm
            runs-on: runs-on={0}/cpu=8/ram=32/family=m8g+m7g/image=ubuntu24-full-arm64/extras=s3-cache
    steps:
      # Sends actions/cache to the RunsOn S3 cache. A no-op on GitHub-hosted runners.
      - name: Use the RunsOn cache
        uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0

      - name: Checkout
        uses: actions/checkout@v6

      - name: Build ursula-vfs-host in Alpine
        env:
          IMAGE: public.ecr.aws/docker/library/alpine:3.22@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8
        run: |
          set -euo pipefail
          toolchain=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          test -n "$toolchain"
          # The musl target links statically by default. As in npm-publish.yml, libsqlite3-sys must
          # not probe a system libsqlite3.
          docker run --rm -v "$PWD:/src" -w /src/clients/sqlite-vfs \
            -e SQLITE3_LIB_DIR=/nonexistent -e CARGO_TERM_COLOR -e TOOLCHAIN="$toolchain" \
            "$IMAGE" sh -euxc '
              apk add --no-cache curl gcc musl-dev
              (cd / && curl --proto "=https" --tlsv1.2 --retry 5 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal --default-toolchain "$TOOLCHAIN")
              "$HOME/.cargo/bin/cargo" +"$TOOLCHAIN" build --locked --release --bin ursula-vfs-host
            '

      - name: Check that it is static and runs
        run: |
          set -euo pipefail
          bin=clients/sqlite-vfs/target/release/ursula-vfs-host
          file "$bin"
          if readelf -d "$bin" | grep NEEDED; then
            echo "::error::ursula-vfs-host needs shared libraries"
            exit 1
          fi
          out=$("$bin" inspect --dir "$RUNNER_TEMP/no-host-dir" --pid $$)
          echo "$out"
          python3 -c '
          import json, sys
          r = json.loads(sys.argv[1])
          assert r["v"] == 1 and r["complete"] is False and r["incomplete"] == "host_dir", r
          ' "$out"
          status=0
          "$bin" inspect --budget-ms soon || status=$?
          test "$status" -eq 2
          # The drain's open, driver and transport run here: nothing answers the origin, and the
          # scanned directory holds no root.
          mkdir -p "$RUNNER_TEMP/empty-scan"
          out=$("$bin" drain --origin http://127.0.0.1:9 --budget-ms 500 --scan "$RUNNER_TEMP/empty-scan" < /dev/null)
          echo "$out"
          python3 -c '
          import json, sys
          r = json.loads(sys.argv[1])
          assert list(r) == ["v", "origin", "uid", "dir", "roots", "error"], r
          assert r["v"] == 1 and r["origin"] == "http://127.0.0.1:9" and r["roots"] == [], r
          ' "$out"
          status=0
          "$bin" drain --origin http://127.0.0.1:9 --budget-ms 0 || status=$?
          test "$status" -eq 2
          ls -l "$bin"

      - name: Upload the static x64 ursula-vfs-host
        if: matrix.arch == 'x64'
        uses: actions/upload-artifact@v6
        with:
          name: sqlite-vfs-host-musl-x64
          path: clients/sqlite-vfs/target/release/ursula-vfs-host
          if-no-files-found: error
          retention-days: 1

      # The compiled-in host directory's checks (design: Hosts), as root, the way a host runs it.
      - name: Check the compiled-in host directory as root
        run: |
          set -euo pipefail
          bin=clients/sqlite-vfs/target/release/ursula-vfs-host
          expect() {
            python3 -c '
          import json, sys
          r, want = json.loads(sys.argv[1]), sys.argv[2]
          if want == "clean":
              assert r["complete"] is True and r["clean"] is True and r["incomplete"] is None, r
          else:
              assert r["complete"] is False and r["incomplete"] == want, r
          ' "$1" "$2"
          }
          sudo install -d -o root -g root -m 0755 /var/lib/sqlite-ursula
          sudo install -d -o root -g root -m 1777 /var/lib/sqlite-ursula/host
          out=$(sudo "$bin" inspect --pid $$)
          expect "$out" clean
          python3 -c 'import json, sys; assert json.loads(sys.argv[1])["dir"] == "/var/lib/sqlite-ursula/host"' "$out"
          # The same directory through another spelling is checked as strictly.
          expect "$(sudo "$bin" inspect --dir /var/lib/sqlite-ursula/../sqlite-ursula/host --pid $$)" clean
          sudo chmod 0777 /var/lib/sqlite-ursula/host
          expect "$(sudo "$bin" inspect --dir /var/lib/sqlite-ursula/../sqlite-ursula/host --pid $$)" host_dir
          sudo chmod 1777 /var/lib/sqlite-ursula/host
          sudo chmod 0775 /var/lib/sqlite-ursula
          expect "$(sudo "$bin" inspect --pid $$)" host_dir
          sudo chmod 0755 /var/lib/sqlite-ursula
          sudo touch /var/lib/sqlite-ursula/host/stray
          expect "$(sudo "$bin" inspect --pid $$)" unrecognized
          sudo rm /var/lib/sqlite-ursula/host/stray
          # The check of every process needs root.
          expect "$("$bin" inspect)" unread_lock
          # The hold: taken and released once its stdin closes, a known name to the inspection.
          sudo install -o root -g root -m 0644 /dev/null /var/lib/sqlite-ursula/host/hold
          test "$(sudo "$bin" hold < /dev/null)" = held
          expect "$(sudo "$bin" inspect --pid $$)" clean
          sudo rm -rf /var/lib/sqlite-ursula

  sqlite-vfs-e2e:
    name: sqlite-vfs e2e (model server, Node ${{ matrix.node }})
    needs: [sqlite-vfs]
    strategy:
      fail-fast: false
      matrix:
        # 22.19.0 is the oldest Node the package supports, whose SQLite (3.50.4) is the extension's
        # floor: the PHASETWO scenarios run there and on the latest 22.
        node: ["22.19.0", "22"]
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || format('runs-on={0}/cpu=8/ram=32/family=m7a+m8a/image=ubuntu24-full-x64/extras=s3-cache', github.run_id) }}
    timeout-minutes: 30
    steps:
      # Sends actions/cache to the RunsOn S3 cache. A no-op on GitHub-hosted runners.
      - name: Use the RunsOn cache
        uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Download the extension and the model server
        uses: actions/download-artifact@v7
        with:
          name: sqlite-ursula-vfs
          path: ${{ runner.temp }}/vfs

      # Includes the M1 exit criteria: the crash matrix, a 60 s outage in two modes (the 600 s
      # outage runs daily in memory-soak.yml, not on pull requests) and Pi's conformance on
      # synced() in three modes.
      - name: e2e (the core through its SQL functions, open, synced, resets, worker threads, Pi, crashes, outages)
        timeout-minutes: 20
        run: |
          chmod +x "$RUNNER_TEMP/vfs/ursula-vfs-model" "$RUNNER_TEMP/vfs/ursula-vfs-host"
          cd clients/sqlite-ursula
          npm ci
          npm run typecheck
          npm run build
          E2E_SERVER=model URSULA_VFS_MODEL="$RUNNER_TEMP/vfs/ursula-vfs-model" URSULA_VFS_HOST="$RUNNER_TEMP/vfs/ursula-vfs-host" SQLITE_URSULA_VFS="$RUNNER_TEMP/vfs/libsqlite_ursula_vfs.so" npm run test:e2e

      # package.json declares the @earendil-works/pi-durable versions the `/pi` entry supports as an
      # optional peer dependency, ">=oldest <first-unsupported", and the step above tests the version
      # in the lockfile (a devDependency). This one installs the oldest without saving it, then runs
      # the typecheck and the Pi suites: Pi's storage conformance in three modes, and the adapter's
      # mapping of backlog_full and resets, which conformance never triggers.
      - name: Pi suite on the oldest supported pi-durable
        timeout-minutes: 10
        run: |
          cd clients/sqlite-ursula
          range=$(node -p 'require("./package.json").peerDependencies["@earendil-works/pi-durable"]')
          oldest=$(node -e '
            const bounds = /^>=(\d+\.\d+\.\d+) <\d+\.\d+\.\d+$/.exec(process.argv[1]);
            if (bounds === null) throw new Error("pi-durable range is not >=oldest <first-unsupported: " + process.argv[1]);
            console.log(bounds[1]);
          ' "$range")
          # pi-durable, pi-ai and chord are released together: test the oldest version of all three,
          # the set an application on that release has, not the oldest pi-durable with newer siblings.
          pkgs=(@earendil-works/pi-durable @earendil-works/pi-ai @earendil-works/chord)
          npm install --no-save "${pkgs[@]/%/@$oldest}"
          for pkg in "${pkgs[@]}"; do
            # By path: pi-ai's exports map does not expose its package.json.
            installed=$(node -p "require(\"./node_modules/$pkg/package.json\").version")
            echo "Pi suite on $pkg $installed, the oldest of $range"
            [ "$installed" = "$oldest" ]
          done
          npm run typecheck
          E2E_SERVER=model URSULA_VFS_MODEL="$RUNNER_TEMP/vfs/ursula-vfs-model" SQLITE_URSULA_VFS="$RUNNER_TEMP/vfs/libsqlite_ursula_vfs.so" npx vitest --run test/pi.e2e.ts test/conformance.e2e.ts

  # The fork guard (design: Forks) in a host that forks: CPython's sqlite3 with the extension
  # loaded, against the model server. A uv-managed CPython, whose SQLite is new enough and loads
  # extensions. uv and the CPython patch release, which bundles the SQLite, are pinned.
  sqlite-vfs-fork:
    name: sqlite-vfs fork guard (CPython host, model server)
    needs: [sqlite-vfs]
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || format('runs-on={0}/cpu=4/ram=16/family=m7a+m8a/image=ubuntu24-full-x64/extras=s3-cache', github.run_id) }}
    timeout-minutes: 15
    steps:
      # Sends actions/cache to the RunsOn S3 cache. A no-op on GitHub-hosted runners.
      - name: Use the RunsOn cache
        uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.6"

      - name: Download the extension and the model server
        uses: actions/download-artifact@v7
        with:
          name: sqlite-ursula-vfs
          path: ${{ runner.temp }}/vfs

      - name: Fork a CPython host before and after the driver started
        timeout-minutes: 5
        env:
          UV_PYTHON_PREFERENCE: only-managed
        run: |
          chmod +x "$RUNNER_TEMP/vfs/ursula-vfs-model"
          SQLITE_URSULA_VFS="$RUNNER_TEMP/vfs/libsqlite_ursula_vfs.so" URSULA_VFS_MODEL="$RUNNER_TEMP/vfs/ursula-vfs-model" \
            uv run --no-project --python 3.13.18 clients/sqlite-vfs/e2e/fork.py

  # The Python package (clients/sqlite-ursula-python) against the model server, on uv-managed
  # CPython, whose SQLite is new enough and loads extensions: the oldest supported minor, the
  # newest, and the newest free-threaded. uv is pinned, and with it the Python builds it installs.
  # The 3.14 leg also lints, checks that a wheel finds the library it carries and that a
  # uv-managed CPython on Debian hosts it as recipes/Dockerfile.uv installs it, and checks that
  # python:3.13-slim, whose SQLite is older than the extension's floor, fails with
  # host_unsupported and says what to use instead.
  sqlite-ursula-python:
    name: sqlite-ursula-python (model server, CPython ${{ matrix.python }})
    needs: [sqlite-vfs]
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14", "3.14t"]
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || format('runs-on={0}/cpu=4/ram=16/family=m7a+m8a/image=ubuntu24-full-x64/extras=s3-cache', github.run_id) }}
    timeout-minutes: 20
    env:
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      # Sends actions/cache to the RunsOn S3 cache. A no-op on GitHub-hosted runners.
      - name: Use the RunsOn cache
        uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.6"

      - name: Download the extension and the model server
        uses: actions/download-artifact@v7
        with:
          name: sqlite-ursula-vfs
          path: ${{ runner.temp }}/vfs

      - name: Lint
        if: matrix.python == '3.14'
        working-directory: clients/sqlite-ursula-python
        run: |
          uvx ruff@0.17.1 check
          uvx ruff@0.17.1 format --check

      - name: e2e (open, synced and the events thread, errors, forks, import, the host check)
        timeout-minutes: 10
        working-directory: clients/sqlite-ursula-python
        run: |
          chmod +x "$RUNNER_TEMP/vfs/ursula-vfs-model"
          E2E_SERVER=model URSULA_VFS_MODEL="$RUNNER_TEMP/vfs/ursula-vfs-model" SQLITE_URSULA_VFS="$RUNNER_TEMP/vfs/libsqlite_ursula_vfs.so" \
            uv run --no-project --python "${{ matrix.python }}" --with pytest==9.1.1 python -m pytest -v

      - name: A wheel finds the library it carries
        if: matrix.python == '3.14'
        working-directory: clients/sqlite-ursula-python
        run: |
          set -euo pipefail
          mkdir -p src/sqlite_ursula/_lib
          cp "$RUNNER_TEMP/vfs/libsqlite_ursula_vfs.so" src/sqlite_ursula/_lib/
          uv build --wheel --out-dir "$RUNNER_TEMP/dist"
          wheel=$(ls "$RUNNER_TEMP"/dist/sqlite_ursula-*.whl)
          python3 -c 'import sys, zipfile; names = zipfile.ZipFile(sys.argv[1]).namelist(); assert "sqlite_ursula/_lib/libsqlite_ursula_vfs.so" in names, names' "$wheel"
          uv venv --python 3.14 "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv/bin/python" "$wheel"
          # Outside the checkout, so the installed package is the one imported.
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/python" -m sqlite_ursula | tee doctor.txt
          grep -q "(bundled)$" doctor.txt

      - name: A uv-managed CPython on debian:trixie-slim hosts the wheel, as recipes/Dockerfile.uv installs it
        if: matrix.python == '3.14'
        env:
          IMAGE: public.ecr.aws/docker/library/debian:trixie-slim@sha256:f6b08b09a05725f9431502d3b5714f5c4576e82c1a84fa1debe0c24a7e0c3ec4
        run: |
          set -euo pipefail
          # The recipe's steps, with the runner's uv (the pinned 0.13.6, as the recipe's) and the
          # wheel the step above built.
          docker run --rm -v "$(command -v uv):/usr/local/bin/uv:ro" -v "$RUNNER_TEMP/dist:/dist:ro" \
            -e UV_PYTHON_PREFERENCE=only-managed -e UV_PYTHON_INSTALL_DIR=/opt/python -e VIRTUAL_ENV=/opt/venv \
            "$IMAGE" sh -euc '
              uv venv --python 3.13 /opt/venv
              uv pip install --no-cache /dist/sqlite_ursula-*.whl
              cd /
              /opt/venv/bin/python -m sqlite_ursula
            ' | tee recipe.txt
          grep -q "^result: ok" recipe.txt

      - name: python:3.13-slim cannot host the extension, and says what to use instead
        if: matrix.python == '3.14'
        env:
          IMAGE: public.ecr.aws/docker/library/python:3.13-slim@sha256:2d44738ebf4ce5f63b9d9ea871e9c7cfdc0426f7b0c97cac915fd88ded1d86bb
        run: |
          set -euo pipefail
          status=0
          out=$(docker run --rm -v "$PWD/clients/sqlite-ursula-python/src:/pkg:ro" -v "$RUNNER_TEMP/vfs:/vfs:ro" \
            -e PYTHONPATH=/pkg -e SQLITE_URSULA_VFS=/vfs/libsqlite_ursula_vfs.so "$IMAGE" python -m sqlite_ursula) || status=$?
          echo "$out"
          test "$status" -eq 1
          grep -q "^result: host_unsupported" <<<"$out"
          grep -q "sqlite-ursula-vfs needs SQLite [0-9.]* or newer" <<<"$out"
          grep -q "^fix: .*python:3.13-alpine" <<<"$out"

  # The host check on Windows, which the extension has no VFS for: the package imports, and
  # `python -m sqlite_ursula` and `open()` fail with host_unsupported, whose fix is WSL.
  sqlite-ursula-python-windows:
    name: sqlite-ursula-python (Windows host check)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.6"

      - name: python -m sqlite_ursula and open() fail with host_unsupported
        shell: bash
        working-directory: clients/sqlite-ursula-python
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          status=0
          out=$(uv run --no-project --python 3.13 python -m sqlite_ursula) || status=$?
          echo "$out"
          test "$status" -eq 1
          grep -q "^result: host_unsupported" <<<"$out"
          grep -q "^fix: .*WSL" <<<"$out"
          script='
          import sqlite_ursula
          try:
              sqlite_ursula.open("http://127.0.0.1:9/a/b")
          except sqlite_ursula.UrsulaSetupError as e:
              print(e.kind, e.action)
          '
          # Python writes \r\n on Windows.
          kind=$(uv run --no-project --python 3.13 python -c "$script" | tr -d '\r')
          echo "$kind"
          test "$kind" = "host_unsupported fix"

  # The Python suites on python:3.13-alpine (Alpine 3.23, SQLite 3.53), the image the Docker recipe
  # switches to: the extension and the model server are built there for musl, the extension
  # linked dynamically as npm-publish.yml builds it, since a musl Python cannot load a static one.
  sqlite-ursula-python-alpine:
    name: sqlite-ursula-python (model server, python:3.13-alpine)
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || format('runs-on={0}/cpu=8/ram=32/family=m7a+m8a/image=ubuntu24-full-x64/extras=s3-cache', github.run_id) }}
    timeout-minutes: 40
    steps:
      # Sends actions/cache to the RunsOn S3 cache. A no-op on GitHub-hosted runners.
      - name: Use the RunsOn cache
        uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0

      - name: Checkout
        uses: actions/checkout@v6

      - name: Build for musl and run the suites in python:3.13-alpine
        timeout-minutes: 35
        env:
          IMAGE: public.ecr.aws/docker/library/python:3.13-alpine3.23@sha256:b30bef26263dd158b3c8a5cca642fcd2f9c83cb6942138db50208cdb9be78bfe
        run: |
          set -euo pipefail
          toolchain=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          test -n "$toolchain"
          # As in npm-publish.yml, libsqlite3-sys must not probe a system libsqlite3.
          docker run --rm -v "$PWD:/src" -w /src/clients/sqlite-vfs \
            -e SQLITE3_LIB_DIR=/nonexistent -e CARGO_TERM_COLOR -e TOOLCHAIN="$toolchain" \
            -e RUSTFLAGS="-C target-feature=-crt-static" \
            "$IMAGE" sh -euxc '
              apk add --no-cache curl gcc musl-dev
              (cd / && curl --proto "=https" --tlsv1.2 --retry 5 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal --default-toolchain "$TOOLCHAIN")
              "$HOME/.cargo/bin/cargo" +"$TOOLCHAIN" build --locked --release
              "$HOME/.cargo/bin/cargo" +"$TOOLCHAIN" build --locked --release --features model --bin ursula-vfs-model
              python -c "import sqlite3; print(\"SQLite\", sqlite3.sqlite_version)"
              pip install --no-cache-dir --root-user-action=ignore pytest==9.1.1
              cd /src/clients/sqlite-ursula-python
              E2E_SERVER=model URSULA_VFS_MODEL=/src/clients/sqlite-vfs/target/release/ursula-vfs-model \
                SQLITE_URSULA_VFS=/src/clients/sqlite-vfs/target/release/libsqlite_ursula_vfs.so python -m pytest -v
            '

  # The static musl x64 ursula-vfs-host drains as the crate's build does: its open, driver and
  # transport against the model server, in H16 and H20 of test/host.e2e.ts.
  sqlite-vfs-host-musl-e2e:
    name: sqlite-vfs host tool e2e (x64 musl, model server)
    needs: [sqlite-vfs, sqlite-vfs-host-musl]
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || format('runs-on={0}/cpu=8/ram=32/family=m7a+m8a/image=ubuntu24-full-x64/extras=s3-cache', github.run_id) }}
    timeout-minutes: 20
    steps:
      # Sends actions/cache to the RunsOn S3 cache. A no-op on GitHub-hosted runners.
      - name: Use the RunsOn cache
        uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Download the extension and the model server
        uses: actions/download-artifact@v7
        with:
          name: sqlite-ursula-vfs
          path: ${{ runner.temp }}/vfs

      - name: Download the static ursula-vfs-host
        uses: actions/download-artifact@v7
        with:
          name: sqlite-vfs-host-musl-x64
          path: ${{ runner.temp }}/musl

      - name: e2e (H16 and H20 with the static binary)
        timeout-minutes: 10
        run: |
          chmod +x "$RUNNER_TEMP/vfs/ursula-vfs-model" "$RUNNER_TEMP/musl/ursula-vfs-host"
          cd clients/sqlite-ursula
          npm ci
          npm run build
          E2E_SERVER=model URSULA_VFS_MODEL="$RUNNER_TEMP/vfs/ursula-vfs-model" URSULA_VFS_HOST="$RUNNER_TEMP/musl/ursula-vfs-host" SQLITE_URSULA_VFS="$RUNNER_TEMP/vfs/libsqlite_ursula_vfs.so" npx vitest --run test/host.e2e.ts -t "H16|H20"

  # The release `ursula` for the e2e against the real server, cached by the inputs that build it so
  # a PR that touches only the extension or the package does not rebuild it. Bump the key's version
  # (v1) when the build command below changes.
  build-ursula:
    name: Build release ursula
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || format('runs-on={0}/cpu=8/ram=32/family=m7a+m8a/image=ubuntu24-full-x64/extras=s3-cache', github.run_id) }}
    timeout-minutes: 40
    steps:
      # Sends actions/cache to the RunsOn S3 cache. A no-op on GitHub-hosted runners.
      - name: Use the RunsOn cache
        uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0

      - name: Checkout
        uses: actions/checkout@v6

      - name: Cached ursula
        id: cache
        uses: actions/cache@v5
        with:
          path: ursula-bin/ursula
          key: ursula-release-v1-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'crates/**', 'third_party/**') }}

      - name: Install Rust toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          rustflags: ""

      - name: Build ursula
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cargo build --locked --release -p ursula --bin ursula
          mkdir -p ursula-bin
          cp target/release/ursula ursula-bin/ursula

      - name: Upload ursula
        uses: actions/upload-artifact@v6
        with:
          name: ursula-release
          path: ursula-bin/ursula
          if-no-files-found: error
          retention-days: 1

  # The same suites against the real server (E2E_SERVER=ursula): one node with an in-memory cold
  # store, and three nodes behind the gateway with no cold tier, where test/failover.e2e.ts kills
  # the leader of a stream's group during commits. A suite or case the real server cannot serve
  # says so in its name and why. No S3 here.
  sqlite-vfs-e2e-ursula:
    name: sqlite-vfs e2e (ursula, ${{ matrix.nodes }} node${{ matrix.nodes == '3' && 's + gateway' || '' }})
    needs: [build-ursula, sqlite-vfs]
    strategy:
      fail-fast: false
      matrix:
        nodes: ["1", "3"]
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || format('runs-on={0}/cpu=8/ram=32/family=m7a+m8a/image=ubuntu24-full-x64/extras=s3-cache', github.run_id) }}
    timeout-minutes: 45
    steps:
      # Sends actions/cache to the RunsOn S3 cache. A no-op on GitHub-hosted runners.
      - name: Use the RunsOn cache
        uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Download ursula
        uses: actions/download-artifact@v7
        with:
          name: ursula-release
          path: ${{ runner.temp }}/ursula-bin

      - name: Download the extension
        uses: actions/download-artifact@v7
        with:
          name: sqlite-ursula-vfs
          path: ${{ runner.temp }}/vfs

      - name: e2e (every suite, crashes, outages and Pi conformance included)
        timeout-minutes: 35
        env:
          E2E_NODES: ${{ matrix.nodes }}
          # No S3 here: one node keeps an in-memory cold store, three run with no cold tier.
          URSULA_COLD: ${{ matrix.nodes == '3' && 'none' || 'memory' }}
        run: |
          chmod +x "$RUNNER_TEMP/ursula-bin/ursula" "$RUNNER_TEMP/vfs/ursula-vfs-host"
          cd clients/sqlite-ursula
          npm ci
          npm run build
          # The model server stands in for another deployment (test/host.e2e.ts, H18).
          chmod +x "$RUNNER_TEMP/vfs/ursula-vfs-model"
          E2E_SERVER=ursula E2E_LOG_DIR="$RUNNER_TEMP/e2e-logs" URSULA_BIN="$RUNNER_TEMP/ursula-bin/ursula" URSULA_VFS_MODEL="$RUNNER_TEMP/vfs/ursula-vfs-model" URSULA_VFS_HOST="$RUNNER_TEMP/vfs/ursula-vfs-host" SQLITE_URSULA_VFS="$RUNNER_TEMP/vfs/libsqlite_ursula_vfs.so" npm run test:e2e

      - name: Upload the server logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: sqlite-vfs-e2e-ursula-${{ matrix.nodes }}-logs
          path: ${{ runner.temp }}/e2e-logs
          if-no-files-found: ignore
          retention-days: 7

  # The Python suites against one release `ursula` node with an in-memory cold store. The tests
  # that script faults, which only the model takes, skip.
  sqlite-ursula-python-ursula:
    name: sqlite-ursula-python (ursula, 1 node, CPython 3.14)
    needs: [build-ursula, sqlite-vfs]
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || format('runs-on={0}/cpu=4/ram=16/family=m7a+m8a/image=ubuntu24-full-x64/extras=s3-cache', github.run_id) }}
    timeout-minutes: 20
    env:
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      # Sends actions/cache to the RunsOn S3 cache. A no-op on GitHub-hosted runners.
      - name: Use the RunsOn cache
        uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.6"

      - name: Download ursula
        uses: actions/download-artifact@v7
        with:
          name: ursula-release
          path: ${{ runner.temp }}/ursula-bin

      - name: Download the extension
        uses: actions/download-artifact@v7
        with:
          name: sqlite-ursula-vfs
          path: ${{ runner.temp }}/vfs

      - name: e2e
        timeout-minutes: 10
        working-directory: clients/sqlite-ursula-python
        run: |
          chmod +x "$RUNNER_TEMP/ursula-bin/ursula"
          E2E_SERVER=ursula E2E_LOG_DIR="$RUNNER_TEMP/e2e-logs" URSULA_BIN="$RUNNER_TEMP/ursula-bin/ursula" SQLITE_URSULA_VFS="$RUNNER_TEMP/vfs/libsqlite_ursula_vfs.so" \
            uv run --no-project --python 3.14 --with pytest==9.1.1 python -m pytest -v

      - name: Upload the server log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: sqlite-ursula-python-ursula-logs
          path: ${{ runner.temp }}/e2e-logs
          if-no-files-found: ignore
          retention-days: 7

  # The parts suites (test/parts.e2e.ts, test/import.e2e.ts and the core's snapshot-parts cases)
  # through three nodes behind a gateway whose request limit, 4 MiB, is below the test snapshots,
  # with the CI S3 as the cold store: the path a deployment's snapshots in parts take. Its 4 MiB is
  # the client's batch cap, so the PART runs keep their sizes. Its own job, so that only it gets
  # `id-token: write`. Another suite that needs three nodes, the gateway and a cold store joins it
  # by adding its file to SUITES.
  sqlite-vfs-e2e-ursula-parts:
    name: sqlite-vfs e2e (ursula, 3 nodes + gateway + S3, snapshot parts)
    needs: [build-ursula, sqlite-vfs]
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || format('runs-on={0}/cpu=8/ram=32/family=m7a+m8a/image=ubuntu24-full-x64/extras=s3-cache', github.run_id) }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      # Keeps the job's OIDC request variables out of npm and test processes: a speed bump against
      # env-scraping code, not a boundary.
      NO_OIDC: env -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_ID_TOKEN_REQUEST_TOKEN
    steps:
      # Sends actions/cache to the RunsOn S3 cache. A no-op on GitHub-hosted runners.
      - name: Use the RunsOn cache
        uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Download ursula
        uses: actions/download-artifact@v7
        with:
          name: ursula-release
          path: ${{ runner.temp }}/ursula-bin

      - name: Download the extension
        uses: actions/download-artifact@v7
        with:
          name: sqlite-ursula-vfs
          path: ${{ runner.temp }}/vfs

      # Before any AWS credential exists.
      - name: Install and build the package
        run: |
          chmod +x "$RUNNER_TEMP/ursula-bin/ursula"
          cd clients/sqlite-ursula
          $NO_OIDC npm ci --ignore-scripts
          $NO_OIDC npm run build

      # AWS S3 through the CI role (one prefix per job) on same-repo PRs and main, MinIO otherwise.
      - name: S3 backend
        id: s3
        uses: ./.github/actions/ci-s3
        with:
          role-arn: ${{ secrets.URSULA_CI_AWS_ROLE_ARN }}
          bucket: ${{ secrets.URSULA_CI_S3_BUCKET }}
          region: ${{ vars.URSULA_CI_S3_REGION || 'us-east-1' }}
          job-key: ${{ github.job }}

      - name: e2e (snapshot parts through the gateway)
        timeout-minutes: 35
        env:
          E2E_SERVER: ursula
          E2E_NODES: "3"
          # The S3 backend above (test/stack.ts reads URSULA_S3_*).
          URSULA_COLD: s3
          E2E_GATEWAY_MAX_REQUEST_BYTES: "4194304"
          SUITES: test/parts.e2e.ts test/import.e2e.ts
          # Run from test/core.e2e.ts by name; the step fails unless at least CORE_MIN pass.
          CORE_CASES: in parts
          CORE_MIN: "2"
        run: |
          export E2E_LOG_DIR="$RUNNER_TEMP/e2e-logs" URSULA_BIN="$RUNNER_TEMP/ursula-bin/ursula" SQLITE_URSULA_VFS="$RUNNER_TEMP/vfs/libsqlite_ursula_vfs.so"
          cd clients/sqlite-ursula
          # shellcheck disable=SC2086 # SUITES is a space-separated list of files
          $NO_OIDC npx vitest --run $SUITES
          report="$RUNNER_TEMP/core-cases.json"
          $NO_OIDC npx vitest --run test/core.e2e.ts -t "$CORE_CASES" --reporter=default --reporter=json --outputFile.json="$report"
          node -e '
            const r = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            const min = Number(process.argv[2]);
            console.log(`test/core.e2e.ts -t "${process.argv[3]}": ${r.numPassedTests} passed, ${r.numPendingTests} skipped`);
            if (!(r.numPassedTests >= min)) throw new Error(`expected at least ${min} core cases to pass`);
          ' "$report" "$CORE_MIN" "$CORE_CASES"

      # Secret masking covers logs, not artifacts: the node logs can name the bucket.
      - name: Redact and check the server logs for AWS credentials and identifiers
        id: leak
        if: failure() && env.URSULA_S3_PREFIX != ''
        uses: ./.github/actions/ci-s3-artifact-guard
        with:
          dir: ${{ runner.temp }}/e2e-logs
          role-arn: ${{ secrets.URSULA_CI_AWS_ROLE_ARN }}

      - name: Upload the server logs
        if: failure() && (steps.leak.outcome == 'success' || env.URSULA_S3_PREFIX == '')
        uses: actions/upload-artifact@v6
        with:
          name: sqlite-vfs-e2e-ursula-parts-logs
          path: ${{ runner.temp }}/e2e-logs
          if-no-files-found: ignore
          retention-days: 7

      - name: Delete this job's S3 prefix
        if: always() && env.URSULA_S3_PREFIX != ''
        continue-on-error: true
        timeout-minutes: 10
        env: { AWS_EC2_METADATA_DISABLED: "true" }
        run: |
          case "$URSULA_S3_PREFIX" in ci/*/*) ;; *) echo "::error::refusing to delete '$URSULA_S3_PREFIX'"; exit 1 ;; esac
          aws s3 rm "s3://$URSULA_S3_BUCKET/$URSULA_S3_PREFIX/" --recursive --only-show-errors

  # M1 exit criterion: a commit's p50 on the VFS within 0.5 ms of B1, plain node:sqlite with WAL and
  # synchronous=NORMAL, on the same workload (clients/sqlite-ursula/bench/commit.ts). Latency on a
  # shared runner is noisy, so this job is not a required check: it reports both values in the job
  # summary and fails when the criterion is not met. A second run has the host's hold file present.
  sqlite-vfs-perf:
    name: sqlite-vfs perf (commit p50 against B1)
    needs: [sqlite-vfs]
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || format('runs-on={0}/cpu=8/ram=32/family=m7a+m8a/image=ubuntu24-full-x64/extras=s3-cache', github.run_id) }}
    timeout-minutes: 25
    steps:
      # Sends actions/cache to the RunsOn S3 cache. A no-op on GitHub-hosted runners.
      - name: Use the RunsOn cache
        uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Download the extension and the model server
        uses: actions/download-artifact@v7
        with:
          name: sqlite-ursula-vfs
          path: ${{ runner.temp }}/vfs

      - name: Commit p50, VFS against B1
        timeout-minutes: 10
        run: |
          chmod +x "$RUNNER_TEMP/vfs/ursula-vfs-model"
          cd clients/sqlite-ursula
          npm ci
          URSULA_VFS_MODEL="$RUNNER_TEMP/vfs/ursula-vfs-model" SQLITE_URSULA_VFS="$RUNNER_TEMP/vfs/libsqlite_ursula_vfs.so" node bench/commit.ts

      # The same with the host's hold file present and not taken: each write transaction tries it.
      - name: Commit p50, VFS with a hold file present, against B1
        timeout-minutes: 10
        run: |
          cd clients/sqlite-ursula
          BENCH_HOLD=1 URSULA_VFS_MODEL="$RUNNER_TEMP/vfs/ursula-vfs-model" SQLITE_URSULA_VFS="$RUNNER_TEMP/vfs/libsqlite_ursula_vfs.so" node bench/commit.ts

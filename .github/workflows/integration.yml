name: Integration

# Verification that the main CI workflow (ci.yml) does not already run: every Rust integration test
# target, and the sqlite-vfs extension (lint, units, build) with its TypeScript e2e suite against a
# release `ursula` built once per run, on a single node and on 3 nodes + gateway + MinIO. Lint, unit
# tests and the DST seeds run in ci.yml.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  integration:
    name: Rust integration tests
    runs-on: depot-ubuntu-24.04-8
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      # The S3 tests (the runtime's cold path, the CLI cold-manifest restart, which exercises the
      # format-epoch marker against real S3 listing, and ursula-index's conditional publish) run
      # against MinIO. Each uses its own per-run root in one bucket.
      - name: Start MinIO
        run: scripts/minio_ci.sh

      - name: Create the S3 test bucket
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_DEFAULT_REGION: us-east-1
        run: |
          if ! command -v aws >/dev/null 2>&1; then
            python3 -m pip install --quiet --user awscli
            export PATH="$HOME/.local/bin:$PATH"
          fi
          aws --endpoint-url http://127.0.0.1:9000 s3 mb s3://ursula-ci

      # Integration test targets only (`tests/*.rs` of every crate, including ursula-index's,
      # which the main CI does not run); lib and bin unit tests run in ci.yml. ursula-sim runs
      # under madsim in ci.yml's DST job.
      - name: Test all integration targets
        env:
          URSULA_COLD_S3_INTEGRATION: "1"
          URSULA_COLD_S3_BUCKET: ursula-ci
          URSULA_COLD_S3_ENDPOINT: http://127.0.0.1:9000
          URSULA_COLD_S3_REGION: us-east-1
          URSULA_COLD_S3_ACCESS_KEY_ID: minioadmin
          URSULA_COLD_S3_SECRET_ACCESS_KEY: minioadmin
          URSULA_COLD_S3_SSE: none
          URSULA_EVENT_INDEX_S3_INTEGRATION: "1"
          URSULA_EVENT_INDEX_S3_BUCKET: ursula-ci
          URSULA_EVENT_INDEX_S3_ENDPOINT: http://127.0.0.1:9000
          URSULA_EVENT_INDEX_S3_REGION: us-east-1
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_REGION: us-east-1
        run: cargo test --workspace --exclude ursula-sim --test '*'

  build-ursula:
    name: Build release ursula
    runs-on: depot-ubuntu-24.04-8
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Build ursula
        run: cargo build --release -p ursula --bin ursula

      - name: Upload ursula
        uses: actions/upload-artifact@v6
        with:
          name: ursula-release
          path: target/release/ursula
          if-no-files-found: error
          retention-days: 1

  sqlite-vfs:
    name: sqlite-vfs (extension lint + units + build)
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 20
    env:
      # Keeps libsqlite3-sys from probing (and linking) a system libsqlite3: the extension only calls
      # the host's SQLite through sqlite3_api_routines.
      SQLITE3_LIB_DIR: /nonexistent
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
          cache-workspaces: clients/sqlite-vfs

      - name: Lint, unit-test and build the extension
        run: |
          cd clients/sqlite-vfs
          cargo fmt --check
          cargo clippy --locked --release --all-targets -- -D warnings
          cargo test --locked --release
          cargo build --locked --release
          ldd target/release/libsqlite_ursula_vfs.so

      - name: Upload the extension
        uses: actions/upload-artifact@v6
        with:
          name: sqlite-ursula-vfs
          path: clients/sqlite-vfs/target/release/libsqlite_ursula_vfs.so
          if-no-files-found: error
          retention-days: 1

  # The extension's macOS-only code (the kernel boot id from `kern.bootsessionuuid`) compiles and its
  # unit test runs only here.
  sqlite-vfs-macos:
    name: sqlite-vfs on macOS (extension lint + units)
    runs-on: macos-15
    timeout-minutes: 20
    env:
      SQLITE3_LIB_DIR: /nonexistent
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
          cache-workspaces: clients/sqlite-vfs

      - name: Lint and unit-test the extension
        run: |
          cd clients/sqlite-vfs
          cargo clippy --locked --release --all-targets -- -D warnings
          cargo test --locked --release

  sqlite-vfs-e2e:
    name: sqlite-vfs e2e (single-node ursula)
    needs: [build-ursula, sqlite-vfs]
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Download ursula
        uses: actions/download-artifact@v7
        with:
          name: ursula-release
          path: ${{ runner.temp }}/ursula-bin

      - name: Download the extension
        uses: actions/download-artifact@v7
        with:
          name: sqlite-ursula-vfs
          path: ${{ runner.temp }}/vfs

      - name: e2e (transparency, crash matrix, fencing, recovery, local cache, snapshots, Pi conformance, benchmark)
        timeout-minutes: 30
        run: |
          chmod +x "$RUNNER_TEMP/ursula-bin/ursula"
          cd clients/sqlite-ursula
          npm ci
          npm run typecheck
          URSULA_BIN="$RUNNER_TEMP/ursula-bin/ursula" SQLITE_URSULA_VFS="$RUNNER_TEMP/vfs/libsqlite_ursula_vfs.so" npm run test:e2e

      # Without a cold tier the default per-group hot limit trips after ~68 MB of frames: the
      # snapshot run writes ~160 MB, so only snapshots + retention keep it admitted.
      - name: snapshots + retention without a cold tier (default hot limit)
        timeout-minutes: 10
        run: |
          cd clients/sqlite-ursula
          URSULA_COLD=none URSULA_BIN="$RUNNER_TEMP/ursula-bin/ursula" SQLITE_URSULA_VFS="$RUNNER_TEMP/vfs/libsqlite_ursula_vfs.so" npx vitest --run test/snapshot.e2e.ts

  sqlite-vfs-e2e-cluster:
    name: sqlite-vfs e2e (3 nodes + gateway + MinIO)
    needs: [build-ursula, sqlite-vfs]
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 40
    env:
      URSULA_S3_ENDPOINT: http://127.0.0.1:9000
      URSULA_S3_ACCESS_KEY: minioadmin
      URSULA_S3_SECRET_KEY: minioadmin
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Start MinIO
        run: scripts/minio_ci.sh

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Download ursula
        uses: actions/download-artifact@v7
        with:
          name: ursula-release
          path: ${{ runner.temp }}/ursula-bin

      - name: Download the extension
        uses: actions/download-artifact@v7
        with:
          name: sqlite-ursula-vfs
          path: ${{ runner.temp }}/vfs

      # Snapshot bodies above 1 MiB go to the cold tier (S3). The benchmark's Pi turns snapshot and
      # trim as they go (a 64 KiB minimum, so the threshold is the database size).
      - name: Pi conformance (3 modes), snapshots + retention, benchmark through the gateway
        timeout-minutes: 30
        run: |
          chmod +x "$RUNNER_TEMP/ursula-bin/ursula"
          cd clients/sqlite-ursula
          npm ci
          E2E_NODES=3 URSULA_VFS_SNAPSHOT_MIN_BYTES=65536 URSULA_BIN="$RUNNER_TEMP/ursula-bin/ursula" SQLITE_URSULA_VFS="$RUNNER_TEMP/vfs/libsqlite_ursula_vfs.so" npx vitest --run test/conformance.e2e.ts test/snapshot.e2e.ts test/bench.e2e.ts

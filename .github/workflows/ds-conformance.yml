name: Durable Streams conformance

# Official Durable Streams server conformance suite against a single local
# Ursula node, gated on scripts/ds-conformance/expected-failures.txt.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  conformance:
    name: DS conformance (single node, memory)
    runs-on: depot-ubuntu-24.04-8
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Build ursula
        run: cargo build --bin ursula

      - name: Run conformance suite
        run: scripts/ds-conformance/run.sh "$PWD/target/debug/ursula" 15500

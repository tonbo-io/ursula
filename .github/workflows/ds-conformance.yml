name: Durable Streams conformance

# Official Durable Streams server conformance suite against a single local
# Ursula node, gated on scripts/ds-conformance/expected-failures.txt.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  conformance:
    name: DS conformance (single node)
    # Fork PRs run on GitHub-hosted runners: RunsOn runners run inside our AWS account.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || format('runs-on={0}/cpu=8/ram=32/family=m7a+m8a/image=ubuntu24-full-x64/extras=s3-cache', github.run_id) }}
    steps:
      # Sends actions/cache to the RunsOn S3 cache. A no-op on GitHub-hosted runners.
      - name: Use the RunsOn cache
        uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Build ursula
        run: cargo build --bin ursula

      - name: Run conformance suite
        run: scripts/ds-conformance/run.sh "$PWD/target/debug/ursula" 15500

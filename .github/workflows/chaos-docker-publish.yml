name: Chaos Agent Docker Publish

on:
  pull_request:
    paths:
      - .github/workflows/chaos-docker-publish.yml
      - Cargo.toml
      - Dockerfile.chaos-agent
      - Dockerfile.chaos-agent.dockerignore
      - scripts/ursula_chaos_agent.py
      - scripts/validate-release-version.sh
  workflow_call:
    inputs:
      publish:
        required: true
        type: boolean
      version:
        required: true
        type: string
      source_revision:
        required: true
        type: string
    outputs:
      digest:
        description: Published multi-platform chaos-agent image digest
        value: ${{ jobs.docker.outputs.digest }}

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: chaos-docker-${{ inputs.source_revision || github.sha }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-chaos-agent
  DOCKER_PLATFORMS: linux/amd64,linux/arm64
  DOCKER_METADATA_ANNOTATIONS_LEVELS: index

jobs:
  docker:
    name: Chaos-agent image
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_revision || github.sha }}

      - name: Validate release inputs
        if: inputs.publish
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          set -euo pipefail
          ./scripts/validate-release-version.sh "$RELEASE_VERSION" >/dev/null
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"

      - name: Set up Depot
        uses: depot/setup-action@v1

      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=pr
            type=raw,value=${{ inputs.version }},enable=${{ inputs.publish == true }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ inputs.publish == true && !contains(inputs.version, '-') }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.source_revision || github.sha }}
            org.opencontainers.image.version=${{ inputs.version || format('pr-{0}', github.event.number) }}

      # GHCR holds only the release index and its two platform images.
      # Provenance and the SBOM go to GitHub's attestation store below, keyed
      # by the index digest, so the build writes no attestation manifests.
      - name: Build and publish chaos-agent image
        id: build
        uses: depot/build-push-action@v1
        with:
          project: ls2d88cjpz
          context: .
          file: ./Dockerfile.chaos-agent
          platforms: ${{ env.DOCKER_PLATFORMS }}
          push: ${{ inputs.publish == true }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: false
          sbom: false

      - name: Attest chaos-agent build provenance
        if: inputs.publish
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: false

      # The SBOM describes the linux/amd64 image. Both platform images come
      # from one Dockerfile with the same package set. The SPDX version is
      # pinned because the release verifies its predicate type.
      - name: Generate chaos-agent SBOM
        if: inputs.publish
        uses: anchore/sbom-action@v0
        env:
          SYFT_PLATFORM: linux/amd64
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json@2.3
          output-file: ${{ runner.temp }}/ursula-chaos-agent-image.spdx.json
          artifact-name: ursula-chaos-agent-image.spdx.json

      - name: Attest chaos-agent SBOM
        if: inputs.publish
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: ${{ runner.temp }}/ursula-chaos-agent-image.spdx.json
          push-to-registry: false

name: sqlite-vfs Build

# Builds the SQLite extension (clients/sqlite-vfs) for every platform the clients ship it for, as
# npm-publish.yml and pypi-publish.yml package it. Each platform's library is the artifact
# `extension-<platform>`, holding `<platform>/<file>`.
#
# - linux-x64-gnu and linux-arm64-gnu: built on glibc 2.28 (manylinux_2_28, AlmaLinux 8), so the
#   library loads on any glibc at least that new: Debian 11, Ubuntu 20.04, Amazon Linux 2023,
#   RHEL 8 and later. A library that needs a newer glibc fails the build.
# - linux-x64-musl: linked dynamically against musl, since Alpine's node and python cannot load a
#   statically linked library.
# - darwin-arm64: macOS 11.0 and later.

on:
  workflow_call:
    inputs:
      ref:
        description: The commit to build
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.platform }}
    # Linux entries are RunsOn labels that take the run id, and fork PRs run on GitHub-hosted
    # runners, since RunsOn runners run inside our AWS account. `macos-15` has no placeholder.
    runs-on: ${{ github.event.pull_request.head.repo.fork && matrix.hosted || format(matrix.runner, github.run_id) }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64-gnu
            runner: runs-on={0}/cpu=8/ram=32/family=m7a+m8a/image=ubuntu24-full-x64
            hosted: ubuntu-24.04
            image: quay.io/pypa/manylinux_2_28_x86_64:2026.10.03-1@sha256:39df0042d5cc900b085aa25a0659368b42a0006c54c474299b785b44c1b4ff82
          - platform: linux-arm64-gnu
            runner: runs-on={0}/cpu=8/ram=32/family=m8g+m7g/image=ubuntu24-full-arm64
            hosted: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64:2026.10.03-1@sha256:f5f03dedf61b47d69d0742d36047db78adeee3bdb7a9910ff52304750ecf2514
          - platform: linux-x64-musl
            runner: runs-on={0}/cpu=8/ram=32/family=m7a+m8a/image=ubuntu24-full-x64
            hosted: ubuntu-24.04
            image: public.ecr.aws/docker/library/alpine:3.22@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8
          - platform: darwin-arm64
            runner: macos-15
            hosted: macos-15
    env:
      # As in integration.yml: keeps libsqlite3-sys from probing (and linking) a system libsqlite3.
      # The extension only calls the host's SQLite through sqlite3_api_routines.
      SQLITE3_LIB_DIR: /nonexistent
      # No debug info in the shipped library (the crate's release profile keeps it for profiling).
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_PROFILE_RELEASE_STRIP: debuginfo
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # The repository's toolchain (rust-toolchain.toml), minimal profile, inside the build image.
      - name: Build in the image
        if: runner.os == 'Linux'
        env:
          IMAGE: ${{ matrix.image }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          toolchain=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          test -n "$toolchain"
          rustflags=
          case "$PLATFORM" in *-musl) rustflags="-C target-feature=-crt-static" ;; esac
          docker run --rm -v "$PWD:/src" -w /src/clients/sqlite-vfs \
            -e SQLITE3_LIB_DIR -e CARGO_PROFILE_RELEASE_DEBUG -e CARGO_PROFILE_RELEASE_STRIP -e CARGO_TERM_COLOR \
            -e TOOLCHAIN="$toolchain" -e RUSTFLAGS="$rustflags" \
            "$IMAGE" sh -euxc '
              if command -v apk >/dev/null; then apk add --no-cache curl gcc musl-dev; fi
              (cd / && curl --proto "=https" --tlsv1.2 --retry 5 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal --default-toolchain "$TOOLCHAIN")
              "$HOME/.cargo/bin/cargo" +"$TOOLCHAIN" build --locked --release
            '

      - name: Install Rust toolchain
        if: runner.os == 'macOS'
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          rustflags: ""
          cache: false

      - name: Build on macOS
        if: runner.os == 'macOS'
        working-directory: clients/sqlite-vfs
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: cargo build --locked --release

      - name: Check the library
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          case "$PLATFORM" in
            darwin-*)
              lib=clients/sqlite-vfs/target/release/libsqlite_ursula_vfs.dylib
              otool -L "$lib"
              vtool -show-build "$lib"
              ;;
            *)
              lib=clients/sqlite-vfs/target/release/libsqlite_ursula_vfs.so
              readelf -d "$lib" | grep NEEDED
              ;;
          esac
          # The newest glibc symbol version the library needs is the oldest glibc it loads on.
          case "$PLATFORM" in
            *-gnu)
              objdump -T "$lib" | grep -o 'GLIBC_[0-9][0-9.]*' | sort -uV
              floor=$(objdump -T "$lib" | grep -o 'GLIBC_[0-9][0-9.]*' | sed 's/^GLIBC_//' | sort -uV | tail -n1)
              echo "$PLATFORM: needs glibc $floor or later" >>"$GITHUB_STEP_SUMMARY"
              if [ "$(printf '%s\n' "$floor" 2.28 | sort -V | tail -n1)" != 2.28 ]; then
                echo "::error::$PLATFORM needs glibc $floor, newer than 2.28"
                exit 1
              fi
              ;;
          esac
          ls -l "$lib"
          mkdir -p "$RUNNER_TEMP/extension/$PLATFORM"
          cp "$lib" "$RUNNER_TEMP/extension/$PLATFORM/"

      - name: Upload the extension
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: extension-${{ matrix.platform }}
          path: ${{ runner.temp }}/extension
          if-no-files-found: error
          retention-days: 7

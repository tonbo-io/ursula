name: Commit Candidate Build

# A commit candidate is a canary deployment artifact, not a Ursula release.
# It never creates a Git tag, GitHub Release, stable image alias, or source
# version bump, and it writes nothing to GHCR. A dispatched build is saved in
# the Depot Registry for the Depot project's image retention period, and its
# chart is installed from a checkout of the same commit. The run summary says
# how to pull the image and install the chart. Pull requests only build.
# Stable releases are published only after the candidate has passed the
# reviewed EKS rollout and recovery checks.
on:
  pull_request:
    paths:
      - .dockerignore
      - .github/workflows/commit-candidate-build.yml
      - Dockerfile
      - charts/ursula/**
      - scripts/helm_template_test.py
  workflow_dispatch:
    inputs:
      commit:
        description: Exact current main commit or same-repository open PR head to build
        required: true
        type: string
      confirm:
        description: Type build-main-commit-candidate or build-open-pr-commit-candidate
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  id-token: write

concurrency:
  group: commit-candidate-${{ github.event_name == 'workflow_dispatch' && inputs.commit || github.sha }}
  cancel-in-progress: true

env:
  CHART_DIR: charts/ursula
  DEPOT_PROJECT: ls2d88cjpz
  DOCKER_PLATFORMS: linux/amd64,linux/arm64

jobs:
  candidate:
    name: Build commit candidate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.commit || github.sha }}

      - name: Resolve and authorize candidate
        id: candidate
        env:
          CONFIRM: ${{ inputs.confirm }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REQUESTED_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail

          commit="$(git rev-parse HEAD)"
          channel="pr"
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$REQUESTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
            [ "$commit" = "$REQUESTED_COMMIT" ]
            git fetch origin main --no-tags
            if [[ "$CONFIRM" == build-main-commit-candidate ]]; then
              [ "$(git rev-parse origin/main)" = "$commit" ]
              channel="main"
            elif [[ "$CONFIRM" == build-open-pr-commit-candidate ]]; then
              matching_prs="$(
                gh api \
                  -H 'Accept: application/vnd.github+json' \
                  "/repos/$REPOSITORY/commits/$commit/pulls" |
                jq -r --arg repository "$REPOSITORY" --arg commit "$commit" \
                  '[.[] | select(.state == "open" and .base.ref == "main" and .head.sha == $commit and .head.repo.full_name == $repository)] | length'
              )"
              [ "$matching_prs" = 1 ] || {
                echo "$commit must be the unique head of an open same-repository PR targeting main" >&2
                exit 1
              }
            else
              echo "invalid candidate confirmation" >&2
              exit 1
            fi
          fi

          short_commit="${commit:0:12}"
          candidate_version="0.0.0-${channel}.${short_commit}"
          echo "commit=$commit" >>"$GITHUB_OUTPUT"
          echo "version=$candidate_version" >>"$GITHUB_OUTPUT"

      - name: Verify source release metadata is unchanged
        run: ./scripts/check-release-versions.sh

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Validate candidate chart
        run: |
          set -euo pipefail
          helm lint "$CHART_DIR" --strict
          helm template ursula "$CHART_DIR" >/tmp/ursula-chart-rendered.yaml
          python3 scripts/helm_template_test.py
          bash "$CHART_DIR/files/graceful-rollout_test.sh"
          helm template ursula "$CHART_DIR" \
            --namespace ursula \
            -f "$CHART_DIR/examples/production-eks.yaml" \
            >/tmp/ursula-production-eks.yaml

      - name: Set up Depot
        uses: depot/setup-action@v1

      # A dispatched build is saved in the Depot Registry under its build ID.
      # Like the release build, it writes no attestation manifests, so the
      # candidate index has the same shape as a release index.
      - name: Build candidate image
        id: image
        uses: depot/build-push-action@v1
        with:
          project: ${{ env.DEPOT_PROJECT }}
          context: .
          file: ./Dockerfile
          platforms: ${{ env.DOCKER_PLATFORMS }}
          push: false
          save: ${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.candidate.outputs.commit }}
            org.opencontainers.image.version=${{ steps.candidate.outputs.version }}
          provenance: false
          sbom: false

      - name: Record candidate evidence
        if: github.event_name == 'workflow_dispatch'
        env:
          BUILD_ID: ${{ steps.image.outputs.build-id }}
          CANDIDATE_VERSION: ${{ steps.candidate.outputs.version }}
          COMMIT: ${{ steps.candidate.outputs.commit }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$BUILD_ID" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          repository="registry.depot.dev/$DEPOT_PROJECT"
          {
            echo "## Commit candidate"
            echo
            echo "- Commit: \`$COMMIT\`"
            echo "- Candidate: \`$CANDIDATE_VERSION\`"
            echo "- Depot build: \`$BUILD_ID\`"
            echo "- Image: \`$repository:$BUILD_ID\`"
            echo "- Image digest: \`$IMAGE_DIGEST\`"
            echo
            echo "The image is in the Depot Registry, not GHCR, until the Depot project's image retention period ends."
            echo "This is not a stable release and created no Git tag or GitHub Release."
            echo
            echo "### Pull the image"
            echo
            echo "Registry logins use the username \`x-token\` with a Depot token as the password."
            echo "\`depot pull-token\` prints a read-only token for this build that expires after one hour."
            echo "A node that pulls the image after that fails, so a canary that runs longer needs a Depot project token in its pull secret,"
            echo "or a copy of the build in the cluster's own registry made with \`depot push\`."
            echo
            echo '```bash'
            echo "depot pull --project $DEPOT_PROJECT $BUILD_ID"
            echo "depot pull-token --project $DEPOT_PROJECT $BUILD_ID"
            echo "kubectl --namespace <namespace> create secret docker-registry depot-registry \\"
            echo "  --docker-server=registry.depot.dev \\"
            echo "  --docker-username=x-token \\"
            echo "  --docker-password=<token>"
            echo '```'
            echo
            echo "### Install the chart from the same commit"
            echo
            echo "Add the cluster's values files as for any install."
            echo
            echo '```bash'
            echo "git fetch origin $COMMIT"
            echo "git checkout --detach $COMMIT"
            echo "helm upgrade --install ursula ./charts/ursula --namespace <namespace> \\"
            echo "  --set global.image.repository=$repository \\"
            echo "  --set global.image.tag=$BUILD_ID \\"
            echo "  --set 'global.imagePullSecrets[0].name=depot-registry'"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

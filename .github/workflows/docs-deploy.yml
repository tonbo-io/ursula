name: Deploy docs

on:
  push:
    branches:
      - main
    paths:
      - docs/web/**
      - .github/workflows/docs-deploy.yml
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit SHA to build and deploy
        required: true
        default: main
        type: string
      branch:
        description: Cloudflare Pages branch to deploy to (main is production, anything else is a preview)
        required: false
        default: main
        type: string

permissions:
  contents: read

# Keyed on the Pages branch being deployed, so a preview never cancels a
# production deploy and two deploys of one branch never race.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.branch || 'main' }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy docs to Cloudflare Pages
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: docs/web
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build docs (latest and archived versions)
        run: npm run build:all

      - name: Verify versioned output
        run: node scripts/docs-versions.mjs verify

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}
          DEPLOY_BRANCH: ${{ inputs.branch || 'main' }}
        run: |
          if ! [[ "$DEPLOY_BRANCH" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "invalid Pages branch: $DEPLOY_BRANCH" >&2
            exit 1
          fi
          npx wrangler pages deploy dist --project-name "$CLOUDFLARE_PAGES_PROJECT_NAME" --branch="$DEPLOY_BRANCH"

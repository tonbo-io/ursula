# Ursula server configuration file
#
# This is the primary configuration format for Ursula.  Every setting that
# used to be controlled by environment variables or CLI flags now lives here.
#
# Quick start:
#   cargo run --bin ursula -- --config ./ursula.toml
#
# The binary also searches for a default config in the following order:
#   ./ursula.toml  →  ./ursula.json  →  ./ursula.yaml  →  ./ursula.yml  →  /etc/ursula/ursula.toml  →  /etc/ursula/ursula.json  →  /etc/ursula/ursula.yaml  →  /etc/ursula/ursula.yml  →  …
#
# Config loading order (later wins):
#   1. Built-in defaults
#   2. Preset (--preset default|dev|tiny|small|standard|large)
#   3. This config file
#   4. CLI overrides (--node-id)
#
# ------------------------------------------------------------------------------
# [server]  — HTTP server binding and admission controls
# ------------------------------------------------------------------------------
[server]
# Public HTTP client API bind address. Client-plane routes (append, read,
# metrics, readiness, usage) are served here. When cluster_listen is unset,
# Raft/cluster routes are also served on this socket.
listen = "127.0.0.1:4437"

# Optional separate bind for the cluster / Raft gRPC plane. When set,
# server.listen serves client/API routes and this address serves Raft/cluster
# routes. Peer URLs must point to server.listen when cluster_listen is unset,
# or to server.cluster_listen when it is set. Leader redirects name a peer's
# client_url, which every [[raft.peers]] entry needs when cluster_listen is
# set, and its url otherwise.
# cluster_listen = "10.0.0.1:4439"

# The deployment's id, sent as Ursula-Cluster-Id on every HEAD: 1 to 64
# characters from A-Z, a-z, 0-9, ".", "_" and "-". Required when
# raft.wal.path is set, the same on every node and different for every
# deployment a client can reach. A single node without raft.wal.path runs
# under a generated one, new at every start. The WAL records the id, and a
# node whose configured id differs refuses to start.
# cluster_id = "prod-us-east-1"

# Process-wide cap on accepted write body bytes held by the HTTP layer.
# A request must reserve its body bytes before axum drains the body into
# Bytes, and the reservation lives until the response is produced.  This
# turns memory pressure into backpressure at the HTTP edge.
# Use a human-readable size: "64MiB", "1GiB", etc. Omit to inherit the
# built-in or preset default; the built-in default is 256MiB.
# With a cold backend it must be at least 64MiB: a snapshot commit's copy
# is charged against it (32MiB at the least) beside one request of the
# 32MiB limit, and a node with less refuses to start.
# http_inflight_body_size = "256MiB"   # default: 256 MiB

# ------------------------------------------------------------------------------
# [runtime]  — Per-core runtime sizing and admission controls
# ------------------------------------------------------------------------------
[runtime]
# Number of CPU cores / tokio worker threads to use.  Each core owns a
# deterministic subset of Raft groups (sharding by hash).
# Defaults to the machine's available parallelism when omitted.
core_count = 4

# Emergency RSS abort threshold. Exceeding it aborts the process, without
# returning HTTP 503 or gracefully handing off leadership. Omit to disable
# the monitor.
# node_memory_abort_cap_size = "8GiB"

# Minimum payload size that triggers external cold-store staging instead
# of inline hot-ring storage.  Payloads below this size are kept in memory.
# Omit to use the default (1 MiB).
# external_payload_min_size = "1MiB"

# Max live-read waiters per core.  When the limit is reached, new live
# read requests are rejected with HTTP 503. Omit to inherit the built-in
# or preset default; the built-in default is 65536. Set explicitly to 0
# to disable the limit.
# live_read_max_waiters_per_core = 65536

# ------------------------------------------------------------------------------
# [raft]  — Raft consensus, the meta group and cluster networking
# ------------------------------------------------------------------------------
[raft]
# Unique node ID within the cluster.  Must be present in raft.peers and must
# be non-zero.  Can also be supplied via --node-id CLI.  A WAL root opens only
# under the node ID that created it.
node_id = 1

# Number of Raft groups (shards).  Each stream hashes to exactly one group.
# More groups = finer-grained parallelism but slightly more memory overhead.
# Required once raft.peers lists another node, the same on every node.  At
# most 4096.
group_count = 16

# Per-group cap on raft-submitted-but-not-yet-applied payload bytes.
# Catches raft replication lag before in-memory queues grow unbounded.
# Use a human-readable size.  Omit to disable the admission.
# max_uncommitted_size_per_group = "64MiB"

# The meta group's voters at genesis, as raft.peers node IDs.  Unset, the
# smallest min(3, N) IDs.  Read once, when the meta group forms: meta voters
# never change afterwards and are never decommissioned.  Every other node is
# a meta learner.
# meta_voters = [1, 2, 3]

# A group's initializer that holds nothing of the group initializes it only
# once every voter reports an empty group.  How often it logs that it is
# still waiting; it keeps probing indefinitely.
# bootstrap_peer_probe = "60s"

# Interval between bootstrap probes of the other voters.
# bootstrap_peer_probe_interval = "250ms"

# Timeout of one bootstrap probe of another voter.
# bootstrap_peer_connect = "500ms"

# OpenRaft's install_snapshot_timeout covers the whole FullSnapshot RPC.
# The receiver reads the sender's object, writes its own copy, checks it
# and installs it before replying, so on a cluster node with S3 snapshots
# this must stay above four snapshot-store requests (a GET, up to two PUTs
# and a HEAD), each with storage.snapshot.s3_timeout and s3_max_retries.
# A node refuses to start when it does not. It also bounds how
# long a sent object stays held, and the second GC pass after a failed
# write runs this long later.
# install_snapshot_timeout = "120s"

# Consecutive gRPC RPC failures before forcing a transport reconnect.
# grpc_reconnect_after_failures = 8

# Max concurrent snapshot installs across all groups on this node.
# snapshot_install_max_concurrency = 1

# Far entry backstop of the snapshot driver: a group snapshots once it applied
# this many entries since its last snapshot, whatever its log bytes.  The same
# on a single node and on a cluster node.  0.8 kept a single node's groups
# within 5000 entries; set 5000 to keep that bound.
# snapshot_backstop_logs = 100000

# How long a replica keeps a deleted, purged or expired stream in its current
# Raft snapshot and its Raft log after it applies the removal.  Unset, the
# larger of 1h and eight times install_snapshot_timeout.  A set value must be
# at least eight times install_snapshot_timeout.
# deleted_data_max_age = "1h"

# ------------------------------------------------------------------------------
# [raft.placement]  — How the meta group places the data groups
# ------------------------------------------------------------------------------
# At bootstrap each data group runs on min(replication_factor, N) consecutive
# peers in ascending node ID, from index `group mod N`, and the first of them
# initializes it.  The meta group records the placement, and groups change
# nodes only by a move (ursulactl placement move).  A node added to raft.peers
# later holds no group until groups move onto it.
# [raft.placement]
# replication_factor = 3      # voters per data group, read at genesis
# max_concurrent_moves = 4    # groups that may move at once, 0 stops moves

# ------------------------------------------------------------------------------
# [raft.wal]  — Raft write-ahead log persistence
# ------------------------------------------------------------------------------
[raft.wal]
# The Raft WAL is the per-core journal on disk.
#
# Directory for the WAL files.  Ursula appends a "raft-log" subdirectory
# automatically.  Required when raft.peers lists another node.  With it,
# raft.peers lists this node and server.cluster_id is set, on a single node
# too.  Without it a single node runs its WAL in a fresh temporary directory
# that is removed on clean shutdown, so nothing survives a restart.
# path = "/data/ursula"

# When WAL appends reach stable storage: "never" | "always"
#   never   — acknowledge from the page cache.  A host crash can cost a
#             replica its unsynced tail; it then catches up from the leader
#             before it votes again.  A group whose majority lost it stops
#             until an operator accepts the loss.
#   always  — acknowledge after fsync.
# Unset: "always" when groups have one or two voters, "never" otherwise.  The
# meta group's journal in raft-log/meta/ always runs "always".
# fsync = "never"

# The disk lease.  The node syncs a probe of the WAL disk every second.  With
# no synced probe for this long it stops all Raft traffic and object writes
# and answers clients 503 until a probe syncs.  From 2s to 10s.
# lease = "5s"

# ------------------------------------------------------------------------------
# [raft.peers]  — Raft peers, the only source of peer addresses (repeatable)
# ------------------------------------------------------------------------------
# Uncomment and repeat for every node in the cluster, this node included.  A
# single node with raft.wal.path lists itself.  `url` is the address peers
# dial: server.listen, or server.cluster_listen when that is set. With
# cluster_listen set, add `client_url` (the peer's server.listen address),
# which leader redirects name, for example:
#   url = "http://10.0.0.1:4439"
#   client_url = "http://10.0.0.1:4437"
# [[raft.peers]]
# node_id = 1
# url = "http://10.0.0.1:4437"
# [[raft.peers]]
# node_id = 2
# url = "http://10.0.0.2:4437"
# [[raft.peers]]
# node_id = 3
# url = "http://10.0.0.3:4437"

# ------------------------------------------------------------------------------
# [storage.cold]  — Cold-tier (object store) flush, GC, and cache
# ------------------------------------------------------------------------------
[storage.cold]
# Cold-storage backend: "none" | "memory" | "s3"
#   none    — cold tier disabled (all data stays in memory)
#   memory  — in-memory object store (testing / development)
#   s3      — S3-compatible object store (requires [storage.cold.s3])
backend = "none"

# Root prefix for cold-storage objects (e.g. S3 prefix or local dir).
# root = "ursula-cold"

# Interval between periodic cold-flush passes.
# flush_interval = "1s"

# Target number of hot bytes to flush per group per pass.
# flush_size = "8MiB"

# Minimum hot bytes a group must have before it is eligible for flush.
# Falls back to flush_size when unset.
# flush_min_hot_size = "8MiB"

# Upper bound on bytes flushed per group per pass.
# Falls back to flush_size when unset.
# flush_max_size = "8MiB"

# Max groups flushed concurrently.
# flush_max_concurrency = 4

# Per-group hot-size cap.  When a group's hot bytes exceed this, new writes
# are rejected with HTTP 503.  Omit to inherit default/preset behavior; set
# explicitly to "0" to disable the admission.
# max_hot_size_per_group = "64MiB"

# Interval between periodic cold-gc passes.
# gc_interval = "5s"

# Max GC entries to process per group per pass.
# gc_max_entries = 256

# ------------------------------------------------------------------------------
# [storage.cold.cache]  — Optional cold-read cache
# ------------------------------------------------------------------------------
# When cold backend is not "none" and this section is omitted, a default
# cache is still enabled automatically.  Uncomment to customize.
# [storage.cold.cache]
# max_size = "256MiB"
# block_size = "1MiB"
# readahead_blocks = 4

# ------------------------------------------------------------------------------
# [storage.cold.s3]  — S3 connection and credentials
# ------------------------------------------------------------------------------
# Required when storage.cold.backend = "s3".
# [storage.cold.s3]
# bucket = "my-ursula-bucket"
# region = "us-east-1"
# endpoint = "http://localhost:9000"   # for MinIO, etc.
# access_key_id = "AKIA..."
# secret_access_key = "..."
# session_token = "..."                # optional
# server_side_encryption = "aes256"    # "aes256" (SSE-S3, default) | "aws-kms" | "none"
# kms_key_id = "arn:aws:kms:..."       # customer managed key for "aws-kms"; optional
# timeout = "10s"
# max_retries = 3
# probe_timeout = "5s"     # health probe deadline, retries included (non-zero)
# unhealthy_ticks = 3      # bad health ticks before shedding leadership (non-zero)
# heal_ticks = 2           # good health ticks in a row before leading again (non-zero)

# ------------------------------------------------------------------------------
# [storage.snapshot]  — Raft snapshot store
# ------------------------------------------------------------------------------
[storage.snapshot]
# Snapshot store backend: "auto" | "inline" | "s3"
#   auto    — s3 when [storage.cold] uses the s3 backend, inline otherwise
#             (default)
#   inline  — snapshot bytes ride through Raft, no external store
#   s3      — snapshots written to S3 (shares [storage.cold.s3] credentials)
backend = "auto"

# Interval of the snapshot driver, which takes every Raft snapshot: it
# snapshots each group once the Raft log it applied since its last snapshot
# reaches max(F, 2 x that snapshot's size), F = raft.snapshot_log_budget
# divided by twice the group count (at most 16 MiB).  Omitted: 5s with an
# external store (whose health it probes), 1s inline.  The driver always
# runs, so "0s" is refused at startup.
# drive_interval = "5s"

# Root directory for local snapshot store.  Required when backend = "local".
# local_root = "/data/ursula/snapshots"

# S3 object key suffix for snapshot blobs. Resolved against storage.cold.root
# when present; if storage.cold.root is absent, keys are relative to the S3
# bucket root plus this prefix. Only used when backend = "s3".
# s3_prefix = "snapshots"

# Per-attempt timeout and retries of an S3 snapshot-store request, apart
# from [storage.cold.s3]. A PUT sends the whole object in one attempt, so
# the timeout must also cover a healthy PUT of the largest snapshot. A
# follower's install copy (a GET, up to two PUTs and a HEAD) must fit inside
# raft.install_snapshot_timeout: 22s per request and 88s per copy with the
# defaults.
# s3_timeout = "10s"
# s3_max_retries = 1

# ------------------------------------------------------------------------------
# [governance]  — Background governance task tuning (optional)
# ------------------------------------------------------------------------------
# All sub-sections are optional; sensible defaults apply when omitted.

# [governance.leadership_balance]
# interval      = "5s"      # balancer tick interval
# max_per_tick  = 4         # max leader handoffs per tick
# peer_timeout  = "500ms"   # wait for a peer's shed state, balancer and health gates (non-zero)

# [governance.cluster_probe]
# interval        = "500ms"  # probe tick interval
# probe_size      = "64KiB"  # probe payload size
# timeout         = "200ms"  # per-probe timeout
# unhealthy_ticks = 2        # failed ticks before marking unhealthy
# heal_ticks      = 6        # healthy ticks before clearing unhealthy

# [governance.commit_stall]
# interval   = "1s"  # watchdog tick interval
# threshold  = "3s"  # stall duration before leader transfer

# [governance.cold_health]
# interval             = "1s"      # health-gate tick interval
# unhealthy_ticks      = 3         # ticks before shedding leadership
# heal_ticks           = 6         # ticks before re-allowing leadership
# hot_size_high        = "64MiB"   # per-group hot bytes high watermark (default: 7 MiB)
# hot_size_low         = "32MiB"   # per-group hot bytes low watermark (default: 4 MiB)
# errors_per_tick_high = 1         # error threshold per tick

# ------------------------------------------------------------------------------
# [observability]  — Telemetry and debugging
# ------------------------------------------------------------------------------
[observability]
# Enable tokio-console integration (requires building with tokio_unstable).
# Can also be enabled by setting URSULA_TOKIO_CONSOLE=1.
tokio_console = false

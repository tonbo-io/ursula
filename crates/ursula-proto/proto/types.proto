syntax = "proto3";

package ursula.durable.v1;

message BucketStreamIdV1 {
  string bucket_id = 1;
  string stream_id = 2;
  // Field 3 was the removed affinity key.
  reserved 3;
  reserved "affinity_key";
}

// Also a serde type (see build.rs): Ursula's compact MessagePack writes it
// as an array of its fields in declaration order, whatever their tags. Do not
// reorder, insert or remove fields within a minor.
message ProducerRequestV1 {
  string producer_id = 1;
  uint64 producer_epoch = 2;
  uint64 producer_seq = 3;
  // BLAKE3-256 of the write's body as the Producer-Digest header names it,
  // 32 bytes. Part of the write's identity when present.
  optional bytes digest = 4;
  // What the proposer found wrong with the body. Apply answers it only for
  // a write that would apply, after the producer rows and the closed check
  // (#581 section 5.3, step 5), so a repeat still gets its receipt.
  ContentFaultV1 content_fault = 5;
}

enum ContentFaultV1 {
  CONTENT_FAULT_NONE = 0;
  // A body without a Content-Type.
  CONTENT_FAULT_MISSING_CONTENT_TYPE = 1;
  // The body's BLAKE3-256 differs from the Producer-Digest header.
  CONTENT_FAULT_DIGEST_MISMATCH = 2;
  // A JSON body that is not valid JSON message text.
  CONTENT_FAULT_MALFORMED_JSON = 3;
}

// Also a serde type (see build.rs): Ursula's compact MessagePack writes it
// as an array of its fields in declaration order, whatever their tags. Do not
// reorder, insert or remove fields within a minor.
message ExternalPayloadRefV1 {
  string s3_path = 1;
  uint64 payload_len = 2;
  uint64 object_size = 3;
}

// Also a serde type (see build.rs): Ursula's compact MessagePack writes it
// as an array of its fields in declaration order, whatever their tags. Do not
// reorder, insert or remove fields within a minor.
message ColdChunkRefV1 {
  uint64 start_offset = 1;
  uint64 end_offset = 2;
  string s3_path = 3;
  uint64 object_size = 4;
  // Byte offset of this stream slice inside the physical object.
  uint64 object_offset = 5;
  // Shared objects may contain slices from more than one stream.
  bool shared_object = 6;
  // BLAKE3 digest of this logical slice. Empty means unverified; flush and
  // compaction then skip the digest check.
  string payload_digest = 7;
}

message ShardPlacementV1 {
  uint32 core_id = 1;
  uint32 shard_id = 2;
  uint32 raft_group_id = 3;
}

syntax = "proto3";

package ursula.durable.v1;

import "types.proto";

message SnapshotFrameV1 {
  // Field 3 held the per-stream append counts (F9): `appends` in the stream
  // frame's usage holds them since format epoch 7.
  reserved 3;
  reserved "append_count";
  oneof frame {
    SnapshotHeaderV1 header = 1;
    StreamSnapshotEntryV1 stream = 2;
    ColdGcEntryV1 cold_gc = 4;
    SnapshotFooterV1 footer = 5;
    // Always the first frame, checked before any other frame is decoded.
    // Snapshots from Ursula 0.5.x and earlier (format epoch 1) have none.
    FormatEpochV1 format_epoch = 6;
    // One per unretired end record, by ascending seq (F20).
    EndRecordV1 end_record = 8;
  }
}

message FormatEpochV1 {
  uint32 epoch = 1;
}

message SnapshotHeaderV1 {
  ShardPlacementV1 placement = 1;
  uint64 group_commit_index = 2;
  repeated string buckets = 3;
  uint64 next_cold_gc_seq = 4;
  // Per-bucket usage totals: each bucket's retired usage plus its live
  // versions plus its end records. An install requires the committed
  // counters to equal those parts exactly (F20), and recomputes the gauges
  // from the restored streams.
  repeated BucketUsageV1 bucket_usage = 5;
  // Field 6 held the removed per-bucket data-plane quota records.
  reserved 6;
  reserved "bucket_quotas";
  // Unit used to derive every committed_write_units counter in this snapshot.
  // Every writer sets it; presence stays on the wire and an absent value is
  // refused as corruption.
  optional uint64 committed_write_unit_bytes = 7;
  // Field 8 held the removed shared-object owner map: a shared pack lives
  // under its bucket's prefix, so it has exactly one owner.
  reserved 8;
  reserved "shared_cold_object_owners";
  // Permanent bucket-erasure fences.
  repeated string erased_buckets = 9;
  // Field 10 held a removed replicated per-group version (C0).
  reserved 10;
  reserved "feature_level";
  // Largest stream created_at_ms the group assigned (C7). Restore raises it
  // to every live stream's created_at_ms.
  uint64 last_created_at_ms = 11;
  // The group's latest history event (#581 section 4.2). Absent before the
  // group's genesis applied.
  HistoryEventV1 history = 12;
  // The latest usage seq the group assigned. Required: a header without it
  // is refused.
  optional uint64 usage_seq = 13;
  // Every end record at or below it is folded. Required.
  optional uint64 retired_through = 14;
  // Per bucket, the usage of every folded end record and of every version
  // a backup import restored, one row per bucket the group ever wrote
  // (F15).
  repeated BucketRetiredV1 retired = 15;
  // The id of the group's genesis history, 0 before its genesis. Required.
  optional uint64 genesis = 16;
}

// A history event: the group's genesis, an import or an accepted loss.
message HistoryEventV1 {
  // The random, non-zero id the event's proposer drew. Zero is refused.
  uint64 id = 1;
  // The log index of the entry that applied the event.
  uint64 event_index = 2;
  // The 32-byte BLAKE3 digest of the backup the group was restored from.
  optional bytes imported = 3;
  // The last log index the history kept from the one it replaced (#613).
  // Required: a frame without it is refused.
  optional uint64 kept = 4;
  // The id of the history this one replaced, 0 for none (#613). Required:
  // a frame without it is refused.
  optional uint64 previous = 5;
  // The term and node of the leader that proposed the event, 0 for an
  // import (#613). Required: a frame without them is refused.
  optional uint64 leader_term = 6;
  optional uint64 leader_node = 7;
}

// What a stream's current history began from (W5).
message InheritedHistoryV1 {
  // The stream's history id before the event.
  uint64 history = 1;
  // The stream's tail at the event: bytes below it are unchanged.
  uint64 offset = 2;
}

message BucketUsageV1 {
  string bucket_id = 1;
  uint64 committed_append_bytes = 2;
  uint64 committed_records = 3;
  uint64 retained_bytes = 4;
  uint64 stream_count = 5;
  // Committed writes in the self-described usage unit, rounded up per
  // operation. Field number 6 is unchanged from the original 10 KiB-specific
  // name, so existing snapshots remain wire-compatible.
  uint64 committed_write_units = 6;
}

message SnapshotFooterV1 {}

message StreamSnapshotEntryV1 {
  StreamMetadataV1 metadata = 1;
  // Field 2 held the removed per-stream attribute JSON.
  reserved 2;
  reserved "attrs_json";
  uint64 hot_start_offset = 3;
  bytes payload = 4;
  repeated HotPayloadSegmentV1 hot_segments = 5;
  // Field 6 held the removed scalar cold frontier; cold coverage is derived
  // from the hot buffer (bounded-state F18).
  reserved 6;
  reserved "cold_frontier_offset";
  uint64 cold_index_generation = 7;
  repeated ColdChunkRefV1 cold_chunks = 8;
  repeated ObjectPayloadRefV1 external_segments = 9;
  // Field 10 held the removed per-message records (bounded-state F4b).
  reserved 10;
  reserved "message_records";
  // Field 11 held the removed per-stream integrity tally.
  reserved 11;
  reserved "integrity";
  StreamVisibleSnapshotV1 visible_snapshot = 12;
  repeated ProducerSnapshotV1 producer_states = 13;
  // Fields 14, 15 and 17-19 held the removed JSON record index (record
  // coordinates); JSON message boundaries are the LF bytes themselves.
  reserved 14, 15, 17, 18, 19;
  reserved "first_record", "record_offsets", "record_mark_records", "record_mark_offsets", "dense_first_record";
  // Destructive-retention floor. Every writer sets it; presence stays on the
  // wire and an absent value is refused as corruption.
  optional uint64 retained_offset = 16;
  // Field 20 held the removed hot append starts; streams without a record
  // index keep no per-message boundaries.
  reserved 20;
  reserved "hot_append_starts";
  // The highest epoch of any producer record the stream retired: its epoch
  // floor. Absent when the stream never retired one.
  optional uint64 retired_epoch_watermark = 21;
  // The group's history id when the stream was created or last changed its
  // bytes or closure.
  uint64 history = 22;
  // What the stream's current history began from, recorded by its first
  // write after a history event.
  InheritedHistoryV1 inherited = 23;
  // The version's usage (F20). Required: a stream frame without it is
  // refused as corruption.
  StreamUsageV1 usage = 24;
}

// A live version's usage (F20).
message StreamUsageV1 {
  // Its usage seq, unique in the group. Zero is refused.
  uint64 seq = 1;
  // What it committed, and its applied appends. Required.
  VersionCountersV1 counters = 2;
  // Its counters when the history in field 22 began for it. Required.
  VersionCountersV1 history_baseline = 3;
  // now_ms of its newest counted write, its create included. Absent for a
  // version restored from a backup that counted no write since.
  optional uint64 last_write_at_ms = 4;
  // The history its counters began in. Zero is refused.
  uint64 counted_since = 5;
}

message VersionCountersV1 {
  uint64 committed_append_bytes = 1;
  uint64 committed_records = 2;
  uint64 committed_write_units = 3;
  uint64 appends = 4;
}

message CommittedUsageV1 {
  uint64 committed_append_bytes = 1;
  uint64 committed_records = 2;
  uint64 committed_write_units = 3;
}

message BucketRetiredV1 {
  string bucket_id = 1;
  // Required.
  CommittedUsageV1 retired = 2;
}

enum StreamEndV1 {
  // Refused: an end record without an end is corruption.
  STREAM_END_UNSPECIFIED = 0;
  STREAM_END_DELETED = 1;
  STREAM_END_EXPIRED = 2;
  STREAM_END_PURGED = 3;
}

// The final usage of a version that ended, until the group's sweep folds
// it into its bucket's retired usage (F20).
message EndRecordV1 {
  // The seq of its end. Zero is refused.
  uint64 seq = 1;
  // Required.
  BucketStreamIdV1 stream_id = 2;
  uint64 created_at_ms = 3;
  // The history its counters began in. Zero is refused.
  uint64 counted_since = 4;
  // The group's history when it ended. Zero is refused.
  uint64 ended_in = 5;
  StreamEndV1 end = 6;
  // now_ms of the entry that removed it.
  uint64 ended_at_ms = 7;
  // Required.
  VersionCountersV1 counters = 8;
  // Its counters when `ended_in` began for it. Required.
  VersionCountersV1 history_baseline = 9;
  // As in StreamUsageV1.
  optional uint64 last_write_at_ms = 10;
}

message StreamMetadataV1 {
  reserved 10, 11, 12;

  BucketStreamIdV1 stream_id = 1;
  string content_type = 2;
  StreamStatusV1 status = 3;
  uint64 tail_offset = 4;
  optional string last_stream_seq = 5;
  optional uint64 stream_ttl_seconds = 6;
  optional uint64 stream_expires_at_ms = 7;
  uint64 created_at_ms = 8;
  uint64 last_ttl_touch_at_ms = 9;
}

enum StreamStatusV1 {
  reserved 2;

  STREAM_STATUS_OPEN = 0;
  STREAM_STATUS_CLOSED = 1;
}

message HotPayloadSegmentV1 {
  uint64 start_offset = 1;
  uint64 end_offset = 2;
  uint64 payload_start = 3;
  uint64 payload_end = 4;
}

message ObjectPayloadRefV1 {
  uint64 start_offset = 1;
  uint64 end_offset = 2;
  string s3_path = 3;
  uint64 object_size = 4;
}

message StreamVisibleSnapshotV1 {
  uint64 offset = 1;
  string content_type = 2;
  // Inline body; empty when `object` holds it.
  bytes payload = 3;
  string digest = 4;
  // Cold-tier object holding the whole body (bounded-state F16). Absent for
  // inline snapshots.
  ExternalPayloadRefV1 object = 5;
}

message ProducerSnapshotV1 {
  string producer_id = 1;
  // The current epoch, opened by a claim.
  uint64 epoch = 2;
  // The highest applied seq of `epoch`.
  uint64 last_seq = 3;
  // The receipt of the write at `last_seq`.
  uint64 newest_start_offset = 4;
  uint64 newest_next_offset = 5;
  bool newest_closed = 6;
  // Fields 7 and 8 held the removed receipt items and receipt window: a
  // record keeps one receipt, its newest write's.
  reserved 7, 8;
  reserved "last_items", "receipts";
  // now_ms of the producer's newest accepted write, for idle expiry
  // (bounded-state F3). Always written; decoding an absent value is an
  // error.
  optional uint64 last_seen_ms = 9;
  // The 32-byte digest the claim of `epoch` carried, if any.
  optional bytes claim_digest = 10;
  // The 32-byte digest the write at `last_seq` carried, if any.
  optional bytes newest_digest = 11;
  // The epoch the claim of `epoch` closed, with its last applied seq.
  ClosedEpochV1 closed_epoch = 12;
  // The record's lineage opened at or below the stream's epoch floor (an
  // untokened claim of a forgotten producer). A tokened write on it is
  // producer-expired until it claims above the floor.
  bool opened_below_floor = 13;
  // The group's history id when the claim of `epoch` applied. A record of
  // another history than the group's is history-fenced.
  uint64 history = 14;
}

message ClosedEpochV1 {
  uint64 epoch = 1;
  uint64 seq = 2;
}

message ColdGcEntryV1 {
  uint64 seq = 1;
  oneof target {
    BucketStreamIdV1 stream = 2;
    ColdGcPathsV1 paths = 3;
  }
  uint64 not_before_ms = 4;
  string bucket_id = 5;
  // Cold generation of the removed stream incarnation (bounded-state F14g).
  // Always set for a stream target and absent for a paths target; the GC
  // worker refuses a stream target without it and deletes nothing.
  optional uint64 cold_generation = 6;
  // Failed attempts the leader's GC worker deferred (DeferColdGc, F14b); it
  // backs off exponentially in it.
  uint32 defer_attempts = 7;
}

message ColdGcPathsV1 {
  repeated string paths = 1;
}

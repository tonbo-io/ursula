syntax = "proto3";

package ursula.durable.v1;

import "types.proto";

message SnapshotFrameV1 {
  oneof frame {
    SnapshotHeaderV1 header = 1;
    StreamSnapshotEntryV1 stream = 2;
    StreamAppendCountV1 append_count = 3;
    ColdGcEntryV1 cold_gc = 4;
    SnapshotFooterV1 footer = 5;
  }
}

message SnapshotHeaderV1 {
  ShardPlacementV1 placement = 1;
  uint64 group_commit_index = 2;
  repeated string buckets = 3;
  uint64 next_cold_gc_seq = 4;
  // Monotonic per-bucket usage counters; gauges are recomputed from the
  // restored streams. Absent in legacy snapshots.
  repeated BucketUsageV1 bucket_usage = 5;
  // Per-bucket data-plane quota records. Absent in legacy snapshots.
  repeated BucketQuotaV1 bucket_quotas = 6;
  // Unit used to derive every committed_write_units counter in this snapshot.
  // Absent means the original 10 KiB contract for backward compatibility.
  optional uint64 committed_write_unit_bytes = 7;
  // Bucket owners whose bytes have occupied a still-live shared object.
  // Retained until physical deletion so per-bucket erasure proof survives
  // snapshots taken during legacy pack migration.
  repeated SharedColdObjectOwnersV1 shared_cold_object_owners = 8;
  // Permanent bucket-erasure fences. Absent in snapshots written before
  // tenant physical-erasure proof became part of the contract.
  repeated string erased_buckets = 9;
  // Replicated group feature level (C0). Absent in snapshots
  // written before feature levels, which decode as level 0. Never lowered;
  // a binary refuses snapshots above its supported level.
  uint32 feature_level = 10;
  // Largest stream created_at_ms the group assigned at feature level 1 or
  // later (C7). Absent in older snapshots, which decode as 0;
  // restore raises it to every live stream's created_at_ms at level 1.
  uint64 last_created_at_ms = 11;
}

message SharedColdObjectOwnersV1 {
  string s3_path = 1;
  repeated string bucket_ids = 2;
}

message BucketUsageV1 {
  string bucket_id = 1;
  uint64 committed_append_bytes = 2;
  uint64 committed_records = 3;
  uint64 retained_bytes = 4;
  uint64 stream_count = 5;
  // Committed writes in the self-described usage unit, rounded up per
  // operation. Field number 6 is unchanged from the original 10 KiB-specific
  // name, so existing snapshots remain wire-compatible.
  uint64 committed_write_units = 6;
}

message BucketQuotaV1 {
  string bucket_id = 1;
  optional uint64 max_streams = 2;
  optional uint64 max_retained_bytes = 3;
}

message SnapshotFooterV1 {}

message StreamSnapshotEntryV1 {
  StreamMetadataV1 metadata = 1;
  optional bytes attrs_json = 2;
  uint64 hot_start_offset = 3;
  bytes payload = 4;
  repeated HotPayloadSegmentV1 hot_segments = 5;
  uint64 cold_frontier_offset = 6;
  uint64 cold_index_generation = 7;
  repeated ColdChunkRefV1 cold_chunks = 8;
  repeated ObjectPayloadRefV1 external_segments = 9;
  repeated StreamMessageRecordV1 message_records = 10;
  StreamIntegritySnapshotV1 integrity = 11;
  StreamVisibleSnapshotV1 visible_snapshot = 12;
  repeated ProducerSnapshotV1 producer_states = 13;
  optional uint64 first_record = 14;
  // Exact start offsets of the dense (unflushed) records, from
  // dense_first_record (field 19) when present, else from first_record.
  repeated uint64 record_offsets = 15;
  optional uint64 retained_offset = 16;
  // Sparse cold record marks (bounded-state F1, feature level 2): one
  // (record, offset) pair per 1 MiB block of sealed log that holds a record
  // start, as two parallel lists. Absent means all-dense.
  repeated uint64 record_mark_records = 17;
  repeated uint64 record_mark_offsets = 18;
  // First record with a dense offset. Absent means first_record.
  optional uint64 dense_first_record = 19;
  // Start offsets of the messages at or above the seal point, for streams
  // without a record index (bounded-state F4b, feature level 4). From that
  // level message_records (field 10) is empty once a stream converted.
  repeated uint64 hot_append_starts = 20;
}

message StreamMetadataV1 {
  reserved 10, 11, 12;

  BucketStreamIdV1 stream_id = 1;
  string content_type = 2;
  StreamStatusV1 status = 3;
  uint64 tail_offset = 4;
  optional string last_stream_seq = 5;
  optional uint64 stream_ttl_seconds = 6;
  optional uint64 stream_expires_at_ms = 7;
  uint64 created_at_ms = 8;
  uint64 last_ttl_touch_at_ms = 9;
}

enum StreamStatusV1 {
  reserved 2;

  STREAM_STATUS_OPEN = 0;
  STREAM_STATUS_CLOSED = 1;
}

message HotPayloadSegmentV1 {
  uint64 start_offset = 1;
  uint64 end_offset = 2;
  uint64 payload_start = 3;
  uint64 payload_end = 4;
}

message ObjectPayloadRefV1 {
  uint64 start_offset = 1;
  uint64 end_offset = 2;
  string s3_path = 3;
  uint64 object_size = 4;
}

message StreamMessageRecordV1 {
  uint64 start_offset = 1;
  uint64 end_offset = 2;
}

message StreamIntegritySnapshotV1 {
  string live_setsum = 1;
  string evicted_setsum = 2;
  string total_setsum = 3;
  uint64 live_start_offset = 4;
  uint64 tail_offset = 5;
  uint64 live_records = 6;
  uint64 evicted_records = 7;
  uint64 total_records = 8;
}

message StreamVisibleSnapshotV1 {
  uint64 offset = 1;
  string content_type = 2;
  // Inline body; empty when `object` holds it.
  bytes payload = 3;
  string digest = 4;
  // Cold-tier object holding the whole body (bounded-state F16, feature
  // level 5). Absent for inline snapshots.
  ExternalPayloadRefV1 object = 5;
}

message ProducerSnapshotV1 {
  string producer_id = 1;
  uint64 producer_epoch = 2;
  uint64 producer_seq = 3;
  uint64 last_start_offset = 4;
  uint64 last_next_offset = 5;
  bool last_closed = 6;
  // Written only below feature level 1; level 1 answers from the newest
  // receipt, which the receipt window never evicts (bounded-state F3).
  repeated ProducerAppendRecordV1 last_items = 7;
  repeated ProducerReceiptV1 receipts = 8;
  // now_ms of the producer's newest accepted write, kept from feature level
  // 1 on for idle expiry (bounded-state F3). Absent for producers last
  // written below level 1 and in older snapshots.
  optional uint64 last_seen_ms = 9;
}

message ProducerReceiptV1 {
  uint64 producer_seq = 1;
  uint64 start_offset = 2;
  uint64 next_offset = 3;
  bool closed = 4;
  repeated ProducerAppendRecordV1 items = 5;
}

message ProducerAppendRecordV1 {
  uint64 start_offset = 1;
  uint64 next_offset = 2;
  bool closed = 3;
  optional uint64 record_start = 4;
  optional uint64 record_next = 5;
}

message StreamAppendCountV1 {
  BucketStreamIdV1 stream_id = 1;
  uint64 append_count = 2;
}

message ColdGcEntryV1 {
  uint64 seq = 1;
  oneof target {
    BucketStreamIdV1 stream = 2;
    ColdGcPathsV1 paths = 3;
  }
  uint64 not_before_ms = 4;
  string bucket_id = 5;
  // Cold generation of the removed stream incarnation for a stream target
  // enqueued at feature level 1 or later (bounded-state F14g). Absent marks
  // a legacy entry.
  optional uint64 cold_generation = 6;
  // Failed attempts the leader's GC worker deferred (DeferColdGc, F14b,
  // feature level 1); it backs off exponentially in it.
  uint32 defer_attempts = 7;
}

message ColdGcPathsV1 {
  repeated string paths = 1;
}

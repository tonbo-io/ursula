[package]
name = "ursula-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "Per-core actor runtime for Ursula: hot ring, cold-tier flush, and the replaceable group-engine boundary."

[dependencies]
blake3 = { workspace = true }
bytes = { workspace = true, features = ["serde"] }
crossbeam-utils = { workspace = true }
futures-util = { workspace = true }
http = { workspace = true }
opendal = { workspace = true, features = ["services-memory", "services-s3"] }
reqsign = { workspace = true }
reqwest = { workspace = true }
rmp-serde = { workspace = true }
serde = { workspace = true }
serde_bytes = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }
tracing = { workspace = true }
ursula-config = { workspace = true }
ursula-proto = { workspace = true }
ursula-shard = { workspace = true }
ursula-stream = { workspace = true }
zstd = { workspace = true }

[target.'cfg(not(madsim))'.dependencies]
# Fresh S3 snapshot object names (#687). The S3 store is not built under madsim.
rand = { workspace = true, features = ["thread_rng"] }

[target.'cfg(madsim)'.dependencies]
sim-tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
core_affinity = { workspace = true }

[dev-dependencies]
dhat = { workspace = true }
criterion = { workspace = true, features = ["async_tokio"] }
# A local operator whose objects carry a modification time, for the
# snapshot GC grace tests (#669).
opendal = { workspace = true, features = ["services-fs"] }
tempfile = { workspace = true }

[[bench]]
name = "cold_cache"
harness = false

[[bench]]
name = "hot_snapshot"
harness = false

[[bench]]
name = "append_apply"
harness = false

[[bench]]
name = "atomic_padding"
harness = false

[lints]
workspace = true

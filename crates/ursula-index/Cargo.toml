[package]
name = "ursula-index"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Rebuildable client-event-time index for Ursula JSON record streams."

[[bench]]
name = "event_time_query"
harness = false

[[bench]]
name = "keyed_point_read"
harness = false

[dependencies]
anyhow = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
clap = { workspace = true, features = ["derive"] }
bytes = { workspace = true }
foyer = { workspace = true }
futures-util = { workspace = true }
getrandom = { workspace = true }
parquet = { workspace = true }
opendal = { workspace = true, features = ["services-s3"] }
reqwest = { workspace = true, features = ["rustls-tls"] }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
ursula-observability = { workspace = true }
ursula-shard = { workspace = true }

[target.'cfg(madsim)'.dependencies]
sim-tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }

[lints]
workspace = true

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "test-util", "time"] }
tower = { workspace = true, features = ["util"] }

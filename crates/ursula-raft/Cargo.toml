[package]
name = "ursula-raft"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "OpenRaft integration for Ursula's per-group multi-Raft replication: network, log store, and snapshot transport."

[dependencies]
crossbeam-utils = { workspace = true }
bitflags = { workspace = true }
bytes = { workspace = true }
blake3 = { workspace = true }
crc32fast = { workspace = true }
futures-util = { workspace = true }
fs4 = { workspace = true }
openraft-rt = { workspace = true }
openraft = { workspace = true }
# Not used directly: pins OpenRaft's own dependencies to its release.
openraft-macros = { workspace = true }
openraft-rt-tokio = { workspace = true }
opentelemetry = { workspace = true }
prost = { workspace = true }
rmp-serde = { workspace = true }
serde = { workspace = true }
serde_bytes = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-stream = { workspace = true, features = ["net"] }
tonic = { workspace = true, features = ["transport"] }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
ursula-control = { workspace = true }
ursula-runtime = { workspace = true }
ursula-proto = { workspace = true }
ursula-config = { workspace = true }
ursula-headers = { workspace = true }
rand = { workspace = true, features = ["thread_rng"] }
ursula-shard = { workspace = true }
ursula-stream = { workspace = true }
arc-swap = { workspace = true }

[build-dependencies]
protoc-bin-vendored = { workspace = true }
tonic-build = { workspace = true, features = ["prost"] }

[target.'cfg(madsim)'.dependencies]
madsim = { workspace = true }
pin-project-lite = { workspace = true }
rand = { workspace = true, features = ["std", "std_rng", "thread_rng"] }
sim-tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
# `group_engine_error_samples`, for the wire fixture and classification
# tables of `GroupEngineError`, and `wire_samples`, for the MessagePack
# fixtures of the commands, responses and backup snapshot.
ursula-runtime = { workspace = true, features = ["test-support"] }
anyhow = { workspace = true }
axum = { workspace = true }
criterion = { workspace = true, features = ["async_tokio"] }
# Backend failures of the snapshot store, for the fakes and the restore table.
opendal = { workspace = true }
proptest = { workspace = true }
raft-log = "0.4.5"
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "test-util"] }
ursula-observability = { workspace = true }
core_affinity = { workspace = true }

[[bench]]
name = "disk_wal"
harness = false

[[bench]]
name = "owner_burst"
harness = false

[features]
# Lets other crates' tests run deterministic apply bugs. Never enable it in a
# shipped build.
fault-injection = []
# Lets other crates' tests read what a node's snapshot record names.
test-support = []

[lints]
workspace = true

syntax = "proto3";

package ursula.raft.v1;

// Raft RPC envelopes keep a plain proto preamble (protocol version, plane,
// group id, target node) so routing and validation never decode the payload.
// The payload itself is opaque compact MessagePack (`ursula_stream::msgpack`:
// a struct is an array of its fields in declaration order) produced by the
// serde derives of openraft's own request/response types (see
// `codec::encode_wire`).
//
// A receiver checks the protocol version first, then the target (plane,
// group and target node, `target::RaftTarget`), then looks the group up.

// The Raft plane a request names: a data group, or the meta group, whose
// group id is 0. A receiver refuses UNSPECIFIED, so a request that names no
// plane never reaches data group 0.
enum RaftPlaneV1 {
  RAFT_PLANE_V1_UNSPECIFIED = 0;
  RAFT_PLANE_V1_DATA = 1;
  RAFT_PLANE_V1_META = 2;
}

message RaftRpcEnvelopeV1 {
  uint32 raft_group_id = 1;
  // The node the request is for. A receiver of another id refuses it with
  // FAILED_PRECONDITION and its own id in `ursula-node-id` status metadata.
  uint64 node_id = 2;
  uint32 protocol_version = 3;
  // MessagePack-encoded openraft `AppendEntriesRequest` (Append RPC) or
  // `VoteRequest` (Vote and PreVote RPCs).
  bytes payload = 4;
  RaftPlaneV1 plane = 5;
}

message RaftRpcAckV1 {
  // MessagePack-encoded openraft `AppendEntriesResponse` (Append RPC) or
  // `VoteResponse` (Vote and PreVote RPCs).
  bytes payload = 1;
}

// A process-wide peer stream multiplexes independent OpenRaft Append RPCs from
// every group of one plane, which the stream's `ursula-raft-plane` request
// metadata names (`data` or `meta`); a receiver refuses an item of another
// plane. request_id is transport-local correlation only; it never enters
// the replicated state machine or changes per-group ordering.
message RaftAppendStreamRequest {
  // Fields 1 and 2 held the removed single-item request.
  reserved 1, 2;
  // One peer stream drains already-queued OpenRaft Append RPCs from every
  // group into a transport frame. Items keep independent correlation ids and
  // per-group ordering.
  repeated RaftAppendStreamRequestItem items = 3;
}

message RaftAppendStreamRequestItem {
  uint64 request_id = 1;
  RaftRpcEnvelopeV1 envelope = 2;
}

// A refused stream item: its gRPC status code and message, and on the
// misdelivery refusal (FAILED_PRECONDITION for a request meant for another
// node) the refusing node's id, which a unary refusal carries as
// `ursula-node-id` status metadata. 0 on every other refusal: node ids are
// never 0. The sender turns it back into that metadata, so one reader
// serves both.
message RaftAppendStreamError {
  int32 code = 1;
  string message = 2;
  uint64 refusing_node = 3;
}

message RaftAppendStreamResponse {
  // Fields 1-3 held the removed single-item response.
  reserved 1, 2, 3;
  repeated RaftAppendStreamResponseItem items = 4;
}

message RaftAppendStreamResponseItem {
  uint64 request_id = 1;
  oneof result {
    RaftRpcAckV1 ack = 2;
    RaftAppendStreamError error = 3;
  }
}

message RaftFullSnapshotRequestV1 {
  uint32 raft_group_id = 1;
  uint64 node_id = 2;
  uint32 protocol_version = 3;
  // MessagePack-encoded openraft `Vote`.
  bytes vote = 4;
  // MessagePack-encoded openraft `SnapshotMeta`.
  bytes snapshot_meta = 5;
  bytes snapshot_payload = 6;
  RaftPlaneV1 plane = 7;
}

message RaftFullSnapshotAckV1 {
  // MessagePack-encoded openraft `SnapshotResponse`.
  bytes response = 1;
}

message RaftTransferLeaderRequestV1 {
  uint32 raft_group_id = 1;
  uint64 node_id = 2;
  uint32 protocol_version = 3;
  // MessagePack-encoded openraft `TransferLeaderRequest`.
  bytes request = 4;
  RaftPlaneV1 plane = 5;
}

message RaftTransferLeaderAckV1 {
  // MessagePack-encoded openraft `TransferLeaderResponse`. Required: an empty
  // value is a malformed response.
  bytes response = 1;
}

message GroupWriteRequestV1 {
  uint32 raft_group_id = 1;
  uint32 core_id = 2;
  uint32 shard_id = 3;
  repeated bytes command_payloads = 4;
  // Raft gRPC protocol version (the format epoch), checked before anything
  // else. Senders before format epoch 2 omit it, so it decodes as 0.
  uint32 protocol_version = 5;
  RaftPlaneV1 plane = 6;
  // The node the request is for, refused by a receiver of another id.
  uint64 target_node = 7;
}

message GroupWriteResultV1 {
  bool ok = 1;
  bytes payload = 2;
}

message GroupWriteResponseV1 {
  repeated GroupWriteResultV1 results = 1;
}

message GroupReadRequestV1 {
  uint32 raft_group_id = 1;
  uint32 core_id = 2;
  uint32 shard_id = 3;
  string bucket_id = 4;
  string stream_id = 5;
  uint64 now_ms = 6;
  oneof read {
    HeadStreamReadV1 head = 7;
    ReadStreamReadV1 read_stream = 8;
  }
  // Field 9 was the removed attribute read in the `read` oneof.
  reserved 9;
  reserved "get_stream_attrs";
  // Field 10 was the removed affinity key.
  reserved 10;
  reserved "affinity_key";
  // Raft gRPC protocol version (the format epoch), checked before anything
  // else. Senders before format epoch 2 omit it, so it decodes as 0.
  uint32 protocol_version = 11;
  // Always DATA: the meta group serves no stream reads.
  RaftPlaneV1 plane = 12;
  // The node the request is for, refused by a receiver of another id.
  uint64 target_node = 13;
}

message HeadStreamReadV1 {
  // Set by the `offset=now` HEAD of a `consistency=local` catch-up read,
  // which reads the leader's applied state. Unset (a
  // HEAD that must reflect every acknowledged write, or a sender that omits
  // the field) the leader linearizes the HEAD (ReadIndex) before serving it.
  bool applied_state_only = 1;
}

message ReadStreamReadV1 {
  uint64 offset = 1;
  uint64 max_len = 2;
  // Fields 3-5 held the removed record-coordinate read parameters.
  reserved 3, 4, 5;
  reserved "record", "max_records", "record_anchor";
  // `consistency=leader`: the leader linearizes the read (ReadIndex) before
  // serving it.
  bool leader_only = 6;
  // What the receiver may serve when it no longer leads the group.
  FollowerReadV1 follower = 7;
}

// `ursula_runtime::FollowerRead`: what a follower may serve of a read from
// its own applied state. A receiver refuses a value it does not know, so a
// new value may be sent only once every peer of the same minor version
// knows it.
enum FollowerReadV1 {
  // Any applied prefix (a base-protocol catch-up read).
  FOLLOWER_READ_V1_PREFIX = 0;
  // Only an answer the server marks immutable (an immutable-read chunk);
  // anything else goes to the leader.
  FOLLOWER_READ_V1_IMMUTABLE = 1;
}

message GroupReadResponseV1 {
  bool ok = 1;
  bytes payload = 2;
}

// A fresh quorum-confirmed recovery boundary. A replica behind the recovery
// gate requests it from the leader; delayed inbound AppendEntries are not
// evidence.
message RejoinBarrierRequestV1 {
  uint32 raft_group_id = 1;
  uint32 protocol_version = 2;
  RaftPlaneV1 plane = 3;
  // The node the request is for, refused by a receiver of another id.
  uint64 target_node = 4;
}

message RejoinBarrierResponseV1 {
  bytes vote = 1;
  uint64 index = 2;
  // The group the answer is about, echoed from the request.
  RaftPlaneV1 plane = 3;
  uint32 raft_group_id = 4;
  // MessagePack-encoded `LeaderMemberships`: the committed and effective
  // memberships of the leader view the barrier confirmed. Required: an
  // empty value is a malformed response.
  bytes memberships = 5;
}

// The meta group's genesis probe. Field 1 is part of the frozen preamble of
// the format-epoch contract: a receiver checks it before anything else.
message GenesisProbeRequestV1 {
  uint32 protocol_version = 1;
  // The node the request is for, refused by a receiver of another id.
  uint64 target_node = 2;
  // MessagePack-encoded `GenesisProbe`: the sender's genesis claim and its
  // probe vote.
  bytes probe = 3;
}

message GenesisProbeAckV1 {
  // MessagePack-encoded `GenesisAnswer`. Required: an empty value is a
  // malformed response.
  bytes answer = 1;
}

service RaftInternal {
  rpc Append(RaftRpcEnvelopeV1) returns (RaftRpcAckV1);
  rpc AppendStream(stream RaftAppendStreamRequest) returns (stream RaftAppendStreamResponse);
  rpc Vote(RaftRpcEnvelopeV1) returns (RaftRpcAckV1);
  // Whether the target would grant the vote, answered without saving it:
  // a candidate raises its term only once a quorum would grant its vote.
  rpc PreVote(RaftRpcEnvelopeV1) returns (RaftRpcAckV1);
  rpc FullSnapshot(RaftFullSnapshotRequestV1) returns (RaftFullSnapshotAckV1);
  rpc GroupWrite(GroupWriteRequestV1) returns (GroupWriteResponseV1);
  rpc GroupRead(GroupReadRequestV1) returns (GroupReadResponseV1);
  rpc RejoinBarrier(RejoinBarrierRequestV1) returns (RejoinBarrierResponseV1);
  rpc TransferLeader(RaftTransferLeaderRequestV1) returns (RaftTransferLeaderAckV1);
  rpc GenesisProbe(GenesisProbeRequestV1) returns (GenesisProbeAckV1);
}

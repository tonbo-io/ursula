[package]
name = "ursula"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "Ursula deployment binary: Durable Streams server and gateway."

[features]
default = ["jemalloc", "release-max-info"]
# Compile out trace!/debug! in release builds to keep the hot path free. Drop
# it (`--no-default-features --features tokio-console`) when using tokio-console.
release-max-info = ["ursula-observability/release-max-info"]
tokio-console = ["dep:console-subscriber", "tokio/tracing"]
jemalloc = [
    "dep:tikv-jemallocator",
    "tikv-jemallocator/unprefixed_malloc_on_supported_platforms",
]
jemalloc-prof = [
    "jemalloc",
    "dep:tikv-jemalloc-ctl",
    "tikv-jemalloc-ctl/profiling",
    "tikv-jemallocator/profiling",
]

[dependencies]
axum = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
console-subscriber = { workspace = true, optional = true }
futures-util = { workspace = true }
fs4 = { workspace = true }
memchr = { workspace = true }
openraft = { workspace = true }
opentelemetry = { workspace = true }
rand = { workspace = true, features = ["thread_rng"] }
reqwest = { workspace = true, features = ["rustls-tls"] }
serde = { workspace = true }
blake3 = { workspace = true }
http-body-util = "0.1"
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tikv-jemalloc-ctl = { workspace = true, optional = true }
tikv-jemallocator = { workspace = true, optional = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }
tonic = { workspace = true, features = ["transport"] }
tower = { workspace = true, features = ["util", "limit", "load-shed"] }
tower-http = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
ursula-config = { workspace = true }
ursula-gateway = { workspace = true }
ursula-observability = { workspace = true, features = ["otlp"] }
ursula-headers = { workspace = true }
ursula-proto = { workspace = true }
ursula-raft = { workspace = true }
ursula-runtime = { workspace = true }
ursula-shard = { workspace = true }
ursula-stream = { workspace = true }

[target.'cfg(madsim)'.dependencies]
madsim = { workspace = true }

[dev-dependencies]
# `group_engine_error_samples`, for the wire fixture and classification
# tables of `GroupEngineError`.
ursula-runtime = { workspace = true, features = ["test-support"] }
anyhow = { workspace = true }
ursula-headers = { workspace = true, features = ["test-support"] }
criterion = { workspace = true }
flate2 = { workspace = true }
# The store errors that the tests' snapshot stores answer.
opendal = { workspace = true }
proptest = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
toml = { workspace = true }
tracing-subscriber = { workspace = true }
# Path-only: a versionless dev-dependency is dropped from the published
# manifest, so `ursula` publishes without waiting for `ursula-ctl`.
ursula-ctl = { path = "../ursula-ctl" }
# `persisted_snapshot_pointer`, which reads what a node's snapshot record names.
ursula-raft = { workspace = true, features = ["fault-injection", "test-support"] }
zstd = { workspace = true }

[[bench]]
name = "json_text"
harness = false

[[bench]]
name = "front_door"
harness = false

[lints]
workspace = true

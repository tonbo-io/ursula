[package]
name = "ursula-headers"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "Typed HTTP headers of the Ursula protocol, shared by the server and its clients."

# Standard library only: the standalone client workspaces (clients/sqlite-vfs)
# depend on this crate by path, so it must not pull the server's dependencies.
# `serde` is opt-in, for the server's admin types.
[dependencies]
serde = { workspace = true, optional = true }

[features]
serde = ["dep:serde"]
# `write_outcome::inventory`: every write answer as data, with samples, for
# the conformance tests of the server, the gateway and clients.
test-support = []

# Dev-dependencies of a path dependency do not reach its dependents.
[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true

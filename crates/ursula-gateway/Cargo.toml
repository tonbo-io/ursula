[package]
name = "ursula-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Ursula Gateway: routes client HTTP traffic while hiding internal leader redirects."

[dependencies]
axum = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true, features = ["derive"] }
futures-core = "0.3"
http-body-util = "0.1"
jsonwebtoken = { workspace = true }
percent-encoding = "2"
reqwest = { workspace = true, features = ["http2", "json", "rustls-tls", "stream"] }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "signal"] }
tracing = { workspace = true }
thiserror = { workspace = true }
ursula-observability = { workspace = true }
ursula-shard = { workspace = true }
rand = { workspace = true, features = ["thread_rng"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tokio-stream = { workspace = true }

[lints]
workspace = true

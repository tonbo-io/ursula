[package]
name = "ursula-ctl"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "Safe operational CLI for Ursula clusters: drains raft leaderships before restart, waits for applied_index catch-up, and refuses to roll if the cluster cannot make progress."

[[bin]]
name = "ursulactl"
path = "src/bin/ursulactl.rs"

[dependencies]
anyhow = { workspace = true }
blake3 = { workspace = true }
opendal = { workspace = true, features = ["services-fs", "services-s3"] }
ursula-stream = { workspace = true }
clap = { workspace = true, features = ["derive"] }
futures-util = { workspace = true }
reqwest = { workspace = true, features = ["rustls-tls", "json"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
yaml_serde = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tracing = { workspace = true }
url = { workspace = true, features = ["serde"] }
ursula-control = { workspace = true }
ursula-observability = { workspace = true }
ursula-proto = { workspace = true }
ursula-shard = { workspace = true }

[dev-dependencies]
ursula-control = { workspace = true, features = ["test-support"] }
ursula-headers = { workspace = true }
axum = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["net", "sync"] }

[lints]
workspace = true

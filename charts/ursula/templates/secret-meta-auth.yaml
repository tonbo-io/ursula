{{- if and .Values.raft.meta.enabled (not .Values.raft.meta.auth.existingSecret) }}
{{- $name := include "ursula.metaAuthSecretName" . }}
{{- $key := .Values.raft.meta.auth.key }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $credential := randAlphaNum 64 | b64enc }}
{{- if $existing }}
{{- $credential = required "existing meta auth Secret is missing its configured key; do not rotate the cluster credential during a rolling upgrade" (index $existing.data $key) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "ursula.labels" . | nindent 4 }}
type: Opaque
data:
  {{ $key | quote }}: {{ $credential | quote }}
{{- end }}

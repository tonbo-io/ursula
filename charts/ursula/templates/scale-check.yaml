{{- if .Values.server.scaleCheck.enabled }}
{{- $name := printf "%s-scale-check" (include "ursula.fullname" . | trunc 50 | trimSuffix "-") -}}
{{- $sts := include "ursula.fullname" . -}}
{{/*
Scale check, before an upgrade or a rollback changes server.replicaCount.

Node ids are ordinal + 1, so a lower count drops the highest ids, and a
higher count starts those ids again. The hook reads the live StatefulSet's
replicas with kubectl, since Helm's lookup is empty under Argo CD, and
passes when there is none (a fresh install, Argo CD's first PreSync) or the
count is unchanged, so an image-only upgrade of an unhealthy cluster passes.
A raise from 1 is refused: the chart sets neither raft.meta_voters nor
raft.placement.replication_factor, which a growing single node needs, so the
pods of a raised count would claim the defaults and report
replication_factor_mismatch.

A lower count runs `ursulactl node verify-removed` for every id it drops,
which passes once `ursulactl node decommission --wait` removed them.

A higher count runs `ursulactl node verify-joinable` for every id it starts,
which waits (up to 200 s) for a removed id's removal to complete, until the
meta leader marks the id vacant. Then, for each started ordinal whose PVC
still exists, it runs `ursulactl node verify-vacant` and acts on its exit
status alone: 0, the id is vacant, so the volume holds a removed life's disk
and is deleted, and the pod starts on an empty one that registers as a new
node; 3, the id is in a life, so the volume is that life's own and is kept
(a scale-down that skipped this hook comes back on its volumes); anything
else refuses the raise and names the PVC. ursulactl reads the meta leader's
view over the pods' client plane, which the NetworkPolicy opens to this
hook's label.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "ursula.labels" . | nindent 4 }}
    app.kubernetes.io/component: scale-check
  annotations:
    "helm.sh/hook": pre-upgrade,pre-rollback
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "ursula.labels" . | nindent 4 }}
    app.kubernetes.io/component: scale-check
  annotations:
    "helm.sh/hook": pre-upgrade,pre-rollback
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
rules:
  # The live replica count, of this release's StatefulSet only.
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    resourceNames: [{{ $sts | quote }}]
    verbs: ["get"]
  {{- $desired := .Values.server.replicaCount | int }}
  {{- if ge $desired 4 }}
  # The volumes of the ordinals a raise can start: a vacant id's is
  # deleted. A raise from 1 is refused and the chart refuses 2, so a raise
  # starts from 3 pods, and the meta voters' ordinals 0 to 2 are never
  # granted. get alone also waits out the deletion, which kubectl's own
  # --wait would do with list and watch.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    resourceNames:
      {{- range $ordinal := untilStep 3 $desired 1 }}
      - {{ printf "raft-data-%s-%d" $sts $ordinal | quote }}
      {{- end }}
    verbs: ["get", "delete"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "ursula.labels" . | nindent 4 }}
    app.kubernetes.io/component: scale-check
  annotations:
    "helm.sh/hook": pre-upgrade,pre-rollback
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "ursula.labels" . | nindent 4 }}
    app.kubernetes.io/component: scale-check
  annotations:
    "helm.sh/hook": pre-upgrade,pre-rollback
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
data:
  # The manifest of the new count: the meta voters are its lowest ids.
  cluster-manifest.json: |
{{ include "ursula.clusterManifest" . | indent 4 }}
  scale-check.sh: |
    #!/bin/sh
    set -eu
    desired={{ .Values.server.replicaCount | int }}
    live="$(kubectl --namespace {{ .Release.Namespace | quote }} get statefulset {{ $sts | quote }} \
      --ignore-not-found --output 'jsonpath={.spec.replicas}')"
    if [ -z "${live}" ]; then
      echo "scale check: no StatefulSet {{ $sts }} yet, nothing to check"
      exit 0
    fi
    if [ "${live}" -eq "${desired}" ]; then
      echo "scale check: server.replicaCount stays ${live}"
      exit 0
    fi
    if [ "${live}" -eq 1 ]; then
      echo "scale check: refused, server.replicaCount ${live} to ${desired}: a single pod never grows under this chart, which sets neither raft.meta_voters nor raft.placement.replication_factor. Install a new release and restore a backup into it" >&2
      exit 1
    fi
    manifest=/etc/ursula/scale-check/cluster-manifest.json
    if [ "${desired}" -lt "${live}" ]; then
      first=$((desired + 1))
      last="${live}"
    else
      first=$((live + 1))
      last="${desired}"
    fi
    set --
    id="${first}"
    while [ "${id}" -le "${last}" ]; do
      set -- "$@" --node "${id}"
      id=$((id + 1))
    done
    if [ "${desired}" -lt "${live}" ]; then
      echo "scale check: server.replicaCount ${live} to ${desired}, ursulactl node verify-removed" "$@"
      exec ursulactl node verify-removed --config "${manifest}" "$@"
    fi
    echo "scale check: server.replicaCount ${live} to ${desired}, ursulactl node verify-joinable" "$@"
    ursulactl node verify-joinable --config "${manifest}" --timeout-secs 200 "$@"
    ordinal="${live}"
    while [ "${ordinal}" -lt "${desired}" ]; do
      id=$((ordinal + 1))
      pvc="raft-data-{{ $sts }}-${ordinal}"
      found="$(kubectl --namespace {{ .Release.Namespace | quote }} get persistentvolumeclaim "${pvc}" \
        --ignore-not-found --output name)"
      if [ -n "${found}" ]; then
        status=0
        ursulactl node verify-vacant --config "${manifest}" --timeout-secs 30 --node "${id}" || status=$?
        case "${status}" in
          0)
            echo "scale check: node ${id} is vacant, deleting its old volume ${pvc}"
            kubectl --namespace {{ .Release.Namespace | quote }} delete persistentvolumeclaim "${pvc}" --wait=false
            # The claim stays, terminating, until its protection finalizer
            # is removed, and a pod the raise starts before that would be
            # stuck on it.
            waited=0
            while [ -n "$(kubectl --namespace {{ .Release.Namespace | quote }} get persistentvolumeclaim "${pvc}" \
              --ignore-not-found --output name)" ]; do
              if [ "${waited}" -ge 60 ]; then
                echo "scale check: refused, ${pvc} is still there 60 seconds after its delete. Check its finalizers, then run the upgrade again" >&2
                exit 1
              fi
              sleep 1
              waited=$((waited + 1))
            done
            ;;
          3)
            echo "scale check: node ${id} is in a life, keeping its volume ${pvc}"
            ;;
          *)
            echo "scale check: refused, ${pvc} holds a disk under node ${id}, which is neither vacant nor in a life. Delete it only if it holds nothing of this cluster" >&2
            exit 1
            ;;
        esac
      fi
      ordinal=$((ordinal + 1))
    done
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  labels:
    {{- include "ursula.labels" . | nindent 4 }}
    app.kubernetes.io/component: scale-check
  annotations:
    "helm.sh/hook": pre-upgrade,pre-rollback
    "helm.sh/hook-weight": "0"
    # A failed Job stays until the next attempt, so its refusal can be read.
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.server.scaleCheck.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "ursula.scaleCheckSelectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: true
      restartPolicy: Never
      {{- with .Values.server.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # The check runs ursulactl from the Ursula image, which has no
        # kubectl, so one is copied in.
        - name: copy-kubectl
          image: {{ printf "%s:%s" .Values.server.scaleCheck.kubectlImage.repository .Values.server.scaleCheck.kubectlImage.tag | quote }}
          imagePullPolicy: {{ .Values.server.scaleCheck.kubectlImage.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - cp "$(command -v kubectl)" /tools/kubectl
          {{- with .Values.server.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tools
              mountPath: /tools
      containers:
        - name: scale-check
          image: {{ include "ursula.image" . | quote }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - |
              export PATH="/tools:/usr/local/bin:${PATH}"
              exec /bin/sh /etc/ursula/scale-check/scale-check.sh
          {{- with .Values.server.scaleCheck.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.server.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tools
              mountPath: /tools
              readOnly: true
            - name: scale-check
              mountPath: /etc/ursula/scale-check
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tools
          emptyDir: {}
        - name: scale-check
          configMap:
            name: {{ $name }}
        - name: tmp
          emptyDir: {}
{{- end }}

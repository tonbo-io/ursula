{{- include "ursula.validateKeyedIndexerConfig" . -}}
{{- if .Values.keyedIndexer.enabled -}}
{{- $root := . -}}
{{- $values := .Values.keyedIndexer -}}
{{- $name := include "ursula.keyedIndexerFullname" . -}}
{{- $replicas := $values.replicaCount | int -}}
{{- $hasS3Credentials := include "ursula.hasS3Credentials" . -}}
{{- $s3CredentialSecret := include "ursula.s3SecretName" . -}}
{{- $region := .Values.s3.region | toString -}}
{{- $endpoint := .Values.s3.endpoint | toString -}}
{{- if $values.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ursula.keyedIndexerServiceAccountName" $root }}
  labels:
    {{- include "ursula.keyedIndexerLabels" $root | nindent 4 }}
  {{- with $values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ $values.serviceAccount.automountServiceAccountToken }}
{{- end }}
---
# Load-balanced entrypoint: the nodes' keyed_state_upstream.
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "ursula.keyedIndexerLabels" $root | nindent 4 }}
  {{- with $values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $values.service.type }}
  ports:
    - name: http
      port: {{ $values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "ursula.keyedIndexerSelectorLabels" $root | nindent 4 }}
---
# Stable per-pod DNS: the nodes' keyed_state.indexer_urls, drained one by one
# on bucket purge. Not-ready pods stay resolvable so a drain reaches them too.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ursula.keyedIndexerHeadlessName" $root }}
  labels:
    {{- include "ursula.keyedIndexerLabels" $root | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: http
      port: {{ $values.ports.http }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "ursula.keyedIndexerSelectorLabels" $root | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "ursula.keyedIndexerLabels" $root | nindent 4 }}
spec:
  serviceName: {{ include "ursula.keyedIndexerHeadlessName" $root }}
  replicas: {{ $replicas }}
  # Pods hold no durable state (the object store is the source of truth), so
  # they start and roll in parallel.
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "ursula.keyedIndexerSelectorLabels" $root | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ursula.keyedIndexerSelectorLabels" $root | nindent 8 }}
        {{- with $values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "ursula.keyedIndexerServiceAccountName" $root }}
      automountServiceAccountToken: {{ $values.serviceAccount.automountServiceAccountToken }}
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ $values.terminationGracePeriodSeconds }}
      {{- with $root.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: keyed-indexer
          image: {{ include "ursula.keyedIndexerImage" $root | quote }}
          imagePullPolicy: {{ default $root.Values.global.image.pullPolicy $values.image.pullPolicy }}
          command:
            - /usr/local/bin/ursula
          args:
            - indexer
            - --keyed-source-url
            - {{ include "ursula.keyedIndexerSourceUrl" $root | quote }}
            - --s3-bucket
            - {{ $root.Values.s3.bucket | toString | quote }}
            - --keyed-s3-root
            - {{ include "ursula.coldRoot" $root | quote }}
            - --cache-dir
            - /var/cache/ursula-keyed
            - --cache-max-bytes
            - {{ $values.cache.maxBytes | int64 | quote }}
            - --listen
            - {{ printf "0.0.0.0:%d" ($values.ports.http | int) | quote }}
            - --keyed-min-publish-interval-ms
            - {{ $values.minPublishIntervalMs | int64 | quote }}
            - --keyed-gc-grace-seconds
            - {{ $values.gcGraceSeconds | int64 | quote }}
            - --keyed-max-waiters
            - {{ $values.maxWaiters | int64 | quote }}
            {{- if $region }}
            - --s3-region
            - {{ $region | quote }}
            {{- end }}
            {{- if $endpoint }}
            - --s3-endpoint
            - {{ $endpoint | quote }}
            {{- end }}
            {{- with $values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ $values.ports.http }}
              protocol: TCP
          env:
            - name: RUST_LOG
              value: {{ $values.rustLog | quote }}
            {{- if $region }}
            - name: AWS_REGION
              value: {{ $region | quote }}
            - name: AWS_DEFAULT_REGION
              value: {{ $region | quote }}
            {{- end }}
            {{- if $hasS3Credentials }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $s3CredentialSecret | quote }}
                  key: accessKeyId
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $s3CredentialSecret | quote }}
                  key: secretAccessKey
            - name: AWS_SESSION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $s3CredentialSecret | quote }}
                  key: sessionToken
                  optional: true
            {{- end }}
            {{- with $values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if $values.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: /livez
              port: http
            failureThreshold: {{ $values.probes.startup.failureThreshold }}
            periodSeconds: {{ $values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ $values.probes.startup.timeoutSeconds }}
          {{- end }}
          {{- if $values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: {{ $values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ $values.probes.readiness.timeoutSeconds }}
          {{- end }}
          {{- if $values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: {{ $values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ $values.probes.liveness.timeoutSeconds }}
          {{- end }}
          {{- with $values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml $values.resources | nindent 12 }}
          volumeMounts:
            - name: cache
              mountPath: /var/cache/ursula-keyed
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cache
          emptyDir:
            sizeLimit: {{ $values.cache.emptyDir.sizeLimit | quote }}
        - name: tmp
          emptyDir: {}
      {{- with $values.scheduling.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $values.scheduling.affinity }}
      affinity:
        {{- toYaml $values.scheduling.affinity | nindent 8 }}
      {{- else if gt $replicas 1 }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "ursula.keyedIndexerSelectorLabels" $root | nindent 20 }}
                topologyKey: kubernetes.io/hostname
      {{- end }}
      {{- with $values.scheduling.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $values.scheduling.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml $values.scheduling.topologySpreadConstraints | nindent 8 }}
      {{- else if gt $replicas 1 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "ursula.keyedIndexerSelectorLabels" $root | nindent 14 }}
      {{- end }}
{{- if $values.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels:
    {{- include "ursula.keyedIndexerLabels" $root | nindent 4 }}
spec:
  maxUnavailable: {{ $values.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "ursula.keyedIndexerSelectorLabels" $root | nindent 6 }}
{{- end }}
{{- if $values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "ursula.keyedIndexerLabels" $root | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ursula.keyedIndexerSelectorLabels" $root | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $root.Release.Namespace | quote }}
      ports:
        - protocol: TCP
          port: {{ $values.ports.http }}
    {{- with $values.networkPolicy.additionalIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    - {}
{{- end }}
{{- end }}

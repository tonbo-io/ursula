global:
  image:
    # Image repository. The image must contain the `ursula` deployment binary
    # and the separate `ursulactl` operator CLI.
    repository: ghcr.io/tonbo-io/ursula
    # Image tag. Defaults to the chart appVersion when left empty.
    tag: ""
    # Kubernetes image pull policy.
    pullPolicy: IfNotPresent
  # Optional image pull secrets, rendered as `imagePullSecrets`.
  imagePullSecrets: []
  # Kubernetes cluster DNS domain used for generated peer FQDNs, the cluster manifests and gateway upstreams. A change rolls like any restart while the old domain still resolves.
  clusterDomain: cluster.local

# Override the chart name portion of generated resource names.
# Must be a lowercase DNS-1123 label when set.
nameOverride: ""
# Override the full generated release name.
# Must be a lowercase DNS-1123 label when set, with room for generated suffixes.
fullnameOverride: ""

# Optional deployment identity contract generated by infrastructure as code.
# Empty values disable the checks so non-IRSA and community deployments are
# unaffected. When set, Helm fails before creating workloads if an overlay or
# release command drifts from the IAM trust and S3 policy.
deploymentContract:
  expectedNamespace: ""
  serverServiceAccountName: ""
  serverRoleArn: ""
  serverS3Prefix: ""

serviceAccount:
  # Create a dedicated ServiceAccount for Ursula server, gateway, and test pods.
  create: true
  # Use this ServiceAccount name when create=false, or override the generated name.
  # Must be a lowercase DNS-1123 label when set.
  name: ""
  # ServiceAccount annotations, commonly used for cloud workload identity.
  annotations: {}
  # Keep Kubernetes API tokens out of pods by default.
  automountServiceAccountToken: false

server:
  # Number of Ursula server pods: 1, or 3 and more (2 tolerates no node loss
  # and is refused). Raising it from 3 or more adds nodes that register and
  # hold no group. Lowering it is permanent and needs every dropped id
  # decommissioned first (ursulactl node decommission), which the scale-check
  # hook verifies. A single pod never grows.
  replicaCount: 3
  # Allow the voter's overall 20-second shutdown budget, which includes up to
  # 5 seconds of leadership handoff, plus Kubernetes termination overhead.
  terminationGracePeriodSeconds: 30
  ports:
    # Ursula public client-plane HTTP port (stream reads/writes).
    client: 4437
    # Cluster-plane port (Raft gRPC between voters), used when clusterListen
    # is true. Only the headless peer Service exposes it.
    cluster: 4439
  # Serve the cluster plane on its own port (server.cluster_listen). Peers
  # dial ports.cluster, leader redirects name ports.client, and the client
  # Service never exposes the cluster plane. false serves both planes on
  # ports.client, so anyone who reaches the client Service reaches Raft.
  # A change moves every voter's cluster listener and needs every voter
  # restarted together: run helm upgrade without --wait or --atomic, then
  # delete every server pod at once.
  clusterListen: true
  # The mutating admin plane stays on pod loopback by default. A trusted
  # in-cluster operator or chaos controller may opt in to a pod-reachable bind
  # such as 0.0.0.0:4438; the chart never adds it to a Service.
  adminListen: 127.0.0.1:4438
  # The deployment's id (server.cluster_id), sent as Ursula-Cluster-Id on
  # every HEAD: 1 to 64 characters from A-Z, a-z, 0-9, ".", "_" and "-".
  # Required for every install, a single replica included, because the
  # chart always renders the peer list: name the environment and the region,
  # such as prod-us-east-1, and give every deployment one client can reach
  # its own. A node refuses to start when its WAL holds another id, so keep
  # the old id when a restore replaces a deployment.
  clusterId: ""
  service:
    # Render the internal client Service.
    enabled: true
    # Client Service type.
    type: ClusterIP
    # Client Service port.
    port: 4437
    # Client Service annotations.
    annotations: {}
  headlessService:
    # Headless peer Service annotations.
    annotations: {}
  networkPolicy:
    # Render a NetworkPolicy for the server pods. It needs a CNI that
    # enforces NetworkPolicy. The cluster port admits only this release's
    # server pods. The admin plane stays on loopback and needs no rule: the
    # chart refuses to render the policy when adminListen is off loopback.
    enabled: false
    # NetworkPolicy peers (podSelector, namespaceSelector, ipBlock) allowed to
    # reach the client port. Empty admits every source. This release's
    # gateway, Helm test and scale-check pods are always admitted.
    clientIngressFrom: []
  scaleCheck:
    # Render the pre-upgrade,pre-rollback hook that checks a change of
    # replicaCount: a lower count needs every dropped node id removed by
    # `ursulactl node decommission --wait`, a higher one waits for each
    # started id's removal to complete and deletes the left volume of a
    # vacant id, and a raise from 1 is refused. It reads the live StatefulSet
    # with kubectl (RBAC: get on this release's StatefulSet, get and delete
    # on the raft-data PVCs of the ordinals a raise can start).
    enabled: true
    activeDeadlineSeconds: 300
    # The image kubectl is copied from into the check's Ursula container.
    kubectlImage:
      repository: alpine/k8s
      tag: 1.33.3
      pullPolicy: IfNotPresent
    resources: {}
  # Extra annotations applied to Ursula server pods.
  podAnnotations: {}
  # Extra labels applied to Ursula server pods.
  podLabels: {}
  # Rust tracing filter passed through RUST_LOG.
  rustLog: "ursula=info,ursula_runtime=info,ursula_raft=info"
  # Number of Ursula runtime cores. Tune based on CPU requests/limits.
  coreCount: 4
  # Extra CLI args appended after the generated Ursula args.
  extraArgs: []
  # Extra container environment entries for Ursula.
  extraEnv: []
  # Extra envFrom blocks for Ursula.
  extraEnvFrom: []
  # Container resource requests and limits.
  resources: {}
  podSecurityContext:
    # Pod-level securityContext for Ursula server pods.
    fsGroup: 10001
    fsGroupChangePolicy: OnRootMismatch
  securityContext:
    # Container-level securityContext for the Ursula server container.
    runAsUser: 10001
    runAsGroup: 10001
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  probes:
    # Cold snapshot restore can take several minutes on large group counts.
    startup:
      enabled: true
      failureThreshold: 180
      periodSeconds: 5
      timeoutSeconds: 2
    # Always rendered: readiness is what paces a RollingUpdate.
    readiness:
      periodSeconds: 5
      timeoutSeconds: 2
    liveness:
      enabled: true
      periodSeconds: 10
      timeoutSeconds: 2
  podDisruptionBudget:
    # Enable quorum-friendly PDB for multi-node clusters.
    enabled: true
    # Maximum voluntary disruptions for replicaCount > 1. At most 1: each
    # data group has three voters, and two disruptions can take two of them.
    maxUnavailable: 1
  scheduling:
    nodeSelector: {}
    tolerations: []
    # Empty uses the chart's default soft hostname anti-affinity for multi-pod clusters.
    affinity: {}
    # Empty uses the chart's default zone spread constraint for multi-pod clusters.
    topologySpreadConstraints: []

raft:
  # Number of Raft groups. Defaults to a lighter quickstart than production docs.
  groupCount: 64
  # Raft log directory, mounted from each pod's raft-data PVC. Must be non-empty.
  logDir: /var/lib/ursula/raft
  # When Raft WAL appends reach stable storage. Empty leaves raft.wal.fsync unset, so the server
  # resolves it: always when the groups have one or two voters, never otherwise. never
  # acknowledges once the write is in the page cache: a host crash can cost this replica its
  # unsynced tail, and it then stays out of elections until it has caught up from the leader. A
  # group whose majority lost its tail stops until an operator accepts the loss (see README,
  # Bootstrap Behavior). always acknowledges a batch after fsync.
  walFsync: ""
  # Size at which each core's journal starts a new segment. Purge deletes whole segments, so this is
  # also how much disk space comes back at a time.
  walSegmentBytes: 67108864
  # Recent Raft entries kept in memory across the node, split evenly between its groups. Older
  # entries (a lagging follower's catch-up) are read from disk.
  walCacheBytes: 268435456
  # Reject writes and readiness below this many free bytes on the WAL filesystem.
  minAvailableBytes: 536870912
  # Resume only above this watermark to avoid readiness flapping.
  resumeAvailableBytes: 1073741824
  # Optional cap for uncommitted payload bytes per group.
  maxUncommittedBytesPerGroup: null
  # Maximum groups snapshotted in one pressure pass while the node's Raft log is below its budget.
  # Past the budget a pass starts this many for each snapshot build it keeps in flight.
  snapshotPressureMaxGroupsPerTick: 16
  # Snapshot builds a node runs at once. Each holds a copy of its group's state and its compressed
  # upload. The snapshot driver keeps one in flight while the node's Raft log is below its budget,
  # and past it more, up to this many before the hard limit of twice the budget. Unset, each server
  # keeps its own default (2 from 0.7.4, 1 before), so a pod that still runs an older image never
  # gets a setting it was not validated with.
  snapshotBuildMaxConcurrency: null
  # Far entry backstop of the snapshot driver: a group snapshots once it applied this many entries
  # since its last snapshot, whatever its log bytes. Unset, the server default (100000).
  snapshotBackstopLogs: null
  # Payload-bearing log entries retained per group after snapshot coverage.
  maxInSnapshotLogToKeep: 64
  # How long, in milliseconds, a replica keeps a deleted, purged or expired stream in its current
  # Raft snapshot and its Raft log after it applies the removal. At least the server's floor: eight
  # times the install snapshot timeout, and long enough that a removed stream's end record leaves
  # within it (980 seconds with S3 snapshots and 964 seconds inline at the default install
  # timeout and drive interval). Unset, each server keeps its own default, the larger of 1 hour
  # and the floor, so a pod that still runs an older image never gets a key it does not know.
  deletedDataMaxAgeMs: null

# Every server pod gets a raft-data PVC for its Raft WAL.
persistence:
  # StorageClass name. Empty string uses the cluster default.
  storageClassName: ""
  # PVC access modes.
  accessModes:
    - ReadWriteOnce
  # PVC size for each Ursula pod.
  size: 20Gi
  # PVC annotations.
  annotations: {}

s3:
  # Shared S3-compatible bucket for Ursula object storage.
  # Required when coldStorage.enabled=true or snapshotStore.backend=s3.
  bucket: ""
  # S3 region. Rendered as storage.cold.s3.region in the generated config when non-empty.
  region: ""
  # Optional S3-compatible endpoint, such as TOS or MinIO.
  endpoint: ""
  # Shared object prefix used with coldStorage.prefix to build storage.cold.root
  # when cold storage is enabled. Snapshot keys also use the resolved cold root
  # when present, so they are not always directly below this prefix.
  prefix: ""
  credentials:
    # Inline S3 access key. When set with secretAccessKey, the chart renders a Secret.
    accessKeyId: ""
    # Inline S3 secret key. When set with accessKeyId, the chart renders a Secret.
    secretAccessKey: ""
    # Optional inline S3 session token.
    sessionToken: ""
    # Existing Secret containing accessKeyId, secretAccessKey, and optional sessionToken.
    # When set, inline credentials are not allowed.
    existingSecret: ""

coldStorage:
  # Enable shared cold storage config. Multi-node production clusters should use S3.
  enabled: false
  # Cold backend. The chart currently renders S3 settings when enabled.
  backend: s3
  # Cold object prefix below s3.prefix.
  prefix: cold
  flush:
    intervalMs: 1000
    minHotBytes: 8388608
    # Drain undersized groups when locally led aggregate hot bytes reach this watermark.
    # This bounds memory with many groups without lowering the normal 8 MiB object target.
    pressureHotBytes: 134217728
    maxBytes: 8388608
    maxConcurrency: 4
    maxHotBytesPerGroup: 67108864
  compaction:
    # Same-stream cold chunk compaction. On by default, as in Ursula itself;
    # set false to keep the pre-compaction behaviour.
    enabled: true
    intervalMs: 30000
    targetBytes: 8388608
    maxBytes: 16777216
    maxStreamsPerPass: 16
    gcGraceMs: 300000
  cache:
    # Optional cold-read cache override. Leave all fields null/omitted to let Ursula install its default cache.
    maxSizeBytes: null
    blockSizeBytes: null
    readaheadBlocks: null

snapshotStore:
  # Snapshot backend: auto, inline or s3. Rendered as storage.snapshot.backend.
  # auto is Ursula's default: S3 snapshots whenever the S3 cold store is enabled,
  # inline otherwise. Set inline to keep snapshots inside the Raft log stores.
  backend: auto
  # Snapshot object suffix rendered as storage.snapshot.s3_prefix; resolved against
  # storage.cold.root when present, otherwise against the S3 bucket root for S3 snapshots.
  prefix: snapshots
  # Optional snapshot driver interval in milliseconds, at least 1. Leave null for the runtime
  # default (5s with S3 snapshots, 1s inline). The driver always runs.
  driveIntervalMs: null
  # Optional per-attempt timeout of an S3 snapshot-store request in milliseconds, rendered as
  # storage.snapshot.s3_timeout. Leave null for Ursula's default (10 seconds). A PUT sends the
  # whole object in one attempt, so this must also cover a healthy PUT of the largest snapshot.
  s3TimeoutMs: null
  # Optional retries of an S3 snapshot-store request, rendered as storage.snapshot.s3_max_retries.
  # Leave null for Ursula's default (1). A follower's install copy, up to four requests with this
  # timeout and these retries, must fit inside the 120 second install timeout, or the server
  # refuses to start.
  s3MaxRetries: null

gateway:
  # Enable the gateway Deployment and Service. The gateway is the default
  # external entrypoint; Ingress belongs under gateway.
  enabled: true
  # Number of gateway replicas.
  replicaCount: 2

  image:
    # Gateway image repository. Defaults to global.image.repository when empty.
    repository: ""
    # Gateway image tag. Defaults to global.image.tag / appVersion when empty.
    tag: ""
    # Gateway image pull policy. Defaults to global.image.pullPolicy when empty.
    pullPolicy: ""

  ports:
    # Gateway HTTP process listen port.
    http: 4437

  service:
    # Gateway Service type.
    type: ClusterIP
    # Gateway Service port.
    port: 4437
    # Prefer a topologically local gateway endpoint when supported by the
    # cluster. Use PreferSameZone on Kubernetes 1.35+ multi-AZ clusters.
    trafficDistribution: ""
    # Gateway Service annotations.
    annotations: {}

  ingress:
    # Render an Ingress resource for the gateway Service.
    enabled: false
    # Optional IngressClass name. Prefer this over the legacy
    # kubernetes.io/ingress.class annotation.
    className: ""
    # Ingress annotations, commonly used for controller-specific settings.
    annotations: {}
    # Extra labels applied only to the Ingress resource.
    labels: {}
    # Host rules rendered into spec.rules.
    hosts: []
    # TLS configuration rendered into spec.tls. Referenced Secrets must already exist.
    tls: []

  # Origins allowed to read across origins, or a single "*". Empty sends no CORS
  # headers at all, which leaves anonymous public_read buckets unreachable from
  # browser JavaScript. Credentials are never allowed, so "*" grants no ambient
  # access: a cross-origin caller must still present its own bearer token.
  corsAllowedOrigins: []

  # Manual upstream URLs. When empty, the chart auto-generates upstreams from
  # Ursula server pod DNS through the headless Service. Each must reach one
  # node, with nothing in between that resends requests or answers 401, 402
  # or 429.
  upstreams: []

  # Extra annotations applied to gateway pods.
  podAnnotations: {}
  # Extra labels applied to gateway pods.
  podLabels: {}
  # Rust tracing filter passed through RUST_LOG.
  rustLog: "ursula_gateway=info"
  # TCP connect timeout per upstream attempt in seconds.
  connectTimeoutSeconds: 5
  # Timeout for upstream response headers in seconds. A read or a producer
  # append that gets no answer within it goes on to another upstream, and any
  # other write is answered 504. A missing answer ejects nothing: the probes
  # decide which upstreams answer. Every request gets the time its bytes take
  # at 8 MiB/s on top: its body (4 s for 32 MiB), or the parts a snapshot
  # commit copies (up to 128 s). Keep it under the clients' timeouts and
  # above a node's 3 s leader lease, and raise it for an object store slower
  # than 8 MiB/s.
  responseHeaderTimeoutSeconds: 5
  # Seconds data sent to an upstream may stay unacknowledged before the
  # connection closes and its request fails with 502 (Linux TCP_USER_TIMEOUT).
  # Idle connections are probed three times within it. At least 1.
  upstreamTcpUserTimeoutSeconds: 5
  # Maximum request body bytes the gateway buffers for leader-redirect replay.
  # At most 33554432, the protocol's request limit, which every node applies.
  # With bodyBudgetBytes unset, the gateway grows its body budget to hold a
  # body at this limit beside its 32 MiB small-body headroom. Give the pod at
  # least twice the budget in memory. A budget cannot go below this limit
  # plus 32 MiB, so lower this limit when the pod cannot hold that.
  maxRequestBodyBytes: 33554432
  # Bytes of request bodies the gateway buffers at once, across requests
  # (--body-budget-bytes, 0.7.6 and later). Unset, the flag is not rendered,
  # so a gateway before 0.7.6, which exits on the flag, still starts, and the
  # gateway uses 256 MiB or maxRequestBodyBytes plus 32 MiB, whichever is
  # larger. Set, it must be at least maxRequestBodyBytes plus 32 MiB.
  bodyBudgetBytes: null
  # Seconds a terminating gateway pod keeps serving before it gets SIGTERM, so
  # that every node's Service proxy and any load balancer in front stop sending
  # it new connections before its listener closes. Raise it to the
  # deregistration delay of a load balancer that targets pod IPs. 0 renders no
  # preStop hook.
  preStopDelaySeconds: 10
  # Maximum graceful drain time after SIGTERM, in seconds: requests in flight
  # finish within it, and live reads end at it. Keep it above
  # responseHeaderTimeoutSeconds plus 4 s, the allowance of a 32 MiB body, so
  # that a forwarded write is answered. A snapshot parts commit waits up to
  # the base plus 128 s, so one in flight when the drain ends loses its
  # answer, and repeating the commit gets the answer from its key.
  gracefulShutdownTimeoutSeconds: 45
  # Pod grace period. Must exceed preStopDelaySeconds plus
  # gracefulShutdownTimeoutSeconds, or the kubelet kills a drain in progress.
  terminationGracePeriodSeconds: 60
  # Extra CLI args appended after the generated gateway args.
  extraArgs: []
  # Extra container environment entries for the gateway.
  extraEnv: []
  # Extra envFrom blocks for the gateway.
  extraEnvFrom: []
  # Container resource requests and limits for the gateway.
  resources: {}
  podSecurityContext:
    fsGroup: 10001
    fsGroupChangePolicy: OnRootMismatch
  securityContext:
    runAsUser: 10001
    runAsGroup: 10001
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  probes:
    startup:
      enabled: true
      failureThreshold: 30
      periodSeconds: 2
    readiness:
      enabled: true
      periodSeconds: 5
      timeoutSeconds: 2
    liveness:
      enabled: true
      periodSeconds: 10
      timeoutSeconds: 2
  podDisruptionBudget:
    # Enable a PodDisruptionBudget for the gateway.
    enabled: false
    maxUnavailable: 1
  autoscaling:
    # Enable HorizontalPodAutoscaler for the gateway.
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: null
    behavior: {}
  scheduling:
    nodeSelector: {}
    tolerations: []
    affinity: {}
    topologySpreadConstraints: []
  # Init containers to run before the gateway container.
  initContainers: []

tests:
  # Render Helm test Pod.
  enabled: true
  # Timeout for ursulactl wait-ready.
  timeoutSeconds: 120
  image:
    # Optional test image repository. Empty inherits global.image.repository.
    repository: ""
    # Optional test image tag. Empty inherits global.image.tag / appVersion.
    tag: ""
    # Optional test image pull policy. Empty inherits global.image.pullPolicy.
    pullPolicy: ""
